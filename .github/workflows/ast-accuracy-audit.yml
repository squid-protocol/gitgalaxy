name: AST Accuracy Audit

# Unlike ruff/mypy/dead-key-audit.yml, this needs full git history (not the
# default shallow clone) -- tests/ast_accuracy_audit.py measures extraction
# accuracy against a corpus pinned to a fixed git tag (`git archive`), and a
# shallow checkout wouldn't have that tag's objects available.

on:
  pull_request:
    branches:
      - main
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ast-accuracy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"

      # No full-precision extras needed: function/class/args extraction
      # (what this check measures) comes from detector.py's regex engine
      # regardless of dependency mode -- only network/ML-derived columns
      # (pagerank, blast radius) need networkx/tiktoken/pandas/xgboost, and
      # this check never reads those.
      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run baseline-gated regression check (#1200)
        run: python tests/ast_accuracy_audit.py --ci
