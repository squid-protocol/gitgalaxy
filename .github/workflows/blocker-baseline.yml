name: Blocker Baseline

# #4863: AD-HOC runs only. The nightly blockers baseline is no longer surveyed here: evidence-refresh.yml's `refresh` job
# surveys main once a night (the same `cics_census.py survey --baseline --no-census` on the same pinned corpora) and its
# `publish-blockers` job publishes blockers.txt / blockers.json and one blockers_history.jsonl line to the `generated`
# branch (docs/language_status/blockers/). This workflow surveyed the same corpora a second time (4-22 min a night) and
# uploaded an artifact nobody read. Kept for a dispatch of a given ref (--sha of the dispatched commit), e.g. a branch
# before its PR: the artifact is blockers.txt / blockers.json / meta.json, never a commit.
#
# The BURNED / pinned corpora only (tests/cobol_mainframe/corpora.json), with --no-census: the census repos
# (estate4_draw.INELIGIBLE_LIST) are never cloned in CI. The census counts are a local run (`equivalence_env.py
# --provision`, then `cics_census.py survey --baseline`). Measures only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: baseline survey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
      GG_SCRATCH: ${{ github.workspace }}/scratch
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy with the translator
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      # #8100: the grammar pack downloads its manifest from GitHub on first use; a timeout there failed a main run.
      # Restore the pack, then fetch it once with retries (a miss costs one download, a flake costs a retry).
      - name: Cache tree-sitter language pack
        id: tree_sitter_language_pack
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('gitgalaxy/ci/requirements/treesitter.txt') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Prefetch the COBOL grammar (retried)
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- python -c "from tree_sitter_language_pack import get_parser; get_parser('cobol')"

      - name: Save the tree-sitter language pack to the cache (main)
        if: success() && github.event_name != 'pull_request' && steps.tree_sitter_language_pack.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('gitgalaxy/ci/requirements/treesitter.txt') }}

      - name: Setup JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Baseline survey (burned / pinned corpora, no census)
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/cics_census.py survey --baseline --no-census --no-fetch \
            --sha "$GITHUB_SHA" --root "$GG_SCRATCH" --top 25
          d="$GG_SCRATCH/census-cache/$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/blockers"
          cp "$d/blockers.txt" "$d/blockers.json" "$d/meta.json" "$RUNNER_TEMP/blockers/"
          {
            echo "## Blocker baseline (${GITHUB_SHA::12}, burned / pinned corpora, no census)"
            echo '```'
            head -40 "$d/blockers.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the survey logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocker-baseline-logs
          path: ${{ github.workspace }}/scratch/census-cache/*/before-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload blockers.txt / blockers.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockers-${{ github.sha }}
          path: ${{ runner.temp }}/blockers/
          retention-days: 90
