name: Blocker Baseline

# #4270: the nightly baseline of the "blocker-driven" CICS work -- `cics_census.py survey --baseline` on main's head:
# every COBOL program of the pinned mainframe corpora translated by the det translator (translation only, no compile),
# then `blockers`: programs translated whole and every gap ranked by the programs fixing it would make whole. The
# result is an artifact (blockers.txt / blockers.json / meta.json), never a commit; the series of merged slices is
# docs/language_status/blockers_history.jsonl, appended by `cics_census.py history append`.
#
# The BURNED / pinned corpora only (tests/cobol_mainframe/corpora.json, as every other CI job fetches them), with
# --no-census: the census repos (estate4_draw.INELIGIBLE_LIST) are never cloned in CI. The full baseline with the
# census is a local run (`equivalence_env.py --provision`, then `cics_census.py survey --baseline`).
# Measures only: it fails only when the survey itself cannot run.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: baseline survey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
      GG_SCRATCH: ${{ github.workspace }}/scratch
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy with the translator
        run: |
          python -m pip install --upgrade pip
          pip install -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Baseline survey (burned / pinned corpora, no census)
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/cics_census.py survey --baseline --no-census --no-fetch \
            --sha "$GITHUB_SHA" --root "$GG_SCRATCH" --top 25
          d="$GG_SCRATCH/census-cache/$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/blockers"
          cp "$d/blockers.txt" "$d/blockers.json" "$d/meta.json" "$RUNNER_TEMP/blockers/"
          {
            echo "## Blocker baseline (${GITHUB_SHA::12}, burned / pinned corpora, no census)"
            echo '```'
            head -40 "$d/blockers.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the survey logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocker-baseline-logs
          path: ${{ github.workspace }}/scratch/census-cache/*/before-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload blockers.txt / blockers.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockers-${{ github.sha }}
          path: ${{ runner.temp }}/blockers/
          retention-days: 90
