name: Call Graph Accuracy Audit

# #3332 Level 1: precision/recall of each function's calls_out_to against
# tree-sitter call nodes on the pinned language-crucible, per language, gated
# against tests/call_graph_accuracy_baseline.json (a drop beyond 0.5pp fails).
# Same corpus pin and fork fallback as tree-sitter-accuracy-audit.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/call_graph_accuracy.py"
      - "tests/call_graph_accuracy_baseline.json"
      - ".github/workflows/call-graph-accuracy-audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call-graph-accuracy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy + tree-sitter-language-pack
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip
          pip install -e .
          pip install tree-sitter-language-pack

      - name: Fetch Language Crucible corpus (pinned via LANGUAGE_CRUCIBLE_REF)
        run: |
          ref="${{ vars.LANGUAGE_CRUCIBLE_REF }}"
          if [ -z "$ref" ]; then
            ref=$(sed -n 's/^PINNED_TAG = "\(.*\)"/\1/p' gitgalaxy/tests/_crucible_pin.py)
          fi
          if [ -z "$ref" ]; then
            echo "::error title=Corpus pin unavailable::No LANGUAGE_CRUCIBLE_REF and no PINNED_TAG in tests/_crucible_pin.py."
            exit 1
          fi
          git clone --branch "$ref" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Gate callee-name precision/recall against the baseline
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/call_graph_accuracy.py --ci --samples 8
