name: Call Graph Accuracy Audit

# #3332 Level 1: precision/recall of each function's calls_out_to against
# tree-sitter call nodes on the pinned language-crucible, per language, gated
# against tests/call_graph_accuracy_baseline.json (a drop beyond 0.5pp fails).
# #6501: a `plan` job (tests/tools/accuracy_audit_plan.py) skips the install and the scan when the diff cannot move a row
# (a comment, `_meta`, a language outside the baseline). A failed plan runs it; the check name is unchanged.
# Same corpus pin and fork fallback as tree-sitter-accuracy-audit.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/call_graph_accuracy.py"
      - "tests/call_graph_accuracy_baseline.json"
      - ".github/workflows/call-graph-accuracy-audit.yml"
      - "tests/crucible_pins.toml"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/accuracy_audit_plan.py"  # #6501: the plan job's own code
      - "tests/tools/graph_accuracy_plan.py"  # #6501: imported by the planner
      - "tests/tools/change_classifier.py"  # #6501: imported by the planner

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: does the diff move this audit? (accuracy_audit_plan.py reads the changed language file's diff: a comment, a
  # `_meta` edit or, for detection, a key the lens never reads cannot). The main job's steps run unless it says `false`.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git diff origin/main...HEAD needs the merge base
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the audit
        id: plan
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          python3 tests/tools/accuracy_audit_plan.py --audit call-graph --event "$GITHUB_EVENT_NAME" --base origin/main \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-audit plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  call-graph-accuracy-audit:
    needs: [plan]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104: draft PRs skip heavy CI; always(): a failed plan runs the audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitGalaxy PR
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy + tree-sitter-language-pack
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Gate callee-name precision/recall against the baseline
        if: needs.plan.outputs.run != 'false'
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/call_graph_accuracy.py --ci --samples 8
