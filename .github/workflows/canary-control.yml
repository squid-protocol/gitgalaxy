name: Canary Control

# #7155 part 2: a weekly control PR. A real, ready-for-review PR from a `canary/` branch carries one planted, inert
# defect per gate (tests/tools/canary_control.py); every gate that should go red must. `open` opens that PR and a clean
# control PR (false-alarm measure); `results` (12 h later) posts the detection matrix, raises a priority: high issue for
# a miss or a false alarm, closes the PRs and deletes their branches. The `ci-gate` hold (the shepherd's, owner-only) is
# a later slice. Never merge a PR it opens; no label is added.
#
# Off-peak (Sunday 03:17 UTC) so the control PR does not queue behind working hours on the 20-runner pool.
# It checks out main only and plants new files; nothing under .github/ or a release path (canary_control.problems).

on:
  schedule:
    - cron: "17 3 * * 0"
    - cron: "17 15 * * 0"
  workflow_dispatch:
    inputs:
      action:
        description: "open the control PRs, or settle the open ones"
        type: choice
        options: [open, results]
        default: open

permissions:
  contents: read

concurrency:
  group: canary-control
  cancel-in-progress: false

jobs:
  open:
    if: github.event.schedule == '17 3 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.action == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      # A PR opened with the repo GITHUB_TOKEN raises no pull_request run, so the gates would never run on it.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          persist-credentials: true

      - name: Open the control PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
        run: |
          python3 tests/tools/canary_control.py open
          python3 tests/tools/canary_control.py open --clean

  results:
    if: github.event.schedule == '17 15 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.action == 'results')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          persist-credentials: false

      - name: Settle the canary PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
        run: python3 tests/tools/canary_control.py results
