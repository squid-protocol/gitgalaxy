name: CICS Crucible

# #3989: gitgalaxy's CICS pipeline measured against cics-crucible (squid-protocol/cics-crucible),
# an adversarial benchmark whose every scenario carries a hand-written expected event log derived
# from IBM's documentation. tests/tools/cics_crucible.py scans each case (engine-facts), generates
# and compiles its Spring Boot project (forge-compile), runs the COBOL task by task on the harness's
# stub CICS runtime in GnuCOBOL (cobol-stub) and the generated services through CicsTask (java),
# and compares each scenario with its log exactly. Most cells fail or are unsupported today: the
# baseline (tests/cics_crucible/baseline.json) ledgers them, and this job holds it as a ratchet --
# a cell failing that the ledger does not list fails the run, and so does a ledgered cell that now
# passes (lower the ledger with --update-baseline), so it only ever shrinks.
# #4023: the cobol-stub side also runs the COBOL traced (-ftraceall), and tests/cics_crucible/coverage.json
# holds, per scenario, the paragraphs and branch outcomes it executes: a change that loses (or gains) one
# fails the run until it is re-baselined, so a crucible change cannot silently shrink what a proof proves.
#
# The crucible is cloned at PINNED_REF, read straight out of tests/crucible_pins.toml (there is no
# repository variable for this pin), so a fork's pull_request run clones the same public ref with no
# credentials. The runner's own tests run once, with EQUIVALENCE_E2E=1 (job `runner-tests`): the fixture case goes
# through every side, proving the drivers before the ratchet is trusted.
#
# #5498: the 43 cases ran one after another (20 of the job's 24 min). They are cut into SHARDS balanced by case
# seconds (cics_crucible.py shard_plan), each its own runner with its own GnuCOBOL container and Maven; a shard holds
# the two ledgers cut to its cases. The job `crucible` (the required check's name) merges the shards' results.json,
# fails unless every case ran in exactly one shard, prints the whole 710-cell report and holds the full ratchet.
# #5882: a shard measures four cases at once (--jobs 4, one per vCPU), so two shards do what four did; each job
# costs ~40 s of setup and a runner slot of the shared pool. #5919: the `plan` job picks the shard count and timeout.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
    paths:
      - "gitgalaxy/**"
      # #6278 item 4: a standalone tool nothing here imports and two generator READMEs the pipeline never reads
      # (test_engine_reach_workflows.py proves both from the import closure and the classifier)
      - "!gitgalaxy/tools/terabyte_log_scanning/**"
      - "!gitgalaxy/tools/cobol_to_java/README.md"
      - "!gitgalaxy/tools/cobol_to_cobol/README.md"
      # every other .md under gitgalaxy/ is engine prose: tests read it (the suite plan runs those), this gate does not
      - "!gitgalaxy/**/*.md"
      - "pyproject.toml"
      - "tests/tools/cics_crucible*.py"
      - "tests/tools/crucible_port_provenance.py"
      - "tests/tools/equivalence_cics.py"
      - "tests/tools/cobol_coverage.py"
      - "gitgalaxy/tools/cobol_to_cobol/cobol_graveyard_finder.py"
      - "tests/tools/equivalence_common.py"
      - "tests/tools/equivalence_java.py"
      - "tests/tools/java_target_matrix.py"
      - "tests/tools/cobol_answer_key.py"
      - "tests/equivalence/cics/**"
      - "tests/equivalence/gnucobol.Dockerfile"
      - "tests/tools/equivalence_oracle.py"
      - "tests/cics_crucible/**"
      - "tests/_cics_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - ".github/workflows/cics-crucible.yml"
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/crucible_shard_plan.py"  # #5919: the plan job's shard count and timeout
      - "tests/tools/ci_shard_plan.py"
      - "tests/tools/time_ratchet.py"  # #5257: the per-test time ratchet step
  # #5131/#5136: no main push trigger. post-merge.yml dispatches this on main (at most once per cadence window, only
  # when PR runners are idle and main changed a file this workflow reads); the nightly run covers a busy day.
  schedule:
    # nightly (#5136; weekly before): Maven Central drift, and (#4309) whether the pinned GnuCOBOL package still
    # installs -- Debian drops a superseded version from deb.debian.org at a point release; the pinned build then
    # fails here, loudly
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # #4825: read-only, so a superseded main run is cancelled too (frees runners for PRs)

jobs:
  # #5919: the shard count and the measure jobs' timeout come from the cases and their measured seconds
  # (tests/tools/crucible_shard_plan.py), not from this file: adding cases needs no edit here.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      timeout: ${{ steps.shards.outputs.timeout }}
    steps:
      - name: Checkout the planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false
          sparse-checkout: |
            tests/tools/crucible_shard_plan.py
            tests/tools/ci_shard_plan.py
            tests/tools/crucible_pins.py
            tests/crucible_pins.toml

      - name: Clone cics-crucible at the pin
        run: |
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Size the shards from the cases
        id: shards
        run: python3 gitgalaxy/tests/tools/crucible_shard_plan.py --cics cics-crucible >> "$GITHUB_OUTPUT"

  measure:
    name: measure (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}  # #5919: the slowest planned shard x 1.5, not hand-set
    strategy:
      fail-fast: false  # every shard reports its own cells
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}  # shard i of N below; merge_shards fails if a shard's results are missing
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD
          echo "cics-crucible at $ref ($(git -C cics-crucible rev-parse HEAD))"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/pytest.txt && pip install --no-build-isolation -e ./gitgalaxy

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        id: maven_dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: cics-crucible-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            cics-crucible-m2-
            java-compile-m2-

      # The oracle image is built once per Dockerfile: saved with `docker save` under the Dockerfile's hash, loaded by
      # every later run and shard. The fingerprint check below is still the pin (#4309): a stale image fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        run: |
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Measure this shard against the ledgers cut to its cases
        env:
          GITGALAXY_ORACLE_STRICT: "1"
        run: |
          cd gitgalaxy
          # #5882: four cases at once, one per vCPU (results and log the same as one at a time)
          python tests/tools/cics_crucible.py --crucible ../cics-crucible --shard ${{ matrix.shard }}/${{ matrix.total }} --jobs 4 --ci --out "$RUNNER_TEMP/cics_crucible"

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cics-crucible-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cics_crucible
          if-no-files-found: ignore

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the Maven dependencies to the cache
        if: success() && github.event_name != 'pull_request' && steps.maven_dependencies.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: cics-crucible-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the GnuCOBOL oracle image to the cache
        if: success() && github.event_name != 'pull_request' && steps.image.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

  runner-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # #5954: the tests that read CICS_CRUCIBLE_PATH need the checkout (the pin is tests/crucible_pins.toml).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/pytest.txt && pip install --no-build-isolation -e ./gitgalaxy

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        id: maven_dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: cics-crucible-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            cics-crucible-m2-
            java-compile-m2-

      # The oracle image is built once per Dockerfile: saved with `docker save` under the Dockerfile's hash, loaded by
      # every later run and shard. The fingerprint check below is still the pin (#4309): a stale image fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        run: |
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: The runner's own tests (the fixture end to end)
        env:
          EQUIVALENCE_E2E: "1"
          GITGALAXY_ORACLE_STRICT: "1"
          CICS_CRUCIBLE_PATH: ${{ github.workspace }}/cics-crucible  # #5954: un-skips test_det_port_bytes_4965
          GITGALAXY_TEST_TIMES: ${{ runner.temp }}/times-cics-crucible-e2e.json  # #5257: tests/conftest.py writes each test's seconds
        run: |
          cd gitgalaxy
          python -m pytest -q -p no:cacheprovider tests/cics_crucible -m e2e

      # #5954: the files that read the checkout but are not marked e2e (the -m e2e selection above leaves them out)
      - name: The tests that read the crucible checkout
        env:
          CICS_CRUCIBLE_PATH: ${{ github.workspace }}/cics-crucible
          GITGALAXY_TEST_TIMES: ${{ runner.temp }}/times-cics-crucible-checkout.json  # #5257
        run: |
          cd gitgalaxy
          python -m pytest -q -p no:cacheprovider -m "not e2e" tests/cics_crucible/test_cics_crucible_runner.py tests/tools/test_blocker_report.py tests/tools/test_crucible_case.py tests/cobol_mainframe/test_blocker_leak.py

      # #5257 (sibling of #5166): the e2e tests run only here, so this is the one run that times them
      - name: Per-test time ratchet (#5257)
        run: |
          cd gitgalaxy
          python tests/tools/time_ratchet.py check --times "$RUNNER_TEMP/times-cics-crucible-e2e.json" "$RUNNER_TEMP/times-cics-crucible-checkout.json"

      - name: Upload this job's test times (#5257)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-cics-crucible
          path: |
            ${{ runner.temp }}/times-cics-crucible-e2e.json
            ${{ runner.temp }}/times-cics-crucible-checkout.json
          retention-days: 7
          if-no-files-found: ignore

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the Maven dependencies to the cache
        if: success() && github.event_name != 'pull_request' && steps.maven_dependencies.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: cics-crucible-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the GnuCOBOL oracle image to the cache
        if: success() && github.event_name != 'pull_request' && steps.image.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

  # The required check (its name is the job id). Always runs: a shard that failed or never started is a failure here,
  # never a pass by absence.
  crucible:
    needs: [plan, measure, runner-tests]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD
          echo "cics-crucible at $ref ($(git -C cics-crucible rev-parse HEAD))"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/pytest.txt && pip install --no-build-isolation -e ./gitgalaxy

      - name: Download every shard's results
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cics-crucible-shard-*
          path: ${{ runner.temp }}/shards

      - name: Merge the shards, check each case ran in exactly one, hold the whole ratchet
        if: always()
        run: |
          cd gitgalaxy
          python tests/tools/cics_crucible.py --crucible ../cics-crucible --ci --merge "$RUNNER_TEMP"/shards/cics-crucible-shard-* --out "$RUNNER_TEMP/cics_crucible"

      - name: Publish the report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cics_crucible/report.md" ]; then cat "$RUNNER_TEMP/cics_crucible/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cics-crucible-results
          path: ${{ runner.temp }}/cics_crucible
          if-no-files-found: ignore

      - name: Fail unless every shard and the runner tests passed
        if: always()
        run: |
          echo "measure: ${{ needs.measure.result }}, runner-tests: ${{ needs.runner-tests.result }}"
          [ "${{ needs.measure.result }}" = "success" ] && [ "${{ needs.runner-tests.result }}" = "success" ]
