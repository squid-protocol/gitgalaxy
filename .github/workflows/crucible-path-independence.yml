name: Crucible Path Independence

# #4248: scan the language-crucible corpus from two parent paths (one under
# tmp/docs/vendor/src) and fail, naming the differing leaves, if the results differ.
# Engine changes only; one leg (full-precision) because the comparison is scan-vs-scan.
# Also run it by hand after a language-crucible pin bump (tests/_crucible_pin.py).

on:
  pull_request:
    branches:
      - main
      - v6-dev
    paths:
      - "gitgalaxy/**"
      - "tests/tools/crucible_path_check.py"
      - "tests/golden_diff.py"
      - "tests/_crucible_pin.py"
      - ".github/workflows/crucible-path-independence.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  path-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GitGalaxy Environment
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip setuptools wheel
          pip install PyYAML tiktoken "pandas>=2.0.0" xgboost
          pip install -e .

      - name: Fetch Language Crucible (pinned)
        run: |
          # Same pin resolution as golden-crucible.yml (fork PRs get no repository variables).
          ref="${{ vars.LANGUAGE_CRUCIBLE_REF }}"
          if [ -z "$ref" ]; then
            ref=$(sed -n 's/^PINNED_TAG = "\(.*\)"/\1/p' gitgalaxy/tests/_crucible_pin.py)
          fi
          if [ -z "$ref" ]; then
            echo "::error title=Corpus pin unavailable::No LANGUAGE_CRUCIBLE_REF and no PINNED_TAG in tests/_crucible_pin.py."
            exit 1
          fi
          git clone --branch "$ref" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Scan the corpus from two parent paths
        run: |
          cd gitgalaxy
          python tests/tools/crucible_path_check.py --corpus ../language-crucible/data
