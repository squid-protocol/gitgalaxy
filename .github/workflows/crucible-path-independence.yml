name: Crucible Path Independence

# #4248: scan the language-crucible corpus from two parent paths (one under
# tmp/docs/vendor/src) and fail, naming the differing leaves, if the results differ.
# Engine changes only; one leg (full-precision) because the comparison is scan-vs-scan.
# Also run it by hand after a language-crucible pin bump (tests/crucible_pins.toml).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
      - v6-dev
    paths:
      - "gitgalaxy/**"
      - "tests/tools/crucible_path_check.py"
      - "tests/golden_diff.py"
      - "tests/_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - ".github/workflows/crucible-path-independence.yml"
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      # never read by a scan: the COBOL-to-Java translator and its entry point, and prose
      - "!gitgalaxy/tools/cobol_to_java/**"
      - "!gitgalaxy/cobol_to_java_controller.py"
      - "!**/*.md"
  # #6670: post-merge.yml dispatches this on main (cadence window, only when PR runners are idle and main changed
  # a file these paths match); the nightly run covers a busy day.
  schedule:
    - cron: "11 6 * * *"  # nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  path-independence:
    # #6670: not on a PR (it never failed on one in 7 days; pr_gates.py runs it before a push). The pull_request trigger
    # stays for its `paths`: post_merge_dispatch.py reads them as this workflow's relevance filter on main.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~5 min in CI (two crucible scans); a hang should fail fast
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy Environment
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/engines.txt
          pip install --no-build-isolation -e .

      - name: Fetch Language Crucible (pinned)
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Scan the corpus from two parent paths
        run: |
          cd gitgalaxy
          python tests/tools/crucible_path_check.py --corpus ../language-crucible/data
