name: Det Sweep

# #4463: every det port re-proven against GnuCOBOL, so a det port that stops proving is caught by CI. Before this
# workflow, nothing ran the det sweep: four ports (carddemo-menu, mortgage-cmort / mlist / nbrvl) stopped proving
# on 2026-10-04 (a scenario past its table, X8; a Java keyword as a field name) and stayed broken until a local
# sweep found them.
#
# `proof_sweep.py --det-only --skip-db2` translates each equivalence case with the det translator
# (gitgalaxy/tools/cobol_to_java/det) and proves it with tests/tools/equivalence.py, then checks the verdicts against
# tests/equivalence/det_sweep_baseline.json (the cases not proven yet, each with its issue): a case that stops proving, or a listed one that now
# proves, fails the run. The Db2 cases are left out of the shards (IBM's Db2 container takes minutes to start) and
# proven by the `db2` job instead (#4901, below); the model-written ports are re-proven by Evidence Refresh.
#
# Fast (#4463 follow-up): three jobs. `plan` reads the diff: a pull request that touches only tests/equivalence/<case>/
# proves just those cases (and the cases that take their ports); anything else, and every nightly, proves all
# of them (tests/tools/det_sweep_plan.py: when in doubt, full). `shard` proves the plan on up to 6 runners (#4814: one per ~3 cases, #5135: at most 6 so a run fits the 20-job pool; a translator change is narrowed by its port diff)
# (proof_sweep.py --shard I/N, balanced by tests/equivalence/det_sweep_durations.json), each with the GnuCOBOL image
# restored from cache. (A cache of the COBOL-side step outputs was tried and dropped: it saved no measurable time --
# the Java build and the fault runs dominate a proof, not the COBOL step.)
# `det` (the required check, named as before) merges the shards' results and applies the two-way ratchet.
# #4901: `db2` runs beside the shards (needs: plan only) when the plan moves a Db2 case (tests/tools/det_sweep_plan.py
# splits `db2_cases` off): Db2 started in the background first so it overlaps the setup, then `proof_sweep.py
# --det-only --db2-only --cases ...`. Its results join `det`'s ratchet, so a moved Db2 case that stops proving is red,
# as a non-Db2 one; when none moved the job is skipped (no cost). A pull request or a manual run that plans a FULL sweep
# proves all the Db2 cases (4 runners); the nightly leaves them to Evidence Refresh's Db2 job, which runs just after it
# and re-proves every Db2 case anyway (a second Db2 pass here would double its cost for nothing).
# Balancing (#4847): the shards are balanced by the durations file, which every run restores from the newest
# nightly's cache (`durations-cache/`, saved by the nightly `det` job from the shards' measured seconds) and
# falls back to the committed tests/equivalence/det_sweep_durations.json on a miss.
#
# Pull requests run it only when what a det proof reads changes: the translator and the generator it builds on,
# the harness and oracle, the cases, the corpus pin.

on:
  pull_request:  # #4825: no path filter -- `det` is a required check; det_sweep_plan.py proves nothing (mode none)
    branches: [main]  # when no changed file is a det input (DET_INPUTS), so a docs-only PR passes `det` in about a minute
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: not on a draft; no label events: any label change (the shepherd's status labels too) had
    # cancelled the running sweep and failed the required `det` check (#4854). shepherd:full is read live by the plan
    # step, and the shepherd reruns the latest sweep when a maintainer adds it (tests/tools/shepherd_gh.py)
  schedule:
    - cron: "41 4 * * *"  # nightly: the scan engine moves too (#4245 broke the mortgage ports from an engine change)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the PR's labels, read live (shepherd:full)
    timeout-minutes: 25  # a minute normally; ~10 when a translator change needs the port diff (#4814)
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    outputs:  # #4814: the port-diff plan (steps.final) replaces the first one when it ran
      mode: ${{ steps.final.outputs.mode || steps.plan.outputs.mode }}
      cases: ${{ steps.final.outputs.cases || steps.plan.outputs.cases }}
      matrix: ${{ steps.final.outputs.matrix || steps.plan.outputs.matrix }}
      shards: ${{ steps.final.outputs.shards || steps.plan.outputs.shards }}
      db2_cases: ${{ steps.final.outputs.db2_cases || steps.plan.outputs.db2_cases }}  # #4901
      db2_matrix: ${{ steps.final.outputs.db2_matrix || steps.plan.outputs.db2_matrix }}
      db2_shards: ${{ steps.final.outputs.db2_shards || steps.plan.outputs.db2_shards }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git diff origin/main...HEAD needs the merge base
          persist-credentials: false

      - name: Plan the sweep
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          labels=""
          if [ -n "$PR" ]; then labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' || true); fi
          python3 tests/tools/det_sweep_plan.py --event "$GITHUB_EVENT_NAME" --base origin/main \
            --labels "$labels" --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Det sweep plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # #4814: a change confined to the det translator / runtime (mode "ports") is judged by the ports it changes:
      # det_port.py check translates every case at origin/main and at HEAD (no Docker, no JDK) and lists the ports
      # that differ; only those, the cases the PR touched and their dependents are proven. The rest are carried
      # forward from main, where the nightly full sweep (schedule) re-proves everything with no shortcut.
      - name: Setup Python (port diff)
        if: steps.plan.outputs.mode == 'ports'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      - name: Install GitGalaxy with the translator (port diff)
        if: steps.plan.outputs.mode == 'ports'
        run: |
          tests/tools/ci_retry.sh 4 10 -- python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          tests/tools/ci_retry.sh 4 10 -- pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --no-build-isolation -e ".[translator]"

      - name: Cache the pinned corpora (port diff)
        id: corpora
        if: steps.plan.outputs.mode == 'ports'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('tests/cobol_mainframe/corpora.json') }}

      - name: Port diff against main
        if: steps.plan.outputs.mode == 'ports'
        run: |
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch
          # exit 1 means "some port changed"; a crash leaves no check.json and the next step plans a full sweep
          PYTHONPATH="$PWD" python tests/tools/det_port.py check --work "$RUNNER_TEMP/portcheck" --base-ref origin/main \
            | tail -40 || true

      # #5024: restore-only on pull requests. A PR's cache scope is its own ref, so a PR that saved here left
      # a copy per PR (a PR that edits corpora.json) that nothing else could read. Main saves it, once per key.
      - name: Save the pinned corpora (main)
        if: steps.plan.outputs.mode == 'ports' && github.event_name != 'pull_request' && steps.corpora.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a miss only costs the next run a clone
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('tests/cobol_mainframe/corpora.json') }}

      - name: Plan from the port diff
        id: final
        if: steps.plan.outputs.mode == 'ports'
        env:
          TOUCHED: ${{ steps.plan.outputs.cases }}
        run: |
          python3 tests/tools/det_sweep_plan.py --ports "$RUNNER_TEMP/portcheck/check.json" --touched "$TOUCHED" \
            --github-output "$GITHUB_OUTPUT" | tee plan2.json
          {
            echo "## Det sweep plan, from the port diff"
            echo '```json'
            cat plan2.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # #5048: the durations every shard and Db2 shard balances by, chosen ONCE here (the newest measured ones, else the
      # committed file) and handed on as an artifact: shards that restored different files cut different slices.
      - name: Restore the newest measured durations (#4847)
        id: durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: det-durations-${{ github.run_id }}  # never an exact hit: restore-keys takes the newest saved one
          restore-keys: |
            det-durations-

      - name: Choose the durations for every shard
        run: |
          if [ -n "${{ steps.durations.outputs.cache-matched-key }}" ]; then
            cp durations-cache/det_sweep_durations.json tests/equivalence/det_sweep_durations.json
          fi

      - name: Hand the durations to the shards (#5048)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-durations
          path: tests/equivalence/det_sweep_durations.json
          if-no-files-found: error
          retention-days: 1

  # #4901: the Db2 cases the plan moves, on runners of their own, in parallel with the shards.
  db2:
    name: db2 ${{ matrix.shard }}
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.plan.outputs.db2_shards != '0' && needs.plan.outputs.db2_shards != '') }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 18  # measured: a 9-10 case shard took 8.5-11.7 min from job start (full run, #4901)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.db2_matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      # #5262: the pinned image comes from actions/cache (key = its digest) so no shard asks icr.io; only main saves
      # (below), a pull request restores main's entry and never writes its own multi-GB copy. A miss pulls as before.
      - name: Name the Db2 image cache entry (#5262)
        id: db2key
        run: echo "key=$(python3 gitgalaxy/tests/tools/db2_image_cache.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned Db2 image from the cache (#5262)
        id: db2image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/db2-image-cache
          key: ${{ steps.db2key.outputs.key }}

      # #5048: the pull is retried (bounded); a final failure is only logged here, the harness pulls again (pull_image).
      # The pull overlaps everything below; the image is the one tests/tools/equivalence_db2.py pins by digest (#4733).
      - name: Load or pull the pinned Db2 image in the background (#4733, #4901, #5262)
        run: |
          image=$(grep -oE 'icr\.io/db2_community/db2@sha256:[0-9a-f]{64}' gitgalaxy/tests/tools/equivalence_db2.py | head -1)
          echo "Db2 image: $image (cache: ${{ steps.db2image.outputs.cache-hit == 'true' && 'hit' || 'miss' }})"
          echo "DB2 image: \`$image\` (cache: ${{ steps.db2image.outputs.cache-hit == 'true' && 'hit' || 'miss' }})" >> "$GITHUB_STEP_SUMMARY"
          date +%s > "$RUNNER_TEMP/t0"
          setsid nohup bash -c "python3 gitgalaxy/tests/tools/db2_image_cache.py load '$RUNNER_TEMP/db2-image-cache' || gitgalaxy/tests/tools/ci_retry.sh 4 15 -- docker pull -q '$image'; date +%s > '$RUNNER_TEMP/pull-done'" > "$RUNNER_TEMP/pull.log" 2>&1 &

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy with the translator
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        run: |
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"

      # #4980: IBM's ODBC driver (the Db2 image's one download) cached on its pin; on a miss the harness fetches it with
      # curl --retry and checks the sha256, and a failure there says it is infrastructure.
      - name: Cache the Db2 ODBC CLI driver (#4980)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitgalaxy/tests/equivalence/linuxx64_odbc_cli.tar.gz
          key: db2-odbc-cli-${{ hashFiles('gitgalaxy/tests/equivalence/odbc_cli.pin') }}

      # Db2 takes minutes to start and its databases to create (#4733): start them now, in the background, so they come
      # up while the JDK, Maven cache and corpora are set up. The harness's own ensure() then finds them running (the
      # start lock makes it wait for this one when it is not done yet).
      - name: Start Db2 and create its databases in the background (#4901)
        shell: bash
        env:
          CASES: ${{ needs.plan.outputs.db2_cases }}
        run: |
          n=4
          if [ "$CASES" != "all" ]; then
            c=$(echo "$CASES" | tr ',' '\n' | grep -c .)
            if [ "$c" -lt "$n" ]; then n=$c; fi
          fi
          echo "DB2_JOBS=$n" >> "$GITHUB_ENV"
          echo "GITGALAXY_DB2_POOL=$n" >> "$GITHUB_ENV"
          export GITGALAXY_DB2_POOL=$n
          cat > "$RUNNER_TEMP/db2_prewarm.py" <<'PY'
          import sys
          import time

          t = time.time()
          sys.path.insert(0, "gitgalaxy/tests/tools")
          import equivalence_db2 as d

          d._ensure_container()
          print(f"db2 container ready after {time.time() - t:.0f}s", flush=True)
          for db in d.pool():
              d._ensure_database(db)
              d.activate(db)
              print(f"db2 {db} ready after {time.time() - t:.0f}s", flush=True)
          PY
          setsid nohup bash -c "python '$RUNNER_TEMP/db2_prewarm.py'; echo \$? > '$RUNNER_TEMP/db2-prewarm.done'" \
            > "$RUNNER_TEMP/db2-prewarm.log" 2>&1 &
          echo "started the background Db2 start"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: det-sweep-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            det-sweep-m2-
            evidence-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #5024: restore-only on pull requests. A PR's cache scope is its own ref, so a PR that saved here left
      # a copy per PR (a PR that edits corpora.json) that nothing else could read. Main saves it, once per key.
      - name: Save the pinned corpora (main)
        if: github.event_name != 'pull_request' && steps.corpora.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a miss only costs the next run a clone
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      # #5048: every shard balances by the file the plan job chose, never by its own cache restore (one shard's cache
      # miss made its slices differ from its neighbours' and a case was proven in two shards).
      - name: Download the plan's durations (#5048)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: det-durations
          path: durations-plan

      - name: Balance by the plan's durations
        run: cp durations-plan/det_sweep_durations.json gitgalaxy/tests/equivalence/det_sweep_durations.json

      # The databases are only used once the start is done: a case that picked a database the background start was still
      # creating got no connection (first CI run: "Db2: no table IBMUSER.ACCOUNT" on cbsa-updacc-generated). Lazy creation
      # in the harness paid the same serial CREATE DATABASE time, so this wait costs nothing.
      - name: Wait for the background Db2 start
        shell: bash
        run: |
          for _ in $(seq 1 120); do
            if [ -f "$RUNNER_TEMP/db2-prewarm.done" ]; then break; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/db2-prewarm.log" | grep -v 'WARNING\|INFO' || true
          [ "$(cat "$RUNNER_TEMP/db2-prewarm.done" 2>/dev/null)" = "0" ] || { echo "::error title=Db2::the background Db2 start did not finish"; exit 1; }

      # #5262: the cache writer is main's runs (schedule / dispatch on main), one shard, and only on a miss. Docker save
      # runs here, after the wait: the background pull is finished by then (Db2 started from the image).
      - name: Save the pinned Db2 image to the cache (main only, #5262)
        if: steps.db2image.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && startsWith(matrix.shard, '1/')
        run: python3 gitgalaxy/tests/tools/db2_image_cache.py save "$RUNNER_TEMP/db2-image-cache"

      - name: Store the Db2 image cache entry (main only, #5262)
        if: steps.db2image.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && startsWith(matrix.shard, '1/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/db2-image-cache
          key: ${{ steps.db2key.outputs.key }}

      - name: Re-prove this shard's Db2 det ports
        id: sweep
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        env:
          CASES: ${{ needs.plan.outputs.db2_cases }}
        run: |
          cd gitgalaxy
          only=()
          if [ "$CASES" != "all" ]; then only=(--cases "$CASES"); fi
          start=$(date +%s)
          python tests/tools/proof_sweep.py --det-only --db2-only --jobs "$DB2_JOBS" --shard "${{ matrix.shard }}" "${only[@]}" \
            --no-ratchet --work "$RUNNER_TEMP/sweep" | tee "$RUNNER_TEMP/sweep.txt"
          echo "sweep_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Summary (with the step timings, #4901)
        if: always()
        shell: bash
        run: |
          {
            echo "## Db2 det sweep, shard ${{ matrix.shard }}"
            echo "image pull finished at +$(( $(cat "$RUNNER_TEMP/pull-done" 2>/dev/null || echo 0) - $(cat "$RUNNER_TEMP/t0" 2>/dev/null || echo 0) )) s from the job's start"
            echo '```'
            cat "$RUNNER_TEMP/db2-prewarm.log" 2>/dev/null | grep -v 'WARNING\|INFO' || echo "(no prewarm log)"
            echo '```'
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-sweep-db2-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sweep/sweep.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the proofs' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-sweep-db2-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/sweep/det/*/proof.log
            ${{ runner.temp }}/sweep/det/*/proof/report.json
            ${{ runner.temp }}/sweep/det/*/proof/java/maven.log
            ${{ runner.temp }}/db2-prewarm.log
          if-no-files-found: ignore
          retention-days: 7

  shard:
    name: shard ${{ matrix.shard }}
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.plan.outputs.shards != '0') }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a full-sweep shard is ~18 cases, ~10-12 min (#5135: up to 6 shards); a hang should fail, not hold a runner for 6 h
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy with the translator
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: det-sweep-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            det-sweep-m2-
            evidence-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #5024: restore-only on pull requests. A PR's cache scope is its own ref, so a PR that saved here left
      # a copy per PR (a PR that edits corpora.json) that nothing else could read. Main saves it, once per key.
      - name: Save the pinned corpora (main)
        if: github.event_name != 'pull_request' && steps.corpora.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a miss only costs the next run a clone
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      # The oracle image is built once per Dockerfile: saved with `docker save` under the Dockerfile's hash, loaded by
      # every later run and shard. The fingerprint check below is still the pin (#4309): a stale image fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        run: |
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      # #5048: every shard balances by the file the plan job chose, never by its own cache restore (one shard's cache
      # miss made its slices differ from its neighbours' and a case was proven in two shards).
      - name: Download the plan's durations (#5048)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: det-durations
          path: durations-plan

      - name: Balance by the plan's durations
        run: cp durations-plan/det_sweep_durations.json gitgalaxy/tests/equivalence/det_sweep_durations.json

      - name: Re-prove this shard's det ports (no Db2)
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        env:
          CASES: ${{ needs.plan.outputs.cases }}
        run: |
          cd gitgalaxy
          only=()
          if [ "$CASES" != "all" ]; then only=(--cases "$CASES"); fi
          python tests/tools/proof_sweep.py --det-only --skip-db2 --jobs 4 --shard "${{ matrix.shard }}" "${only[@]}" \
            --no-ratchet --work "$RUNNER_TEMP/sweep" | tee "$RUNNER_TEMP/sweep.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Det sweep, shard ${{ matrix.shard }}"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | tail -60 || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-sweep-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sweep/sweep.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the proofs' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-sweep-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/sweep/det/*/proof.log
            ${{ runner.temp }}/sweep/det/*/proof/report.json
            ${{ runner.temp }}/sweep/det/*/proof/java/maven.log
          if-no-files-found: ignore
          retention-days: 7

  # The required check (its name, `det`, is what it was when this was one job): the shards' verdicts, merged, against
  # the two-way ratchet in tests/equivalence/det_sweep_baseline.json -- a new not-proven port fails, a baselined port
  # that now proves fails -- and a case with no result (a shard that died before reporting) fails.
  det:
    needs: [plan, shard, db2]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore the newest measured durations (nightly merge base, #4847)
        if: github.event_name == 'schedule'
        id: durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: det-durations-${{ github.run_id }}  # never an exact hit: restore-keys takes the newest saved one
          restore-keys: |
            det-durations-

      - name: Merge into the restored durations (nightly)
        if: github.event_name == 'schedule' && steps.durations.outputs.cache-matched-key != ''
        run: cp durations-cache/det_sweep_durations.json tests/equivalence/det_sweep_durations.json

      - name: Download the shards' results
        if: needs.plan.outputs.shards != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: det-sweep-shard-*
          path: shards
        continue-on-error: true  # no shard reported: the merge below names every case missing

      - name: Download the Db2 shards' results (#4901)
        if: needs.plan.outputs.db2_shards != '0' && needs.plan.outputs.db2_shards != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: det-sweep-db2-[0-9]*
          path: db2-shards
        continue-on-error: true  # no Db2 shard reported: the merge below names every case missing

      - name: Apply the ratchet to the merged sweep
        id: aggregate
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          CASES: ${{ needs.plan.outputs.cases }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          DB2_CASES: ${{ needs.plan.outputs.db2_cases }}
          DB2_SHARDS: ${{ needs.plan.outputs.db2_shards }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then echo "the plan job did not succeed ($PLAN_RESULT)"; exit 1; fi
          if [ "$SHARDS" = "0" ] && { [ "$DB2_SHARDS" = "0" ] || [ -z "$DB2_SHARDS" ]; }; then
            echo "no det-sweep case is affected by this change: nothing to prove"; exit 0
          fi
          rc=0
          if [ "$SHARDS" != "0" ]; then
            expect=all
            if [ "$MODE" != "full" ]; then expect="$CASES"; fi
            # #5008: download-artifact extracts a LONE matching artifact straight into path/ (no <name>/ subdirectory),
            # so a 1-shard run has shards/sweep.json: take both layouts.
            found=$(ls shards/*/sweep.json shards/sweep.json 2>/dev/null || true)
            if [ -z "$found" ]; then echo "no shard reported a sweep.json"; rc=1; else
              extra=()  # the nightly writes the merged seconds to tests/equivalence/det_sweep_durations.json (#4847)
              if [ "$EVENT" = "schedule" ]; then extra=(--update-durations); fi
              PYTHONPATH="$PWD" python tests/tools/proof_sweep.py --aggregate $found --expect "$expect" --record-ledger "${extra[@]}" | tee agg.txt || rc=1
              {
                echo "## Det sweep (merged)"
                echo '```'
                grep -v '^ *$' agg.txt | tail -80
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # #4901: the Db2 cases the plan moved (every Db2 case in a full sweep), same ratchet, same ledger check
          if [ -n "$DB2_SHARDS" ] && [ "$DB2_SHARDS" != "0" ]; then
            expect=db2
            if [ "$DB2_CASES" != "all" ]; then expect="$DB2_CASES"; fi
            found=$(ls db2-shards/*/sweep.json db2-shards/sweep.json 2>/dev/null || true)  # one shard: no subdirectory (#5008)
            if [ -z "$found" ]; then echo "no Db2 shard reported a sweep.json"; rc=1; else
              PYTHONPATH="$PWD" python tests/tools/proof_sweep.py --aggregate $found --expect "$expect" --record-ledger | tee agg-db2.txt || rc=1
              {
                echo "## Det sweep, Db2 cases (merged)"
                echo '```'
                grep -v '^ *$' agg-db2.txt | tail -80
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit $rc

      # #5084: the aggregate re-recorded the ledger entries it re-checked (fingerprints included); the runner's copy is
      # thrown away, so hand the rewritten files on for whoever commits them.
      - name: Keep the re-recorded coverage ledger (#5084)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: det-sweep-ledger
          path: tests/equivalence/det_sweep_coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage the merged durations for the cache (nightly, #4847)
        if: github.event_name == 'schedule' && steps.aggregate.outcome == 'success'
        run: |
          mkdir -p durations-cache
          cp tests/equivalence/det_sweep_durations.json durations-cache/

      - name: Cache the merged durations (nightly, #4847)
        if: github.event_name == 'schedule' && steps.aggregate.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: det-durations-${{ github.run_id }}
