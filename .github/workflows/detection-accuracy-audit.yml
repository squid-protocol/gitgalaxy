name: Detection Accuracy Audit

# Baseline-gated regression check for language-DETECTION accuracy (#3117),
# the sibling of tree-sitter-accuracy-audit.yml (which covers extraction).
# Path-filtered for the same reason that one is: it needs a language-crucible
# clone and one detector pass over ~3.4k files, cheap enough for every
# relevant PR but not worth paying on a PR that only touches e.g. recorders.
#
# #6501: a `plan` job (tests/tools/accuracy_audit_plan.py) skips the install and the scan when the diff cannot move the
# score (comments, `_meta`, underscore rules, a key the lens never reads). A failed plan runs it; the check name is unchanged.
#
# Reuses the same pinned corpus as golden-crucible.yml and the tree-sitter
# audit rather than cloning a fresh one -- see the tool's own CORPUS section.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/standards/language_lens.py"
      - "gitgalaxy/standards/language_standards/**"
      - "gitgalaxy/standards/gitgalaxy_config.py"
      - "tests/tools/detection_accuracy_audit.py"
      - "tests/detection_accuracy_baseline.json"
      - ".github/workflows/detection-accuracy-audit.yml"
      - "tests/crucible_pins.toml"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/accuracy_audit_plan.py"  # #6501: the plan job's own code
      - "tests/tools/graph_accuracy_plan.py"  # #6501: imported by the planner
      - "tests/tools/change_classifier.py"  # #6501: imported by the planner

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: does the diff move this audit? (accuracy_audit_plan.py reads the changed language file's diff: a comment, a
  # `_meta` edit or, for detection, a key the lens never reads cannot). The main job's steps run unless it says `false`.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git diff origin/main...HEAD needs the merge base
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the audit
        id: plan
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          python3 tests/tools/accuracy_audit_plan.py --audit detection --event "$GITHUB_EVENT_NAME" --base origin/main \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-audit plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  detection-accuracy-audit:
    needs: [plan]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104: draft PRs skip heavy CI; always(): a failed plan runs the audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GitGalaxy PR
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      # No full-precision extras needed: classification is pure regex/metadata
      # inference in language_lens.py, identical in both dependency modes.
      - name: Install GitGalaxy
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Run baseline-gated regression check
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/detection_accuracy_audit.py --ci

      - name: List misclassified files on failure
        if: failure() && needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/detection_accuracy_audit.py --errors || true
