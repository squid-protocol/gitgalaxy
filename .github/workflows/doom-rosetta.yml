name: DOOM-rosetta

# Zero-drift check of the pinned DOOM ports against tests/golden_doom_rosetta (#5619, slice 3). The 44 ports total ~6.7M
# LOC and 7.5 min serial, so the `plan` job packs them into SHARDS by LOC (largest first, into the lightest shard, from
# the golden's own per-file LOC) and each shard runs `pytest -m doom_rosetta` with DOOM_ROSETTA_PORTS narrowed to its
# ports. Clones are fetched at the manifest SHA at run time (never committed) and cached per shard, keyed by the
# manifest hash. Each shard writes its wall time to the job summary: the PR wall time is the slowest shard.
# The nightly --oracle run is slice 4.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/core/**"
      - "gitgalaxy/standards/**"
      - "gitgalaxy/metrics/**"
      - "tests/doom_rosetta/**"
      - "tests/golden_doom_rosetta/**"
      - "tests/tools/doom_rosetta_check.py"
      - "tests/tools/doom_speedrun/**"
      - ".github/workflows/doom-rosetta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack the ports into LOC-balanced shards
        id: shards
        env:
          SHARDS: "4"
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, glob, gzip, json, os

          n = int(os.environ["SHARDS"])
          loc = {}
          for path in glob.glob("tests/golden_doom_rosetta/*.json.gz"):
              with gzip.open(path, "rt") as fh:
                  files = json.load(fh)["files"]
              loc[os.path.basename(path).removesuffix(".json.gz")] = sum(v[1] for v in files.values())
          with open("tests/doom_rosetta/manifest.csv", newline="") as fh:
              names = [r["name"] for r in csv.DictReader(fh)]
          bins = [{"ports": [], "loc": 0} for _ in range(n)]
          for name in sorted(names, key=lambda p: (-loc.get(p, 0), p)):
              b = min(bins, key=lambda x: x["loc"])
              b["ports"].append(name)
              b["loc"] += loc.get(name, 0)
          include = [{"shard": i + 1, "ports": ",".join(sorted(b["ports"])), "loc": b["loc"]} for i, b in enumerate(bins)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  shard:
    needs: plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    name: shard ${{ matrix.shard }} (${{ matrix.loc }} LOC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      DOOM_SPEEDRUN_WORK: ${{ github.workspace }}/../doom-work
      DOOM_ROSETTA_PORTS: ${{ matrix.ports }}
    steps:
      - name: Start clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/yaml.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/pytest.txt
          pip install --require-hashes -r ci/requirements/treesitter.txt

      # Same hard preflight as tri-comparison-audit.yml: Ubuntu's arduino-ctags can shadow the `ctags` name.
      - name: Install universal-ctags and verify it's the real thing
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y universal-ctags'
          if ! ctags --version | grep -q "Universal Ctags"; then
            echo "::error::ctags on PATH is not Universal Ctags -- refusing to run a silently-degraded check."
            ctags --version || true
            exit 1
          fi
          ctags --version | head -1

      # Keyed by the manifest (it pins every SHA), so the cache only changes when a pin does; the shard index is in the
      # key because the ports differ per shard.
      - name: Cache the pinned clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../doom-work
          key: doom-clones-${{ matrix.shard }}-${{ hashFiles('gitgalaxy/tests/doom_rosetta/manifest.csv') }}

      - name: Scan the shard and diff against the golden
        run: |
          cd gitgalaxy
          python -m pytest -m doom_rosetta tests/doom_rosetta -q -p no:cacheprovider

      - name: Report shard wall time
        if: always()
        run: |
          s=$(( $(date +%s) - T0 ))
          echo "shard ${{ matrix.shard }} (${{ matrix.loc }} LOC): ${s}s" >> "$GITHUB_STEP_SUMMARY"
