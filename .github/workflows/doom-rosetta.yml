name: DOOM-rosetta

# Zero-drift check of the pinned DOOM ports against tests/golden_doom_rosetta (#5619, slice 3). The 44 ports total ~6.7M
# LOC and 7.5 min serial, so the `plan` job packs them into shards by LOC (largest first, into the lightest shard, from
# the golden's own per-file LOC; #5919: crucible_shard_plan.py also picks the count and the shard timeout) and each shard runs `pytest -m doom_rosetta` with DOOM_ROSETTA_PORTS narrowed to its
# ports. Clones are fetched shallow at the manifest SHA at run time (never committed, never cached: a PR-scoped cache
# is invisible to every other PR, and the repo's Actions cache is already at its 10 GB cap). Each shard writes its wall
# time to the job summary: the PR wall time is the slowest shard.
# Slice 4 (#5630): the `callgraph` job scans the baseline's licensed C/C++ ports and fails on a call-graph
# recall/precision drop against tests/tools/doom_speedrun/callgraph_baseline.json. It runs nightly, and on a ready PR
# only when the PR changes the call-graph engine, its oracles or the baseline (#6266: as a nightly-only check it went
# red three nights running on changes that had merged green).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/core/**"
      - "gitgalaxy/standards/**"
      - "gitgalaxy/metrics/**"
      - "tests/doom_rosetta/**"
      - "tests/golden_doom_rosetta/**"
      - "tests/tools/doom_rosetta_check.py"
      - "tests/tools/crucible_shard_plan.py"  # #5919: the plan job's shard count and timeout
      - "tests/tools/ci_shard_plan.py"
      # only the modules the check imports (test_workflow_paths_cover_the_check_imports keeps this list whole); the
      # paper-study scripts beside them (lineage, fidelity, distribution, study_report, ...) never reach a shard
      - "tests/tools/doom_speedrun/doom_speedrun.py"
      - "tests/tools/doom_speedrun/doom_diff.py"
      - "tests/tools/doom_speedrun/doom_scorer.py"
      - "tests/tools/doom_speedrun/callgraph_oracle.py"
      - "tests/tools/doom_speedrun/ts_callgraph_oracle.py"
      - "tests/tools/doom_speedrun/doom_clang*.py"
      - "tests/tools/clang_callgraph.py"
      - "tests/tools/doom_speedrun/callgraph_baseline.json"  # the callgraph job's PR scope (below)
      - "gitgalaxy/galaxyscope.py"
      - ".github/workflows/doom-rosetta.yml"
      - "!**/*.md"  # no scan reads a Markdown file of this repo
  schedule:
    - cron: "37 6 * * *"  # nightly (#5630)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104; the nightly runs `callgraph` only: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      timeout: ${{ steps.shards.outputs.timeout }}
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Size and pack the ports into LOC-balanced shards
        id: shards
        run: python3 tests/tools/crucible_shard_plan.py --doom >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104; the nightly runs `callgraph` only: draft PRs skip heavy CI
    name: shard ${{ matrix.shard }} (${{ matrix.loc }} LOC)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}  # #5919: the slowest planned shard x 1.5, not hand-set
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      DOOM_SPEEDRUN_WORK: ${{ github.workspace }}/../doom-work
      DOOM_ROSETTA_PORTS: ${{ matrix.ports }}
    steps:
      - name: Start clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/yaml.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/pytest.txt
          pip install --require-hashes -r ci/requirements/treesitter.txt

      # Same hard preflight as tri-comparison-audit.yml: Ubuntu's arduino-ctags can shadow the `ctags` name.
      - name: Install universal-ctags and verify it's the real thing
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y universal-ctags'
          if ! ctags --version | grep -q "Universal Ctags"; then
            echo "::error::ctags on PATH is not Universal Ctags -- refusing to run a silently-degraded check."
            ctags --version || true
            exit 1
          fi
          ctags --version | head -1

      - name: Scan the shard and diff against the golden
        run: |
          cd gitgalaxy
          python -m pytest -m doom_rosetta tests/doom_rosetta -q -p no:cacheprovider

      - name: Report shard wall time
        if: always()
        run: |
          s=$(( $(date +%s) - T0 ))
          echo "shard ${{ matrix.shard }} (${{ matrix.loc }} LOC): ${s}s" >> "$GITHUB_STEP_SUMMARY"

  # #5630 slice 4: C/C++ call-graph accuracy (tests/tools/doom_speedrun/callgraph_oracle.py) on the baseline's licensed
  # ports. Not a PR check (a scan of 20 ports): nightly and on demand. Exit 1 = recall/precision fell past tolerance, a
  # baseline port is missing, consensus engine-misses / false edges grew, or the libclang reference (--clang) lost recall /
  # precision or gained disagreements in clean files; regenerate the baseline only with an
  # explained engine change (README, "C/C++ call-graph oracle").
  callgraph:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: drafts skip
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      DOOM_SPEEDRUN_WORK: ${{ github.workspace }}/../doom-work
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      # A PR runs the job only when it changes what the call graph is built or scored with; any other PR ends here.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename')
          hits=$(printf '%s\n' "$files" | grep -E '^(gitgalaxy/core/(detector|call_resolver)\.py|gitgalaxy/galaxyscope\.py|gitgalaxy/standards/language_standards/(_shared_patterns\.py|languages/(c|cpp)\.py)|tests/tools/doom_speedrun/(callgraph_oracle|doom_speedrun)\.py|tests/tools/doom_speedrun/callgraph_baseline\.json|tests/tools/clang_callgraph\.py|\.github/workflows/doom-rosetta\.yml)$' || true)
          if [ -n "$hits" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "call-graph inputs changed:"; echo "$hits"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "no call-graph input changed: skipped"; fi

      - name: Setup Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        if: steps.scope.outputs.run == 'true'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/yaml.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --require-hashes -r ci/requirements/callgraph.txt  # libclang, for --clang below

      - name: Fetch and scan the baseline's ports
        if: steps.scope.outputs.run == 'true'
        run: |
          cd gitgalaxy
          ports=$(python -c "import json; print(','.join(sorted(json.load(open('tests/tools/doom_speedrun/callgraph_baseline.json'))['ports'])))")
          python tests/tools/doom_speedrun/doom_speedrun.py fetch --only "$ports"
          python tests/tools/doom_speedrun/doom_speedrun.py scan --only "$ports"

      - name: Score call-graph accuracy against the baseline
        if: steps.scope.outputs.run == 'true'
        run: |
          cd gitgalaxy
          python tests/tools/doom_speedrun/callgraph_oracle.py --only all --clang \
            --baseline tests/tools/doom_speedrun/callgraph_baseline.json --fail-on-regression

      - name: Publish the report
        if: always() && steps.scope.outputs.run == 'true'
        run: cat "$DOOM_SPEEDRUN_WORK"/results/*/callgraph.md >> "$GITHUB_STEP_SUMMARY" || true
