name: Estate Crucible

# #4317 phase 5: gitgalaxy's mainframe extraction measured against estate-crucible
# (squid-protocol/estate-crucible), a synthetic z/OS estate whose answer key is written by the
# same generator that writes the code; every planted "horror" cites the IBM text for what its key
# asserts. tests/tools/estate_crucible_gate.py scans the estate with THIS checkout's engine,
# scores every fact channel against the key, and holds the result as a ratchet against
# tests/estate_crucible/baseline.json: a horror that passed and now fails, a channel whose pass
# count drops, or a check that passed and no longer does fails the run. Improvements do not fail
# it; they are listed, and the baseline is lowered with --update-baseline.
#
# The crucible is cloned at PINNED_REF, read straight out of tests/crucible_pins.toml (there is
# no repository variable for this pin, like the CICS crucible's), so a fork's pull_request run clones
# the same public ref with no credentials: the repo is public, no token is needed. The whole job is
# a ~3 s scan plus install, so there is no scan cache.

on:
  pull_request:
    branches: [main]
    paths:
      - "gitgalaxy/**"
      - "pyproject.toml"
      - "tests/tools/estate_crucible*.py"
      - "tests/estate_crucible/**"
      - "tests/_estate_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - ".github/workflows/estate-crucible.yml"
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      # never read by a scan: the COBOL-to-Java translator and its entry point, and prose
      - "!gitgalaxy/tools/cobol_to_java/**"
      - "!gitgalaxy/cobol_to_java_controller.py"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "gitgalaxy/**"
      - "pyproject.toml"
      - "tests/tools/estate_crucible*.py"
      - "tests/estate_crucible/**"
      - "tests/_estate_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - ".github/workflows/estate-crucible.yml"
      # never read by a scan: the COBOL-to-Java translator and its entry point, and prose
      - "!gitgalaxy/tools/cobol_to_java/**"
      - "!gitgalaxy/cobol_to_java_controller.py"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # #4825: read-only, so a superseded main run is cancelled too (frees runners for PRs)

jobs:
  # #4964 (sibling of #4935): a push to main whose tree already passed THIS workflow on its PR head (a squash of an
  # up-to-date PR) is not run again; any doubt runs it (tests/tools/skip_tested_tree.py has the rule, and tests).
  # No PR run on the head (the PR's paths filter skipped it) is "not proven", so the push runs. Always concludes success.
  tested-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/tools/skip_tested_tree.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/tools/skip_tested_tree.py estate-crucible.yml

  estate:
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.skip != 'true' }}  # #4964: not again for a tree the PR run proved
    runs-on: ubuntu-latest
    timeout-minutes: 5  # the job takes ~40 s; a hang should fail fast
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone estate-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get estate)
          git init -q estate-crucible
          git -C estate-crucible remote add origin https://github.com/squid-protocol/estate-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C estate-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C estate-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C estate-crucible checkout -q --detach FETCH_HEAD
          echo "estate-crucible at $ref ($(git -C estate-crucible rev-parse HEAD))"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install -e ./gitgalaxy

      - name: Score the estate against the baseline
        run: |
          cd gitgalaxy
          python tests/tools/estate_crucible_gate.py --crucible ../estate-crucible --md "$RUNNER_TEMP/estate_crucible.md"

      - name: Publish the report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/estate_crucible.md" ]; then cat "$RUNNER_TEMP/estate_crucible.md" >> "$GITHUB_STEP_SUMMARY"; fi
