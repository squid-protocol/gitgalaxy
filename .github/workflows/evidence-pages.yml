name: Evidence Pages

# #4825 (CI v2, step 2; owner decision 2026-10-09): the per-program evidence pages (docs/language_status/evidence/*.md)
# are derived output -- a render of the committed evidence records -- so main no longer commits them. PRs re-rendered
# and committed them with every re-proof, and the evidence-refresh bot rewrote them under every open PR: the pages were
# the files PRs collided on (#4820 squash-merged a stale page and turned main red).
#
# This job is their ONLY writer. After any push to main that can change a page (a record, or the renderer), it renders
# every page from main's records (`evidence.py render`, Python only: no proof runs) and pushes them to the `generated`
# branch, stamped with the main commit they came from (GENERATED_FROM). It never pushes to main, and a GITHUB_TOKEN
# push starts no other workflow. Read the pages at:
#   https://github.com/squid-protocol/gitgalaxy/tree/generated/docs/language_status/evidence
# Locally, `python tests/tools/evidence.py render` writes the same pages into the (git-ignored) directory.

on:
  push:
    branches: [main]
    paths:
      - "tests/equivalence/*/evidence.json"
      - "tests/cics_crucible/ports/*/*/evidence.json"
      - "tests/tools/evidence.py"
      - ".github/workflows/evidence-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-pages  # one writer at a time; a later push waits and renders the newer main
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push to the `generated` branch only
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install -e ./main

      - name: Render the pages from main's records
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
        run: |
          cd main
          PYTHONPATH="$PWD" python tests/tools/evidence.py render

      - name: Checkout the generated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: generated
          fetch-depth: 1
          persist-credentials: true  # this job pushes the pages; it runs no PR code (push to main / dispatch only)

      - name: Publish to the generated branch
        run: |
          cd generated
          if git fetch --depth 1 origin generated 2>/dev/null; then
            git checkout -q -B generated FETCH_HEAD
          else  # first run: an orphan branch holding only generated output
            git checkout -q --orphan generated
            git rm -rqf .
          fi
          rm -rf docs/language_status/evidence
          mkdir -p docs/language_status/evidence
          cp ../main/docs/language_status/evidence/*.md docs/language_status/evidence/
          {
            echo "Generated output only -- never edit by hand. Source: main @ $GITHUB_SHA"
            echo "docs/language_status/evidence/: evidence pages rendered from main's records by"
            echo ".github/workflows/evidence-pages.yml (#4825)."
          } > GENERATED_FROM
          git add -A
          if git diff --cached --quiet; then
            echo "pages unchanged at $GITHUB_SHA"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "evidence pages as of main $GITHUB_SHA"
          git push -q origin HEAD:generated
          echo "published $(ls docs/language_status/evidence | wc -l) pages from main $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
