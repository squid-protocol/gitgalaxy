name: Evidence Refresh

# #4048: re-prove every evidence record that has gone stale, and open a PR with the refreshed records.
#
# The staleness policy (owner decision, #4048 Q1): a change to a port, its case, its corpus pin or its declared
# differences fails the PR that makes it (tests/cobol_mainframe/test_evidence.py), so that PR re-proves the record.
# A change to the harness, the oracle or the generator stales EVERY record at once; the record then shows as stale
# (never as proven), and this job re-proves it: `evidence.py refresh --stale` runs each stale record's proof on the
# committed port and case, writes the new proof (proven or not) and re-renders docs/language_status/evidence/.
#
# #4703: the rendered evidence report (docs/language_status/evidence_report/) is derived output. It is regenerated HERE, on
# main, and not in feature PRs (which would conflict on the same generated files); per-PR CI only prints the level deltas
# (smoke-test.yml, advisory) and the release gate (publish.yml) requires `evidence_report.py --check --live` clean.
# This job runs on every push to main, nightly, and on demand. It always works from the CURRENT main, and its
# concurrency group cancels an older run when a newer push lands. When nothing changed it opens no PR. Otherwise it
# opens (or updates) the bot PR from auto/evidence-refresh onto main and enables squash auto-merge on it. The report
# files stay content-deterministic (so --check compares content), so the commit it was refreshed at ("as of commit
# <sha>") is stamped on the bot's commit and PR, not inside the files.
#
# Earlier bot PRs failed twice: #4640 was opened against a feature branch (the base is now pinned to main) and #4649
# went dirty while parallel PRs kept conflicting on the report (those PRs no longer commit it).
#
# Auto-merge happens only when every proof step succeeded. A run where a proof or the sweep failed still opens the PR,
# but leaves it for a person (and the job fails). Approvals are never touched (only `evidence.py approve`, run by a
# person at a terminal, writes one). Db2 cases need IBM's Db2 container; they run only on a manual dispatch with db2 = true.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:
    inputs:
      db2:
        description: "also re-prove the Db2 cases (starts IBM's Db2 container: slow)"
        type: boolean
        default: false
      keys:
        description: "only these records (space-separated keys, e.g. carddemo-dateutil crucible:pc-wizard/PCWIZ)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true  # a newer push to main supersedes an older refresh (#4703)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: main  # always the current main, whatever event or branch started the run (#4640)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Record the commit the refresh is as of
        id: asof
        run: echo "sha=$(git -C gitgalaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Build the oracle image and check it against its pin (#4309)
        run: |
          docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict

      # #4270: the det-sweep coverage ledger is keyed to harness / oracle fingerprints, so a harness change blanks every
      # entry (readers then treat coverage as unknown) until a sweep rewrites them. Re-sweep nightly and rewrite the ledger
      # from the sweep: `update` always takes fingerprints from the tree, never from the old entry.
      # The sweep applies the det_sweep_baseline ratchet (no --no-ratchet): a sweep that proves fewer cases than the
      # baseline expects exits 1, fails this job, and the ledger is NOT rewritten from it.
      - name: Re-sweep the det ports for the coverage ledger (#4270)
        id: ledger_sweep
        continue-on-error: true
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        run: |
          cd gitgalaxy
          python tests/tools/proof_sweep.py --det-only --skip-db2 --jobs 4 --work "$RUNNER_TEMP/sweep" \
            | tee "$RUNNER_TEMP/sweep.txt"

      - name: Rewrite the coverage ledger from the sweep (#4270)
        # Only from a sweep that passed the ratchet. hashFiles() only searches the workspace, never $RUNNER_TEMP, so
        # test for the file in the shell instead.
        if: steps.ledger_sweep.outcome == 'success'
        run: |
          cd gitgalaxy
          if [ ! -f "$RUNNER_TEMP/sweep/sweep.json" ]; then
            echo "::warning title=coverage ledger::no sweep.json from the det sweep: the ledger is not refreshed"
            exit 0
          fi
          python tests/tools/det_coverage_ledger.py update "$RUNNER_TEMP/sweep"

      - name: Re-prove the stale records
        id: refresh
        continue-on-error: true
        shell: bash  # -eo pipefail: the refresh's exit status, not tee's
        env:
          KEYS: ${{ github.event.inputs.keys }}
          DB2: ${{ github.event.inputs.db2 }}
        run: |
          cd gitgalaxy
          skip=""
          if [ "$DB2" != "true" ]; then skip="--skip-db2"; fi
          # shellcheck disable=SC2086 -- KEYS is a space-separated list on purpose
          python tests/tools/evidence.py refresh --stale $skip --crucible ../cics-crucible --work "$RUNNER_TEMP/evidence" $KEYS \
            | tee "$RUNNER_TEMP/refresh.txt"

      - name: Rebuild the purchaser-facing evidence reports (#4601)
        if: always()
        run: |
          cd gitgalaxy
          # the records' status is recomputed now; the measured translation stays (it needs corpora this job lacks)
          python tests/tools/evidence_report.py --refresh --live

      - name: Summary
        if: always()
        run: |
          {
            echo "## Evidence refresh"
            echo '```'
            cat "$RUNNER_TEMP/refresh.txt" 2>/dev/null || echo "(no output)"
            echo '```'
            echo '```'
            (cd gitgalaxy && python tests/tools/evidence.py status) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the bot PR with the refreshed records
        id: cpr
        uses: squid-protocol/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # forked from peter-evans/create-pull-request v8.1.1
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          path: gitgalaxy
          base: main  # never the checked-out ref of another run (#4640)
          commit-message: "evidence: refresh as of commit ${{ steps.asof.outputs.sha }}"
          title: "evidence: refresh stale records and the evidence report"
          draft: false  # auto-merge cannot be enabled on a draft
          body: |
            Refreshed as of commit ${{ steps.asof.outputs.sha }} (main at the time of the run).

            Automated re-proof of the evidence records (#4048) that a harness, oracle or generator change made stale.
            Each record's proof was run again on the committed port and case; the records and
            docs/language_status/evidence/ are rewritten from those runs. A proof that now fails is recorded as
            not proven. The evidence reports (docs/language_status/evidence_report/) are re-rendered from them (#4703).
            Approvals are never written by this job. Auto-merge (squash) is enabled when every proof succeeded.
          branch: auto/evidence-refresh
          delete-branch: true
          add-paths: |
            tests/equivalence/det_sweep_coverage.json
            tests/equivalence/*/evidence.json
            tests/cics_crucible/ports/*/*/evidence.json
            docs/language_status/evidence/*.md
            docs/language_status/evidence_report/**

      - name: Enable squash auto-merge on the bot PR
        # Only after a clean run: a proof that failed is recorded as not proven and needs a person (#4048).
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed' && steps.refresh.outcome == 'success' && steps.ledger_sweep.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash

      - name: Fail when a re-proof failed
        if: steps.refresh.outcome == 'failure' || steps.ledger_sweep.outcome == 'failure'
        run: |
          echo "::error title=Evidence refresh::a record's proof or the ledger's det sweep failed or could not run -- see the summary"
          exit 1
