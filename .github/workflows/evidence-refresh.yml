name: Evidence Refresh

# #4048: re-prove every evidence record that has gone stale, and open a PR with the refreshed records.
#
# The staleness policy (owner decision, #4048 Q1): a change to a port, its case, its corpus pin or its declared
# differences fails the PR that makes it (tests/cobol_mainframe/test_evidence.py), so that PR re-proves the record.
# A change to the harness, the oracle or the generator stales EVERY record at once; the record then shows as stale
# (never as proven), and this job re-proves it: `evidence.py refresh --stale` runs each stale record's proof on the
# committed port and case, writes the new proof (proven or not); its page is published from main by evidence-pages.yml (#4825).
#
# #4703: the rendered evidence report (docs/language_status/evidence_report/) is derived output. It is regenerated HERE, on
# main, and not in feature PRs (which would conflict on the same generated files); per-PR CI only prints the level deltas
# (smoke-test.yml, advisory) and the release gate (publish.yml) requires `evidence_report.py --check --live` clean.
# This job runs on every push to main, nightly, and on demand. It always works from the CURRENT main, and its
# concurrency group lets a running refresh finish and keeps only the newest push queued behind it (a refresh takes
# ~1 h; cancelling on every push starved it on busy merge days, so no refresh ever completed). When nothing changed it opens no PR. Otherwise it
# opens (or updates) the bot PR from auto/evidence-refresh onto main and enables squash auto-merge on it. The report
# files stay content-deterministic (so --check compares content), so the commit it was refreshed at ("as of commit
# <sha>") is stamped on the bot's commit and PR, not inside the files.
#
# #4963: the rendered report is no longer in that PR: it is published to the `generated` branch (publish-report job).
#
# Earlier bot PRs failed twice: #4640 was opened against a feature branch (the base is now pinned to main) and #4649
# went dirty while parallel PRs kept conflicting on the report (those PRs no longer commit it).
#
# #4789: the same for the CICS spec status page (docs/language_status/cics_spec_status.md), never in a PR; since #5057
# generated-docs.yml renders and publishes it after every merge (this job no longer touches it).
# The det-sweep coverage ledger is one file per case (tests/equivalence/det_sweep_coverage/<CASE>.json), so a case PR and
# this bot (or two case PRs) touch only the files of the cases they swept.
#
# Auto-merge happens only when every proof step succeeded. A run where a proof or the sweep failed still opens the PR,
# but leaves it for a person (and the job fails). Approvals are never touched (only `evidence.py approve`, run by a
# person at a terminal, writes one).
#
# #4733: the Db2 cases (most of GenApp, several CBSA programs) need IBM's Db2 container, so they run in their own job,
# `db2`: the Db2 half of the det sweep (`proof_sweep.py --det-only --db2-only`, for the coverage ledger) and the re-proof of
# the stale Db2 evidence records, on one runner with the Db2 image pinned by digest (tests/tools/equivalence_db2.py IMAGE,
# docs/language_status/oracle_assumptions.md). The job uploads its sweep.json and the records it wrote; `refresh` (which
# `needs: db2`) merges them in before it rewrites the ledger (det_coverage_ledger.py update takes both sweeps), re-renders the
# pages and builds the reports, so one bot PR carries the whole sweep. CADENCE: the Db2 job runs on the NIGHTLY schedule and
# on a manual dispatch with db2 = true (the default), not on every push to main: it adds its own time (image pull, Db2 start,
# the sweep, the records: see the job's summary for the measured time) ahead of the ~1 h refresh, and merge-heavy days push
# many times. A push-triggered refresh skips the job, leaves the Db2 half of the ledger and the Db2 records as the last
# nightly wrote them, and the report shows them as stale, not as zero, once their inputs move (#4730). The non-Db2 path is
# the same on every trigger. A Db2 job that fails (no Db2, a lost proof) does not stop the non-Db2 refresh, but the run
# fails and the bot PR is left for a person, as for any failed proof.
#
# #4743: two LANES. GitHub keeps ONE pending run per concurrency group and a newer run cancels the older pending one even with
# cancel-in-progress: false, so with one group every queued nightly / dispatched Db2 run was cancelled by the next push's run
# (runs 37874905643 by #4742's). Now: the PUSH lane (event push) and the FULL lane (schedule, workflow_dispatch) have their own
# concurrency groups (a push run can no longer replace a full run), their own bot branches (auto/evidence-refresh and
# auto/evidence-refresh-full: neither force-pushes over the other's PR) and a hand-over in the `lane` job so the two never have
# PRs open together, which would conflict on the rendered report:
#   - a full run closes the open push-lane bot PR before it starts (the full run re-proves everything the push run does, plus Db2);
#   - a push run does nothing at all while a full run is queued or running, and re-checks just before it opens its PR (a push
#     run already under way when the full run started). The full PR's merge is itself a push to main, so the push lane then
#     refreshes whatever moved meanwhile. Nothing is lost: both lanes always work from the CURRENT main, and
#     det_coverage_ledger.py update rewrites only the cases a sweep proved (a push run leaves the Db2 entries as main has them).
# #4744: SPEED. Measured on completed push-lane refreshes (runs 37859714260, 37866635888), one 4-vCPU runner, sequential: det
# sweep 2111-2753 s, stale-record re-proofs 2002-2579 s, ~1 min checkout + report. Now the proofs run in parallel jobs and a
# short `refresh` job merges them: `sweep` (planned shards of proof_sweep.py --shard, --no-ratchet), `records` (planned shards of
# evidence.py refresh --stale --shard) and, on the full lane, `db2`, all of the ONE commit the `lane` job pinned. `refresh`
# downloads their outputs, puts the records in place, re-renders the pages, applies the det_sweep_baseline ratchet to the
# MERGED sweep (proof_sweep.py --aggregate: a case with no result, i.e. a shard that died, fails it), rewrites the ledger from
# it, rebuilds the reports and opens the PR. Nothing is weakened: the same proofs, the same ratchet, the same failure and
# auto-merge rules (a failed proof, a failed or missing shard, a failed Db2 job: the PR is opened, never auto-merged, the run
# fails). Expected wall time: ~5 min setup + the slowest shard (~11 min sweep, ~7-10 min records) + ~8 min `refresh`
# (setup, merge, report, PR): ~25 min instead of 75-100.

on:
  # #4825 (owner, 2026-10-09): nightly + on demand only. The push lane rewrote generated files under every open PR all day
  # (8 commits on 2026-10-09; PRs went dirty, 40-min CI restarted, #4820 turned main red). The rendered pages are no
  # longer committed on main at all (evidence-pages.yml publishes them to the `generated` branch).
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:
    inputs:
      db2:
        description: "also sweep and re-prove the Db2 cases (starts IBM's Db2 container; the nightly run always does)"
        type: boolean
        default: true
      force:
        description: "run even while the open full-lane bot PR's required checks are still running (this run force-pushes that PR and restarts its CI: use only when its head is known bad)"
        type: boolean
        default: false
      keys:
        description: "only these records (space-separated keys, e.g. carddemo-dateutil crucible:pc-wizard/PCWIZ)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # one group per lane (#4743): a push run must not replace a pending nightly / dispatched full run. cancel-in-progress is
  # false: a running refresh finishes; within a lane GitHub keeps only the newest pending run, which is what a lane wants
  # (every run starts from the current main), but never across lanes.
  group: evidence-refresh-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: false

jobs:
  # #4743: the hand-over between the two lanes (see the header). Cheap; no checkout, no secrets beyond the bot token.
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      defer: ${{ steps.push_gate.outputs.defer || steps.full_gate.outputs.defer }}
      sha: ${{ steps.pin.outputs.sha }}  # #4744: the one commit every job of this run works from
      db2_parts: ${{ steps.db2parts.outputs.db2_parts }}  # #5882: det-sweep's full-sweep Db2 shard count, plus the records part
      db2_timeout: ${{ steps.db2parts.outputs.db2_timeout }}  # #5919: every matrix and timeout below is planned, not typed
      sweep_matrix: ${{ steps.db2parts.outputs.sweep_matrix }}
      sweep_timeout: ${{ steps.db2parts.outputs.sweep_timeout }}
      records_matrix: ${{ steps.db2parts.outputs.records_matrix }}
      records_timeout: ${{ steps.db2parts.outputs.records_timeout }}
    env:
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
    steps:
      # #4744: the sweep shards, the record shards, the Db2 job and the refresh job run in parallel, on separate runners, and
      # must all be of the SAME tree (the ledger's fingerprints and the records' inputs are judged against it), so main's
      # head is read once here and every checkout below takes it.
      - name: Pin the commit of main this run is of
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$REPO/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"

      # #5882: the Db2 parts scale with the Db2 cases as det-sweep's full sweep does (det_sweep_plan.py db2_shards_for):
      # only the plan tool and the case.json files, at the pinned commit
      - name: Checkout the plan tool and the cases (#5882)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tests/tools/det_sweep_plan.py
            tests/tools/ci_shard_plan.py
            tests/equivalence/det_sweep_durations.json
            tests/equivalence/*/case.json
            tests/equivalence/*/evidence.json

      # #5919: the Db2 parts, the sweep shards and the record shards, and each job's timeout, from the measured durations
      - name: Plan the shards and timeouts (#5919)
        id: db2parts
        run: python3 tests/tools/det_sweep_plan.py --evidence-plan --github-output "$GITHUB_OUTPUT"

      # #6693: every full run force-pushes the full-lane bot PR (#6428) and restarts its ~1 h of CI. ~25 hourly dispatches
      # did that before any head's required checks finished, so the PR never merged. Stand down (push nothing, run nothing)
      # while the open PR's current head still has a check running; `force` overrides. A PR with no check run on its head
      # (conflicting, or checks not registered yet) does not hold the run back: nothing is being protected.
      - name: Full lane - stand down while the open bot PR's checks are running (#6693)
        id: full_gate
        if: github.event_name != 'push' && !inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:auto/evidence-refresh-full&per_page=1" --jq '.[0].head.sha // ""')
          if [ -z "$head" ]; then
            echo "defer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          running=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.status != "completed")] | length')
          if [ "$running" -gt 0 ]; then
            echo "defer=true" >> "$GITHUB_OUTPUT"
            echo "The open full-lane bot PR's head ${head:0:12} still has $running check run(s) in progress: this run pushes nothing and starts no proof. Dispatch again after they finish (or with force, to restart that PR's CI on purpose) (#6693)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "defer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push lane - stand down while a full run is queued or running
        id: push_gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$REPO/actions/workflows/evidence-refresh.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .event != "push")] | length')
          if [ "$active" -gt 0 ]; then
            echo "defer=true" >> "$GITHUB_OUTPUT"
            echo "A full (schedule / dispatch) refresh is queued or running: this push refresh stands down; its PR will move main and trigger the next one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "defer=false" >> "$GITHUB_OUTPUT"
          fi

      # promoter-bot#64 (2026-10-24): the squid-shepherd App has its own API quota; AUTOMATION_PAT shares the
      # account's 5,000/h with the agent fleet, and the shepherd stopped merging when it ran out. The PAT stays
      # the fallback (a failed mint leaves the output empty).
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      - name: Full lane - close the push lane's open bot PR (superseded)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
        run: |
          prs=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:auto/evidence-refresh&per_page=10" --jq '.[].number')
          for pr in $prs; do
            gh pr close "$pr" --repo "$REPO" --delete-branch \
              --comment "Superseded by a full (${EVENT}) evidence refresh, which re-proves everything this one did, plus the Db2 cases (#4743)."
          done

  # #4733: the Db2 half of the sweep and the Db2 records. Its own runners: IBM's Db2 Community container needs --privileged
  # and a few GB of memory (a GitHub-hosted ubuntu-latest runner has both: 4 vCPU, 16 GB, root docker).
  # #4863 step 6: one runner took ~34 min (38 cases, 673 scenarios at ~9 s a scenario per slot, then the stale records
  # re-proved after the sweep), the refresh's critical path. Now one runner per part, each with its own Db2: the sweep in
  # det-sweep's full-sweep Db2 shard count (#5882: one per ~12 Db2 cases, at most 6) plus the records (proof_sweep.py --shard I/N --no-ratchet, balanced by det_sweep_durations.json) and the records beside them; the
  # `db2` job below merges the shards and applies the ratchet, as the `refresh` job does for the non-Db2 shards.
  # #5114: the split is pinned, not restored: no job here reads the durations cache (det-sweep.yml's `plan` chooses its
  # durations once and shares them); every shard balances by the committed det_sweep_durations.json of the ONE commit
  # the `lane` job pinned, so all shards cut the same slices. tests/tools/test_shard_split_pinned.py holds that.
  db2-part:
    name: db2 ${{ matrix.part }}
    needs: lane
    if: needs.lane.outputs.defer != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.db2))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.lane.outputs.db2_timeout || '90') }}  # #5919: planned (tests/tools/ci_shard_plan.py)
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.lane.outputs.db2_parts) }}  # #5882: one sweep part per ~12 Db2 cases (at most 6), + records
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #4980: IBM's ODBC driver (the Db2 image's one download) cached on its pin; on a miss the harness fetches it with
      # curl --retry and checks the sha256, and a failure there says it is infrastructure.
      - name: Cache the Db2 ODBC CLI driver (#4980)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitgalaxy/tests/equivalence/linuxx64_odbc_cli.tar.gz
          key: db2-odbc-cli-${{ hashFiles('gitgalaxy/tests/equivalence/odbc_cli.pin') }}

      - name: Build the oracle image and check it against its pin (#4309)
        run: |
          docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict

      # #5262: the pinned image is restored from actions/cache (key = its digest) so no part asks icr.io; this job runs
      # on main's schedule, so it is the cache writer (part 1/N, on a miss) that warms det-sweep's pull requests.
      - name: Name the Db2 image cache entry (#5262)
        id: db2key
        run: echo "key=$(python3 gitgalaxy/tests/tools/db2_image_cache.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned Db2 image from the cache (#5262)
        id: db2image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/db2-image-cache
          key: ${{ steps.db2key.outputs.key }}

      # The image is the one tests/tools/equivalence_db2.py pins by digest (#4733): loaded or pulled here by that name, so
      # the harness starts the container from it (a tag, or a different digest, is refused by test_db2_image_pin.py).
      - name: Load or pull the pinned Db2 image (#4733, #5262)
        run: |
          image=$(cd gitgalaxy/tests/tools && python -c "import equivalence_db2; print(equivalence_db2.IMAGE)")
          echo "Db2 image: $image (cache: ${{ steps.db2image.outputs.cache-hit == 'true' && 'hit' || 'miss' }})"
          # #5048: bounded retry (the registry hiccups); the digest stays the pin. A cache miss or mismatch pulls.
          python3 gitgalaxy/tests/tools/db2_image_cache.py load "$RUNNER_TEMP/db2-image-cache" \
            || gitgalaxy/tests/tools/ci_retry.sh 4 15 -- docker pull -q "$image"
          echo "DB2 image: \`$image\` (cache: ${{ steps.db2image.outputs.cache-hit == 'true' && 'hit' || 'miss' }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pinned Db2 image to the cache (main only, #5262)
        if: steps.db2image.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && startsWith(matrix.part, '1/')
        run: python3 gitgalaxy/tests/tools/db2_image_cache.py save "$RUNNER_TEMP/db2-image-cache"

      - name: Store the Db2 image cache entry (main only, #5262)
        if: steps.db2image.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && startsWith(matrix.part, '1/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/db2-image-cache
          key: ${{ steps.db2key.outputs.key }}

      - name: Re-sweep this shard's Db2 det ports for the coverage ledger (#4733)
        id: db2_sweep
        if: matrix.part != 'records'
        continue-on-error: true
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        env:
          PART: ${{ matrix.part }}
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # The ratchet (a Db2 case that stops proving fails the run, and its coverage is not written to the ledger) is
          # applied to the merged shards by the `db2` job (#4863).
          python tests/tools/proof_sweep.py --det-only --db2-only --jobs 4 --shard "$PART" --no-ratchet \
            --work "$RUNNER_TEMP/db2-sweep" | tee "$RUNNER_TEMP/db2-sweep.txt"
          echo "sweep_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Re-prove the stale Db2 records (#4733)
        id: db2_records
        if: matrix.part == 'records'
        continue-on-error: true
        shell: bash
        env:
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # shellcheck disable=SC2086 -- KEYS is a space-separated list on purpose
          python tests/tools/evidence.py refresh --stale --only-db2 --crucible ../cics-crucible --work "$RUNNER_TEMP/db2-evidence" $KEYS \
            | tee "$RUNNER_TEMP/db2-refresh.txt"
          echo "records_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Stage what the db2 job takes
        if: always()
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          out="$RUNNER_TEMP/db2-out"
          mkdir -p "$out/sweep"
          if [ -f "$RUNNER_TEMP/db2-sweep/sweep.json" ]; then cp "$RUNNER_TEMP/db2-sweep/sweep.json" "$out/sweep/sweep.json"; fi
          [ "$PART" = "records" ] || { find "$out" -type f | sort; exit 0; }  # a sweep shard writes no records
          cd gitgalaxy
          # only the evidence records the proofs wrote (the refresh job re-renders the pages from them)
          git ls-files -z --modified --others --exclude-standard -- 'tests/equivalence/*/evidence.json' \
              'tests/cics_crucible/ports/*/*/evidence.json' \
            | while IFS= read -r -d '' f; do mkdir -p "$out/records/$(dirname "$f")"; cp "$f" "$out/records/$f"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        env:
          SWEEP_SECONDS: ${{ steps.db2_sweep.outputs.sweep_seconds }}
          RECORDS_SECONDS: ${{ steps.db2_records.outputs.records_seconds }}
          PART: ${{ matrix.part }}
        run: |
          {
            echo "## Db2 cases, $PART (#4733, #4863)"
            echo "sweep: ${SWEEP_SECONDS:-?} s, records: ${RECORDS_SECONDS:-?} s"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/db2-sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no sweep output)"
            echo '```'
            echo '```'
            cat "$RUNNER_TEMP/db2-refresh.txt" 2>/dev/null || echo "(no records output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this part's results for the db2 job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db2-part-${{ strategy.job-index }}
          path: ${{ runner.temp }}/db2-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the Db2 proofs' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db2-sweep-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/db2-sweep/det/*/proof.log
            ${{ runner.temp }}/db2-sweep/det/*/proof/report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when the Db2 sweep or a Db2 re-proof failed
        if: steps.db2_sweep.outcome == 'failure' || steps.db2_records.outcome == 'failure'
        run: |
          echo "::error title=Db2 cases::the Db2 det sweep or a Db2 record's proof failed or could not run -- see the summary"
          exit 1

  # #4863 step 6: the Db2 shards and records merged, with the outputs and the `db2-results` artifact the `refresh` job has
  # always taken from the Db2 job. The ratchet: every Db2 case must be in the merged shards (a shard that died fails it)
  # and prove as det_sweep_baseline.json says (`--aggregate --expect db2`); the committed ledger is not checked here, as the
  # refresh job rewrites it from these sweeps.
  db2:
    needs: [lane, db2-part]
    if: ${{ !cancelled() && needs.db2-part.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sweep_ok: ${{ steps.db2_sweep.outcome == 'success' }}
      sha: ${{ needs.lane.outputs.sha }}  # the commit the Db2 results are of: every part checked it out
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e "./gitgalaxy"

      - name: Take the parts' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: db2-part-*
          path: ${{ runner.temp }}/db2-in
        continue-on-error: true

      # #5882: the Db2 cases' measured seconds, for det-sweep's plan to balance its db2 shards by (det-sweep's nightly
      # proves no Db2 case, so nothing else measures them). Extends the newest saved file, then saves it below.
      - name: Restore the newest measured Db2 durations (#5882)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-db2
          key: det-db2-durations-${{ github.run_id }}  # never an exact hit: restore-keys takes the newest saved one
          restore-keys: |
            det-db2-durations-

      - name: Merge the Db2 shards and apply the ratchet
        id: db2_sweep
        continue-on-error: true
        shell: bash  # -eo pipefail: the aggregate's exit status, not tee's
        run: |
          cd gitgalaxy
          shopt -s nullglob
          found=("$RUNNER_TEMP"/db2-in/*/sweep/sweep.json)
          echo "shards found: ${#found[@]}"
          mkdir -p ../durations-db2
          python tests/tools/proof_sweep.py --aggregate "${found[@]}" --expect db2 --skip-ledger-check \
            --update-durations --durations ../durations-db2/det_sweep_durations.json | tee "$RUNNER_TEMP/db2-sweep.txt"

      # Saved whatever the ratchet said: a duration only balances shards, never changes a verdict (#4847)
      - name: Cache the Db2 durations (#5882)
        if: always() && hashFiles('durations-db2/det_sweep_durations.json') != ''
        continue-on-error: true  # best effort: a miss only leaves the next plan on the older numbers
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-db2
          key: det-db2-durations-${{ github.run_id }}

      - name: Stage what the refresh job takes
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          out="$RUNNER_TEMP/db2-out"
          mkdir -p "$out/sweep"
          i=0
          for f in "$RUNNER_TEMP"/db2-in/*/sweep/sweep.json; do
            i=$((i + 1)); mkdir -p "$out/sweep/shard-$i"; cp "$f" "$out/sweep/shard-$i/sweep.json"
          done
          for d in "$RUNNER_TEMP"/db2-in/*/records; do cp -r "$d" "$out/"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        run: |
          {
            echo "## Db2 cases merged (#4863)"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/db2-sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no aggregate output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Db2 results for the refresh job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db2-results
          path: ${{ runner.temp }}/db2-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when the Db2 ratchet failed or a part failed
        if: steps.db2_sweep.outcome == 'failure' || needs.db2-part.result == 'failure'
        run: |
          echo "::error title=Db2 cases::a Db2 shard or the Db2 records failed, or the merged sweep broke the ratchet -- see the summaries"
          exit 1

  # #4744: the non-Db2 det sweep for the coverage ledger, in parallel shards (proof_sweep.py --shard I/N, balanced by
  # tests/equivalence/det_sweep_durations.json, as det-sweep.yml does). Each shard writes its sweep.json and leaves the
  # ratchet to the `refresh` job, which merges them (--aggregate: a missing case, a shard that died, fails it).
  # Measured on one runner: 2111-2753 s; four shards: ~1/4 of that plus ~5 min of setup.
  sweep:
    name: sweep ${{ matrix.shard }}
    needs: lane
    # not when the lane job says a push run stands down for a full run (#4743)
    if: ${{ needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.lane.outputs.sweep_timeout || '90') }}  # #5919: planned
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lane.outputs.sweep_matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            det-sweep-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # The oracle image is built once per Dockerfile and kept (docker save, under the Dockerfile's hash; det-sweep.yml's
      # cache): every shard loads it instead of building it. The fingerprint check is still the pin (#4309): a stale image
      # fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        env:
          IMAGE_CACHE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [ "$IMAGE_CACHE_HIT" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Re-sweep this shard's det ports for the coverage ledger (#4270)
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        run: |
          cd gitgalaxy
          start=$(date +%s)
          python tests/tools/proof_sweep.py --det-only --skip-db2 --jobs 4 --shard "${{ matrix.shard }}" \
            --no-ratchet --work "$RUNNER_TEMP/sweep" | tee "$RUNNER_TEMP/sweep.txt"
          echo "seconds: $(( $(date +%s) - start ))" >> "$RUNNER_TEMP/sweep.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Det sweep, shard ${{ matrix.shard }} (#4744)"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-sweep-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sweep/sweep.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the proofs' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-sweep-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/sweep/det/*/proof.log
            ${{ runner.temp }}/sweep/det/*/proof/report.json
          if-no-files-found: ignore
          retention-days: 7

  # #4744: the stale-record re-proofs, in parallel shards (evidence.py refresh --stale --shard I/N: every shard computes the
  # same stale list from the same tree and takes every N-th record of it). Each shard stages the records it wrote; the
  # `refresh` job puts them in place and re-renders the pages. A failed proof fails its shard (the records are staged anyway),
  # and so the run: no auto-merge. Measured on one runner: 2002-2579 s, sequential; six shards: ~1/6 plus ~5 min of setup.
  records:
    name: records ${{ matrix.shard }}
    needs: lane
    # not when the lane job says a push run stands down for a full run (#4743)
    if: ${{ needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.lane.outputs.records_timeout || '90') }}  # #5919: planned
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lane.outputs.records_matrix) }}
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            det-sweep-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # The oracle image is built once per Dockerfile and kept (docker save, under the Dockerfile's hash; det-sweep.yml's
      # cache): every shard loads it instead of building it. The fingerprint check is still the pin (#4309): a stale image
      # fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        env:
          IMAGE_CACHE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [ "$IMAGE_CACHE_HIT" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Re-prove this shard's stale records
        id: refresh
        continue-on-error: true
        shell: bash  # -eo pipefail: the refresh's exit status, not tee's
        env:
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # the Db2 records are the db2 job's (#4733): no Db2 container here
          # shellcheck disable=SC2086 -- KEYS is a space-separated list on purpose
          python tests/tools/evidence.py refresh --stale --skip-db2 --shard "${{ matrix.shard }}" --crucible ../cics-crucible \
            --work "$RUNNER_TEMP/evidence" $KEYS | tee "$RUNNER_TEMP/refresh.txt"
          echo "seconds: $(( $(date +%s) - start ))" >> "$RUNNER_TEMP/refresh.txt"

      - name: Stage the records this shard wrote
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/records-out"
          mkdir -p "$out/records"
          cd gitgalaxy
          # only the evidence records the proofs wrote (the refresh job re-renders the pages from them)
          git ls-files -z --modified --others --exclude-standard -- 'tests/equivalence/*/evidence.json' \
              'tests/cics_crucible/ports/*/*/evidence.json' \
            | while IFS= read -r -d '' f; do mkdir -p "$out/records/$(dirname "$f")"; cp "$f" "$out/records/$f"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        run: |
          {
            echo "## Stale records, shard ${{ matrix.shard }} (#4744)"
            echo '```'
            cat "$RUNNER_TEMP/refresh.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-records-${{ strategy.job-index }}
          path: ${{ runner.temp }}/records-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when a re-proof failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error title=Evidence refresh::a record's proof failed or could not run -- see the summary"
          exit 1

  # #5862: the stale det_mutation ledgers (tests/equivalence/det_mutation/), renewed on the nightly so `current` holds without a
  # PR per port. `det_mutation.py refresh` translates the stale cases again; where the det port's bytes are unchanged it
  # re-runs ONLY the recorded survivors (same seed, fast mode) and carries every other verdict. Exit 2 = a port moved (a person
  # runs `det_mutation.py run`): a warning, it must not hold back the other records. Exit 1 = a stated claim the re-run killed,
  # or an error result: the job fails, the bot PR is opened and not auto-merged. L5 stays strict: no stale carry (owner, 2026-10-21).
  det-mutation:
    needs: lane
    # not when the lane job says a push run stands down for a full run (#4743)
    if: ${{ needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            det-sweep-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # The oracle image is built once per Dockerfile and kept (docker save, under the Dockerfile's hash; det-sweep.yml's
      # cache): every shard loads it instead of building it. The fingerprint check is still the pin (#4309): a stale image
      # fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        env:
          IMAGE_CACHE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [ "$IMAGE_CACHE_HIT" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Renew the stale det mutation ledgers (#5862)
        id: detmut
        continue-on-error: true
        shell: bash  # -eo pipefail: the refresh's exit status, not tee's
        run: |
          cd gitgalaxy
          set +e
          # a moved port is run again (oldest ledger first) until 90 of the job's 120 minutes are spent; the rest wait for the next night
          python -u tests/tools/det_mutation.py refresh --run-moved --budget-min 90 --work "$RUNNER_TEMP/detmut" | tee "$RUNNER_TEMP/detmut.txt"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=det mutation::a det port moved since its ledger was cut and the run budget ended first: it is run again on the next night (see the summary)"
            rc=0
          fi
          exit "$rc"

      - name: Stage the ledgers this job wrote
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/detmut-out"
          mkdir -p "$out/records"
          cd gitgalaxy
          git ls-files -z --modified --others --exclude-standard -- 'tests/equivalence/det_mutation/*.json' \
            | while IFS= read -r -d '' f; do mkdir -p "$out/records/$(dirname "$f")"; cp "$f" "$out/records/$f"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        run: |
          {
            echo "## Stale det mutation ledgers (#5862)"
            echo '```'
            cat "$RUNNER_TEMP/detmut.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the renewed ledgers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-detmut
          path: ${{ runner.temp }}/detmut-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when a det mutation claim or result is wrong
        if: steps.detmut.outcome == 'failure'
        run: |
          echo "::error title=det mutation::a stated survivor was killed by the re-run, or a result errored -- see the summary"
          exit 1


  refresh:
    needs: [lane, db2, sweep, records, det-mutation]
    # runs whether the Db2 job ran (nightly, dispatch), was skipped (push) or failed: the non-Db2 refresh never waits on Db2's luck.
    # Not when the lane job says a push run stands down for a full run (#4743), and not when the lane job itself failed.
    if: ${{ !cancelled() && needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      surveyed: ${{ steps.survey.outcome == 'success' }}  # the publish-blockers job runs only on a survey that ran (#4863)
      sha: ${{ steps.asof.outputs.sha }}
      report: ${{ steps.report.outcome == 'success' }}  # the publish-report job runs only on a report that was rebuilt (#4963)
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          # always main, whatever event or branch started the run (#4640): the commit the lane job pinned, which the sweep
          # shards, the record shards and the Db2 job (#4733) all worked from (#4744), so that the ledger's fingerprints
          # and the records are those of the tree the proofs ran on
          ref: ${{ needs.lane.outputs.sha }}
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Record the commit the refresh is as of
        id: asof
        run: echo "sha=$(git -C gitgalaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Setup JDK 17 (the translation survey)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # #4863: the report's translation column (programs translated whole, holes, refusals) is a cics_census survey. It was
      # frozen into report.json and only re-rendered here, so the reports kept the translator of 2026-10-07 for days and
      # showed programs made whole since then at L0. Survey the run's pinned commit of main on the burned / pinned corpora
      # (translation only, no census repos in CI, ~5 min) and build the reports from it below. The SAME survey is the
      # nightly blockers baseline (blockers.txt / .json + a history line): the publish-blockers job below hands it to the
      # `generated` branch, so one survey a night feeds both (blocker-baseline.yml no longer runs on a schedule). A survey that cannot run
      # never holds back the records: the reports are then re-rendered from their last measured survey, as before, and the run warns.
      - name: Survey the translation (#4863)
        id: survey
        continue-on-error: true
        env:
          GG_SCRATCH: ${{ runner.temp }}/scratch
          SHA: ${{ steps.asof.outputs.sha }}
        run: |
          cd gitgalaxy
          # --crucible (#5054): the cics-crucible clone above is surveyed as one more burned corpus (+~1 min), so the
          # blocker feed below reads its rows and its leak scan runs on it
          PYTHONPATH="$PWD" python tests/tools/cics_census.py survey --baseline --no-census --no-fetch \
            --sha "$SHA" --root "$GG_SCRATCH" --crucible "$GITHUB_WORKSPACE/cics-crucible"
          {
            echo "## Translation survey (${SHA::12}, burned / pinned corpora, no census)"
            echo '```'
            head -4 "$GG_SCRATCH/census-cache/$SHA/blockers.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # the survey's cache dir minus the translator snapshot (src/) and logs: what `cics_census.py publish` reads
          mkdir -p "$RUNNER_TEMP/blockers-cache/census-cache"
          rsync -a --exclude src --exclude '*.log' "$GG_SCRATCH/census-cache/$SHA" "$RUNNER_TEMP/blockers-cache/census-cache/"

      # #5054 done-when 4: each burned estate's survey through blocker_report + blocker_ingest, as a customer's report
      # would go (rows match the blockers, known signatures link, hashes stable per salt, no source name leaks). Reads
      # the survey just cached. A failure (a leak, or an estate whose scan did not run) never holds back the records:
      # the step is continue-on-error and the job's last step fails the run on `steps.feed.outcome == 'failure'`.
      - name: Blocker report and ingest per burned estate (#5054)
        id: feed
        if: steps.survey.outcome == 'success'
        continue-on-error: true
        env:
          GG_SCRATCH: ${{ runner.temp }}/scratch
          SHA: ${{ steps.asof.outputs.sha }}
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/blocker_estate_feed.py "$GG_SCRATCH/census-cache/$SHA" \
            --out "$RUNNER_TEMP/blocker-feed" --extra-root "$GITHUB_WORKSPACE/cics-crucible" --require-sources
          cat "$RUNNER_TEMP/blocker-feed/feed.md" >> "$GITHUB_STEP_SUMMARY"
          # the unmatched rows ride the blockers-survey artifact to publish-blockers, which lays them on `generated` for the tick
          cp "$RUNNER_TEMP/blocker-feed/feed.json" "$RUNNER_TEMP/blockers-cache/blocker_feed.json"

      # #4493: the equivalence harness reports on itself (coverage, run status per program, input generation, blockers phrased
      # as fixes). It is built here, where the pinned corpora are on disk (the layouts are read from them), from the survey
      # just taken, and rides in the blockers-survey artifact to publish-blockers. A failure never holds back the survey, the
      # records or the blockers publish.
      - name: Build the harness report (#4493)
        id: harness
        if: steps.survey.outcome == 'success'
        continue-on-error: true
        env:
          GG_SCRATCH: ${{ runner.temp }}/scratch
          SHA: ${{ steps.asof.outputs.sha }}
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/harness_report.py --survey "$GG_SCRATCH/census-cache/$SHA" \
            --estate "burned estates" --out "$RUNNER_TEMP/blockers-cache/harness"
          {
            echo "## Harness report (${SHA::12}, burned / pinned corpora)"
            echo '```'
            sed -n 1,12p "$RUNNER_TEMP/blockers-cache/harness/harness_report.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the survey for the blockers publisher (#4863)
        if: steps.survey.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockers-survey
          path: ${{ runner.temp }}/blockers-cache/
          retention-days: 7

      # #4744: the proofs ran in the `sweep` and `records` jobs, in parallel on their own runners; this job only merges them.
      #
      # #4270: the det-sweep coverage ledger is keyed to harness / oracle fingerprints, so a harness change blanks every
      # entry (readers then treat coverage as unknown) until a sweep rewrites them. Re-sweep nightly and rewrite the ledger
      # from the sweep: `update` always takes fingerprints from the tree, never from the old entry.
      - name: Take the Db2 job's results (#4733)
        id: db2_in
        if: needs.db2.result == 'success' || needs.db2.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db2-results
          path: ${{ runner.temp }}/db2-in
        continue-on-error: true

      - name: Put the Db2 records in place (#4733)
        if: steps.db2_in.outcome == 'success'
        shell: bash
        run: |
          in="$RUNNER_TEMP/db2-in/records"
          [ -d "$in" ] || exit 0
          # only evidence records, as regular files: nothing else from an artifact reaches the tree
          bad=$(find "$in" -type f ! -name evidence.json -o -type l)
          if [ -n "$bad" ]; then echo "::error title=Db2 results::unexpected files in the Db2 artifact: $bad"; exit 1; fi
          cp -r "$in"/. gitgalaxy/

      - name: Take the record shards' results (#4744)
        id: records_in
        if: needs.records.result == 'success' || needs.records.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: refresh-records-*
          merge-multiple: true  # the shards' record sets are disjoint
          path: ${{ runner.temp }}/records-in
        continue-on-error: true

      - name: Put the re-proved records in place and re-render the pages (#4744)
        if: steps.records_in.outcome == 'success'
        shell: bash
        run: |
          in="$RUNNER_TEMP/records-in/records"
          if [ -d "$in" ]; then
            # only evidence records, as regular files: nothing else from an artifact reaches the tree
            bad=$(find "$in" -type f ! -name evidence.json -o -type l)
            if [ -n "$bad" ]; then echo "::error title=record shards::unexpected files in a shard artifact: $bad"; exit 1; fi
            cp -r "$in"/. gitgalaxy/
          fi
          # (#4825: the pages are no longer committed here; evidence-pages.yml renders them from main after merge)

      - name: Take the det mutation ledgers (#5862)
        id: detmut_in
        # cancelled too: a job that hit its time limit still uploaded the ledgers it finished, and dropping them made
        # every night re-run the same first cases and stop at the same long one (#5862)
        if: needs.det-mutation.result == 'success' || needs.det-mutation.result == 'failure' || needs.det-mutation.result == 'cancelled'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-detmut
          path: ${{ runner.temp }}/detmut-in
        continue-on-error: true

      - name: Put the renewed det mutation ledgers in place (#5862)
        if: steps.detmut_in.outcome == 'success'
        shell: bash
        run: |
          in="$RUNNER_TEMP/detmut-in/records/tests/equivalence/det_mutation"
          if [ -d "$in" ]; then
            # only ledger JSON, as regular files: nothing else from an artifact reaches the tree
            bad=$(find "$RUNNER_TEMP/detmut-in" -type f ! -name '*.json' -o -type l)
            if [ -n "$bad" ]; then echo "::error title=det mutation::unexpected files in the artifact: $bad"; exit 1; fi
            cp -r "$in"/. gitgalaxy/tests/equivalence/det_mutation/
          fi

      - name: Take the det sweep shards' results (#4744)
        id: sweep_in
        if: needs.sweep.result == 'success' || needs.sweep.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: refresh-sweep-shard-*
          path: ${{ runner.temp }}/sweep-in
        continue-on-error: true  # no shard reported: the merge below names every case missing

      # The sweep applies the det_sweep_baseline ratchet, now over the MERGED shards (each shard ran --no-ratchet): a sweep
      # that proves fewer cases than the baseline expects, or lacks a case (a shard that died), exits 1, fails this job, and
      # the ledger is NOT rewritten from it. --skip-ledger-check: the ledger is rewritten from this very sweep next.
      - name: Merge the det sweep and apply its ratchet (#4270, #4744)
        id: ledger_sweep
        continue-on-error: true
        shell: bash  # -eo pipefail: the aggregate's exit status, not tee's
        run: |
          cd gitgalaxy
          shopt -s nullglob
          found=("$RUNNER_TEMP"/sweep-in/*/sweep.json)
          if [ "${#found[@]}" -eq 0 ]; then echo "no shard reported a sweep.json"; exit 1; fi
          python tests/tools/proof_sweep.py --aggregate "${found[@]}" --expect all --skip-ledger-check | tee "$RUNNER_TEMP/sweep.txt"

      - name: Rewrite the coverage ledger from the sweep (#4270)
        # Only from a sweep that passed the ratchet.
        if: steps.ledger_sweep.outcome == 'success'
        shell: bash
        env:
          DB2_SWEEP_OK: ${{ needs.db2.outputs.sweep_ok }}
        run: |
          cd gitgalaxy
          shopt -s nullglob
          sweeps=("$RUNNER_TEMP"/sweep-in/*/sweep.json)
          # #4733: the Db2 job's sweep too, when it ran and passed its ratchet; otherwise the Db2 entries stay as they were
          # (stale, not zero, once their inputs move: #4730)
          if [ "$DB2_SWEEP_OK" = "true" ]; then
            sweeps+=("$RUNNER_TEMP"/db2-in/sweep/*/sweep.json)  # one per Db2 shard (#4863)
          fi
          python tests/tools/det_coverage_ledger.py update "${sweeps[@]}"

      - name: Rebuild the purchaser-facing evidence reports (#4601)
        id: report
        if: always()
        env:
          GG_SCRATCH: ${{ runner.temp }}/scratch
          SHA: ${{ steps.asof.outputs.sha }}
          SURVEYED: ${{ steps.survey.outcome == 'success' }}
          EVIDENCE_REPORT_WRITE_INDEX: "1"  # #5206: the index README is written here (published), never over main's stub
        run: |
          cd gitgalaxy
          # #4863: built from this run's translation survey (above), so the translation column is of this commit; the
          # records' status and the coverage ledger's freshness are recomputed at build time as with --refresh --live.
          # #4758: a Db2 case's det verdict comes from the coverage ledger rewritten above (an entry = the last sweep of
          # that case proved it): this run's Db2 sweep on a full run, the last nightly's on a push run (stale, not L1,
          # once its inputs move: #4730), so no sweep is passed here.
          if [ "$SURVEYED" = "true" ]; then
            PYTHONPATH="$PWD" python tests/tools/evidence_report.py --all --baseline --sha "$SHA" --root "$GG_SCRATCH"
          else
            echo "::warning title=Evidence refresh::the translation survey failed; the reports keep their last measured translation (#4863)"
            python tests/tools/evidence_report.py --refresh --live
          fi

      # #4963: the rendered report is published to the `generated` branch by the publish-report job, not committed on main.
      - name: Keep the rendered evidence reports for the publish job
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-report
          path: gitgalaxy/docs/language_status/evidence_report
          retention-days: 1

      # #4054: the estate roll-up (E0-E4 from the evidence records, lines from the corpora checked out above). It is written
      # outside the repository and published on its own path: evidence_report.py treats any extra file under evidence_report/
      # as stray. A failure here never blocks the L0-L5 report above.
      - name: Roll up the estate evidence (#4054)
        id: estate
        continue-on-error: true
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/estate_evidence.py --out "$RUNNER_TEMP/estate-evidence"

      - name: Keep the estate roll-up for the publish job
        if: always() && steps.estate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estate-evidence
          path: ${{ runner.temp }}/estate-evidence
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Evidence refresh"
            echo "The proofs ran in the sweep and records jobs (their summaries have the per-case output)."
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | grep -E '^(det|model):|^sweep:' || echo "(no sweep output)"
            echo '```'
            echo '```'
            (cd gitgalaxy && python tests/tools/evidence.py status) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push lane - hold the PR back if a full run has started meanwhile (#4743)
        id: late_gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=$(gh api "repos/$REPO/actions/workflows/evidence-refresh.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .event != "push")] | length')
          if [ "$active" -gt 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A full refresh started while this one ran: no PR from the push lane (the full PR carries it)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # promoter-bot#64 (2026-10-24): the squid-shepherd App has its own API quota; AUTOMATION_PAT shares the
      # account's 5,000/h with the agent fleet, and the shepherd stopped merging when it ran out. The PAT stays
      # the fallback (a failed mint leaves the output empty).
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      - name: Advance gitgalaxy to latest origin/main before staging the bot PR
        # The sweep, records, det-mutation and Db2 jobs take ~30-45 min on the pinned commit; merges to main in the
        # meantime otherwise leave the bot PR conflicting or behind on the files those merges touched. Re-home the
        # refreshed JSON files onto current origin/main so the PR is clean against main.
        if: steps.late_gate.outputs.publish != 'false'
        run: |
          stage="$RUNNER_TEMP/pr-stage"
          mkdir -p "$stage"
          (
            cd gitgalaxy
            shopt -s nullglob
            files=(
              tests/equivalence/det_sweep_coverage/*.json
              tests/equivalence/det_mutation/*.json
              tests/equivalence/*/evidence.json
              tests/cics_crucible/ports/*/*/evidence.json
            )
            if [ "${#files[@]}" -gt 0 ]; then
              cp --parents "${files[@]}" "$stage/"
            fi
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -d "$stage/tests" ]; then
              cp -r "$stage"/. .
            fi
          )

      - name: Open or update the bot PR with the refreshed records
        id: cpr
        if: steps.late_gate.outputs.publish != 'false'
        uses: squid-protocol/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # forked from peter-evans/create-pull-request v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: gitgalaxy
          base: main  # never the checked-out ref of another run (#4640)
          commit-message: "evidence: refresh as of commit ${{ steps.asof.outputs.sha }}"
          title: "evidence: refresh stale records and the evidence report"
          draft: false  # auto-merge cannot be enabled on a draft
          body: |
            Refreshed as of commit ${{ steps.asof.outputs.sha }} (main at the time of the run).

            Automated re-proof of the evidence records (#4048) that a harness, oracle or generator change made stale.
            Each record's proof was run again on the committed port and case; the records and
            the records are rewritten from those runs (their pages are published from main to the `generated` branch by evidence-pages.yml, #4825). A proof that now fails is recorded as
            not proven. The evidence reports (docs/language_status/evidence_report/) are re-rendered from them (#4703) and published to the `generated` branch, not committed (#4963),
            the det-sweep coverage ledger (tests/equivalence/det_sweep_coverage/, one file per case: #4789) from the
            sweep. The CICS spec status page is published to the `generated` branch by generated-docs.yml (#5057).
            Approvals are never written by this job. Auto-merge (squash) is enabled when every proof succeeded.
          branch: auto/evidence-refresh${{ github.event_name != 'push' && '-full' || '' }}  # a lane's own branch (#4743)
          delete-branch: true
          add-paths: |
            tests/equivalence/det_sweep_coverage/*.json
            tests/equivalence/det_mutation/*.json
            tests/equivalence/*/evidence.json
            tests/cics_crucible/ports/*/*/evidence.json

      - name: Enable squash auto-merge on the bot PR
        # Only after a clean run: a proof that failed is recorded as not proven and needs a person (#4048).
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed' && needs.records.result == 'success' && needs.det-mutation.result == 'success' && needs.sweep.result == 'success' && steps.ledger_sweep.outcome == 'success' && (needs.db2.result == 'success' || needs.db2.result == 'skipped')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        # #6693: the bot PR merges through its own GitHub auto-merge and never gets `shepherd:merge` (an approval is bound
        # to its head, so every force-push dropped the label and turned auto-merge off again): enable it once checks register.
        run: |
          for i in $(seq 1 20); do
            if out=$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            case "$out" in *"clean status"*) sleep 30 ;; *) exit 1 ;; esac
          done
          echo "::warning title=Evidence refresh::auto-merge could not be enabled (checks never registered); PR #$PR left open"

      - name: Fail when a re-proof failed
        if: needs.records.result != 'success' || needs.det-mutation.result != 'success' || needs.sweep.result != 'success' || steps.ledger_sweep.outcome == 'failure' || steps.feed.outcome == 'failure' || needs.db2.result == 'failure'
        run: |
          echo "::error title=Evidence refresh::a record's proof, the det sweep, the Db2 job or the blocker-feed leak scan failed or could not run -- see the summary"
          exit 1

  # #4863 (step 3, one survey a night, one writer): the refresh job's translation survey of main is also the nightly blockers
  # baseline (`cics_census.py blockers`). This job publishes it -- blockers.txt / blockers.json / meta.json and one line in
  # blockers_history.jsonl -- to the `generated` branch under docs/language_status/blockers/, like evidence-pages.yml does
  # for the pages (never a commit on main; blocker-baseline.yml, which surveyed the same corpora a second time and kept an
  # artifact nobody read, no longer runs on a schedule). Burned / pinned corpora only: the census counts stay a local run.
  # #4963: the rendered evidence report (derived output) goes to the `generated` branch with the other bot output, not into the
  # bot PR: main then moves only for the records and the ledger, which are inputs of human approval. Main's code only.
  publish-report:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.outputs.report == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push to the `generated` branch only
    concurrency:
      group: evidence-pages  # the one writer of the branch, as publish-blockers below and evidence-pages.yml
      cancel-in-progress: false
    steps:
      - name: Checkout the refreshed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: true  # the publish step pushes to `generated` with this token; no PR code runs here

      - name: Download the rendered reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-report
          path: main/docs/language_status/evidence_report

      - name: Publish the evidence reports to the generated branch
        env:
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          cd main
          python tests/tools/generated_branch.py publish --stamp evidence-report \
            --message "evidence report as of main $SHA" \
            docs/language_status/evidence_report

      # #4054: the estate roll-up, when the refresh job built one (a missing artifact skips, never fails, the report above).
      - name: Download the estate roll-up
        id: estate
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: estate-evidence
          path: main/docs/language_status/estate_evidence

      - name: Publish the estate roll-up to the generated branch
        if: steps.estate.outcome == 'success'
        env:
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          cd main
          python tests/tools/generated_branch.py publish --stamp estate-evidence \
            --message "estate evidence roll-up as of main $SHA" \
            docs/language_status/estate_evidence

  publish-blockers:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.outputs.surveyed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push to the `generated` branch only
    concurrency:
      group: evidence-pages  # the same one writer as evidence-pages.yml: they push the same branch
      cancel-in-progress: false
    steps:
      - name: Checkout the surveyed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: true  # the harness step pushes to `generated` from this checkout; no PR code runs here

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r main/ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e ./main

      - name: Take the refresh job's survey
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blockers-survey
          path: ${{ runner.temp }}/blockers-survey

      # A dispatch from any other ref NEVER writes `generated`: it lays the same output into a scratch dir and uploads it, so
      # a branch run still proves what would be published (blockers.json, meta.json, the new history line).
      - name: Preview the publish (not main, nothing is pushed)
        if: github.ref != 'refs/heads/main'
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/generated-preview"
          (cd main && PYTHONPATH="$PWD" python tests/tools/cics_census.py publish --sha "$SHA" \
            --root "$RUNNER_TEMP/blockers-survey" --into "$RUNNER_TEMP/generated-preview")
          mkdir -p "$RUNNER_TEMP/generated-preview/docs/language_status/blockers"
          [ ! -f "$RUNNER_TEMP/blockers-survey/blocker_feed.json" ] || cp "$RUNNER_TEMP/blockers-survey/blocker_feed.json" "$RUNNER_TEMP/generated-preview/docs/language_status/blockers/"
          {
            echo "## Blockers publish PREVIEW (${SHA::12}, ref ${GITHUB_REF_NAME}; generated NOT written)"
            echo '```'
            head -6 "$RUNNER_TEMP/generated-preview/docs/language_status/blockers/blockers.txt"
            echo '```'
            tail -1 "$RUNNER_TEMP/generated-preview/docs/language_status/blockers/blockers_history.jsonl" | cut -c1-300
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preview the harness report (not main, nothing is pushed) (#4493)
        if: github.ref != 'refs/heads/main'
        run: |
          src="$RUNNER_TEMP/blockers-survey/harness"
          [ -f "$src/harness_report.md" ] || { echo "::warning title=Harness report::the refresh job built no harness report"; exit 0; }
          mkdir -p "$RUNNER_TEMP/generated-preview/docs/language_status/harness"
          cp "$src/harness_report.md" "$src/harness_report.json" "$RUNNER_TEMP/generated-preview/docs/language_status/harness/"
          echo "Harness report PREVIEW built (generated NOT written)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockers-generated-preview
          path: ${{ runner.temp }}/generated-preview/
          retention-days: 7

      - name: Checkout the generated branch
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: generated
          fetch-depth: 1
          persist-credentials: true  # this job pushes; it runs no PR code (nightly / dispatch on main only)

      - name: Publish blockers and the history line to the generated branch
        if: github.ref == 'refs/heads/main'
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          if git -C generated fetch --depth 1 origin generated 2>/dev/null; then
            git -C generated checkout -q -B generated FETCH_HEAD
          else  # first run: an orphan branch holding only generated output
            git -C generated checkout -q --orphan generated
            git -C generated rm -rqf .
          fi
          (cd main && PYTHONPATH="$PWD" python tests/tools/cics_census.py publish --sha "$SHA" \
            --root "$RUNNER_TEMP/blockers-survey" --into "$GITHUB_WORKSPACE/generated")
          mkdir -p generated/docs/language_status/blockers
          [ ! -f "$RUNNER_TEMP/blockers-survey/blocker_feed.json" ] || cp "$RUNNER_TEMP/blockers-survey/blocker_feed.json" generated/docs/language_status/blockers/
          cd generated
          [ -f GENERATED_FROM ] || echo "Generated output only -- never edit by hand." > GENERATED_FROM
          if ! grep -q "docs/language_status/blockers/" GENERATED_FROM; then
            echo "docs/language_status/blockers/: the nightly blockers ranking and history, from the evidence refresh's survey (#4863)." >> GENERATED_FROM
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "blockers unchanged at ${SHA::12}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "blockers baseline as of main $SHA"
          python ../main/tests/tools/generated_branch.py push-head --root .  # #6563: another writer may have pushed since the fetch
          {
            echo "## Blockers published (${SHA::12})"
            echo '```'
            head -6 docs/language_status/blockers/blockers.txt
            echo '```'
            echo "history: $(wc -l < docs/language_status/blockers/blockers_history.jsonl) lines"
          } >> "$GITHUB_STEP_SUMMARY"

      # #4493: its own step, so a harness report problem never blocks the blockers publish above.
      - name: Publish the harness report to the generated branch (#4493)
        if: github.ref == 'refs/heads/main'
        env:
          SHA: ${{ needs.refresh.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/blockers-survey/harness"
          [ -f "$src/harness_report.md" ] || { echo "::warning title=Harness report::the refresh job built no harness report"; exit 0; }
          mkdir -p main/docs/language_status/harness
          cp "$src/harness_report.md" "$src/harness_report.json" main/docs/language_status/harness/
          cd main
          # `main` was checked out with persist-credentials: false (the first run on 2026-10-24 died with "could not read
          # Username", run 40136742662): hand this one step the job token, for the push only (main-only step, no PR code)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python tests/tools/generated_branch.py publish --stamp harness-report \
            --message "harness report as of main $SHA" \
            docs/language_status/harness
          echo "published the harness report from main ${SHA::12}: https://github.com/${GITHUB_REPOSITORY}/tree/generated/docs/language_status/harness" >> "$GITHUB_STEP_SUMMARY"
