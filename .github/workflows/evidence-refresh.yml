name: Evidence Refresh

# #4048: re-prove every evidence record that has gone stale, and open a PR with the refreshed records.
#
# The staleness policy (owner decision, #4048 Q1): a change to a port, its case, its corpus pin or its declared
# differences fails the PR that makes it (tests/cobol_mainframe/test_evidence.py), so that PR re-proves the record.
# A change to the harness, the oracle or the generator stales EVERY record at once; the record then shows as stale
# (never as proven), and this job re-proves it: `evidence.py refresh --stale` runs each stale record's proof on the
# committed port and case, writes the new proof (proven or not) and re-renders docs/language_status/evidence/.
#
# #4703: the rendered evidence report (docs/language_status/evidence_report/) is derived output. It is regenerated HERE, on
# main, and not in feature PRs (which would conflict on the same generated files); per-PR CI only prints the level deltas
# (smoke-test.yml, advisory) and the release gate (publish.yml) requires `evidence_report.py --check --live` clean.
# This job runs on every push to main, nightly, and on demand. It always works from the CURRENT main, and its
# concurrency group lets a running refresh finish and keeps only the newest push queued behind it (a refresh takes
# ~1 h; cancelling on every push starved it on busy merge days, so no refresh ever completed). When nothing changed it opens no PR. Otherwise it
# opens (or updates) the bot PR from auto/evidence-refresh onto main and enables squash auto-merge on it. The report
# files stay content-deterministic (so --check compares content), so the commit it was refreshed at ("as of commit
# <sha>") is stamped on the bot's commit and PR, not inside the files.
#
# Earlier bot PRs failed twice: #4640 was opened against a feature branch (the base is now pinned to main) and #4649
# went dirty while parallel PRs kept conflicting on the report (those PRs no longer commit it).
#
# Auto-merge happens only when every proof step succeeded. A run where a proof or the sweep failed still opens the PR,
# but leaves it for a person (and the job fails). Approvals are never touched (only `evidence.py approve`, run by a
# person at a terminal, writes one).
#
# #4733: the Db2 cases (most of GenApp, several CBSA programs) need IBM's Db2 container, so they run in their own job,
# `db2`: the Db2 half of the det sweep (`proof_sweep.py --det-only --db2-only`, for the coverage ledger) and the re-proof of
# the stale Db2 evidence records, on one runner with the Db2 image pinned by digest (tests/tools/equivalence_db2.py IMAGE,
# docs/language_status/oracle_assumptions.md). The job uploads its sweep.json and the records it wrote; `refresh` (which
# `needs: db2`) merges them in before it rewrites the ledger (det_coverage_ledger.py update takes both sweeps), re-renders the
# pages and builds the reports, so one bot PR carries the whole sweep. CADENCE: the Db2 job runs on the NIGHTLY schedule and
# on a manual dispatch with db2 = true (the default), not on every push to main: it adds its own time (image pull, Db2 start,
# the sweep, the records: see the job's summary for the measured time) ahead of the ~1 h refresh, and merge-heavy days push
# many times. A push-triggered refresh skips the job, leaves the Db2 half of the ledger and the Db2 records as the last
# nightly wrote them, and the report shows them as stale, not as zero, once their inputs move (#4730). The non-Db2 path is
# the same on every trigger. A Db2 job that fails (no Db2, a lost proof) does not stop the non-Db2 refresh, but the run
# fails and the bot PR is left for a person, as for any failed proof.
#
# #4743: two LANES. GitHub keeps ONE pending run per concurrency group and a newer run cancels the older pending one even with
# cancel-in-progress: false, so with one group every queued nightly / dispatched Db2 run was cancelled by the next push's run
# (runs 37874905643 by #4742's). Now: the PUSH lane (event push) and the FULL lane (schedule, workflow_dispatch) have their own
# concurrency groups (a push run can no longer replace a full run), their own bot branches (auto/evidence-refresh and
# auto/evidence-refresh-full: neither force-pushes over the other's PR) and a hand-over in the `lane` job so the two never have
# PRs open together, which would conflict on the rendered report:
#   - a full run closes the open push-lane bot PR before it starts (the full run re-proves everything the push run does, plus Db2);
#   - a push run does nothing at all while a full run is queued or running, and re-checks just before it opens its PR (a push
#     run already under way when the full run started). The full PR's merge is itself a push to main, so the push lane then
#     refreshes whatever moved meanwhile. Nothing is lost: both lanes always work from the CURRENT main, and
#     det_coverage_ledger.py update rewrites only the cases a sweep proved (a push run leaves the Db2 entries as main has them).
# #4744: SPEED. Measured on completed push-lane refreshes (runs 37859714260, 37866635888), one 4-vCPU runner, sequential: det
# sweep 2111-2753 s, stale-record re-proofs 2002-2579 s, ~1 min checkout + report. Now the proofs run in parallel jobs and a
# short `refresh` job merges them: `sweep` (4 shards of proof_sweep.py --shard, --no-ratchet), `records` (6 shards of
# evidence.py refresh --stale --shard) and, on the full lane, `db2`, all of the ONE commit the `lane` job pinned. `refresh`
# downloads their outputs, puts the records in place, re-renders the pages, applies the det_sweep_baseline ratchet to the
# MERGED sweep (proof_sweep.py --aggregate: a case with no result, i.e. a shard that died, fails it), rewrites the ledger from
# it, rebuilds the reports and opens the PR. Nothing is weakened: the same proofs, the same ratchet, the same failure and
# auto-merge rules (a failed proof, a failed or missing shard, a failed Db2 job: the PR is opened, never auto-merged, the run
# fails). Expected wall time: ~5 min setup + the slowest shard (~11 min sweep, ~7-10 min records) + ~8 min `refresh`
# (setup, merge, report, PR): ~25 min instead of 75-100.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:
    inputs:
      db2:
        description: "also sweep and re-prove the Db2 cases (starts IBM's Db2 container; the nightly run always does)"
        type: boolean
        default: true
      keys:
        description: "only these records (space-separated keys, e.g. carddemo-dateutil crucible:pc-wizard/PCWIZ)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # one group per lane (#4743): a push run must not replace a pending nightly / dispatched full run. cancel-in-progress is
  # false: a running refresh finishes; within a lane GitHub keeps only the newest pending run, which is what a lane wants
  # (every run starts from the current main), but never across lanes.
  group: evidence-refresh-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: false

jobs:
  # #4743: the hand-over between the two lanes (see the header). Cheap; no checkout, no secrets beyond the bot token.
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      defer: ${{ steps.push_gate.outputs.defer }}
      sha: ${{ steps.pin.outputs.sha }}  # #4744: the one commit every job of this run works from
    env:
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
    steps:
      # #4744: the sweep shards, the record shards, the Db2 job and the refresh job run in parallel, on separate runners, and
      # must all be of the SAME tree (the ledger's fingerprints and the records' inputs are judged against it), so main's
      # head is read once here and every checkout below takes it.
      - name: Pin the commit of main this run is of
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$REPO/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"

      - name: Push lane - stand down while a full run is queued or running
        id: push_gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$REPO/actions/workflows/evidence-refresh.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .event != "push")] | length')
          if [ "$active" -gt 0 ]; then
            echo "defer=true" >> "$GITHUB_OUTPUT"
            echo "A full (schedule / dispatch) refresh is queued or running: this push refresh stands down; its PR will move main and trigger the next one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "defer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full lane - close the push lane's open bot PR (superseded)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          prs=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:auto/evidence-refresh&per_page=10" --jq '.[].number')
          for pr in $prs; do
            gh pr close "$pr" --repo "$REPO" --delete-branch \
              --comment "Superseded by a full (${EVENT}) evidence refresh, which re-proves everything this one did, plus the Db2 cases (#4743)."
          done

  # #4733: the Db2 half of the sweep and the Db2 records. Its own runner: IBM's Db2 Community container needs --privileged
  # and a few GB of memory (a GitHub-hosted ubuntu-latest runner has both: 4 vCPU, 16 GB, root docker).
  db2:
    needs: lane
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.db2)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      sweep_ok: ${{ steps.db2_sweep.outcome == 'success' }}
      sha: ${{ steps.db2_asof.outputs.sha }}  # the commit the Db2 results are of: the refresh job works from the same one
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Record the commit the Db2 results are of
        id: db2_asof
        run: echo "sha=$(git -C gitgalaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone cics-crucible at the pin
        run: |
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Build the oracle image and check it against its pin (#4309)
        run: |
          docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict

      # The image is the one tests/tools/equivalence_db2.py pins by digest (#4733): pulled here by that name, so the
      # harness starts the container from it (a tag, or a different digest, is refused by test_db2_image_pin.py).
      - name: Pull the pinned Db2 image (#4733)
        run: |
          image=$(cd gitgalaxy/tests/tools && python -c "import equivalence_db2; print(equivalence_db2.IMAGE)")
          echo "Db2 image: $image"
          docker pull -q "$image"
          echo "DB2 image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-sweep the Db2 det ports for the coverage ledger (#4733)
        id: db2_sweep
        continue-on-error: true
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # The same ratchet as the non-Db2 sweep: a Db2 case that stops proving fails the job, and its coverage is not
          # written to the ledger.
          python tests/tools/proof_sweep.py --det-only --db2-only --jobs 4 --work "$RUNNER_TEMP/db2-sweep" \
            | tee "$RUNNER_TEMP/db2-sweep.txt"
          echo "sweep_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Re-prove the stale Db2 records (#4733)
        id: db2_records
        continue-on-error: true
        shell: bash
        env:
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # shellcheck disable=SC2086 -- KEYS is a space-separated list on purpose
          python tests/tools/evidence.py refresh --stale --only-db2 --crucible ../cics-crucible --work "$RUNNER_TEMP/db2-evidence" $KEYS \
            | tee "$RUNNER_TEMP/db2-refresh.txt"
          echo "records_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Stage what the refresh job takes
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/db2-out"
          mkdir -p "$out/sweep"
          if [ -f "$RUNNER_TEMP/db2-sweep/sweep.json" ]; then cp "$RUNNER_TEMP/db2-sweep/sweep.json" "$out/sweep/sweep.json"; fi
          cd gitgalaxy
          # only the evidence records the proofs wrote (the refresh job re-renders the pages from them)
          git ls-files -z --modified --others --exclude-standard -- 'tests/equivalence/*/evidence.json' \
              'tests/cics_crucible/ports/*/*/evidence.json' \
            | while IFS= read -r -d '' f; do mkdir -p "$out/records/$(dirname "$f")"; cp "$f" "$out/records/$f"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        env:
          SWEEP_SECONDS: ${{ steps.db2_sweep.outputs.sweep_seconds }}
          RECORDS_SECONDS: ${{ steps.db2_records.outputs.records_seconds }}
        run: |
          {
            echo "## Db2 cases (#4733)"
            echo "sweep: ${SWEEP_SECONDS:-?} s, records: ${RECORDS_SECONDS:-?} s"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/db2-sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no sweep output)"
            echo '```'
            echo '```'
            cat "$RUNNER_TEMP/db2-refresh.txt" 2>/dev/null || echo "(no records output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Db2 results for the refresh job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db2-results
          path: ${{ runner.temp }}/db2-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the Db2 proofs' logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db2-sweep-logs
          path: |
            ${{ runner.temp }}/db2-sweep/det/*/proof.log
            ${{ runner.temp }}/db2-sweep/det/*/proof/report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when the Db2 sweep or a Db2 re-proof failed
        if: steps.db2_sweep.outcome == 'failure' || steps.db2_records.outcome == 'failure'
        run: |
          echo "::error title=Db2 cases::the Db2 det sweep or a Db2 record's proof failed or could not run -- see the summary"
          exit 1

  # #4744: the non-Db2 det sweep for the coverage ledger, in parallel shards (proof_sweep.py --shard I/N, balanced by
  # tests/equivalence/det_sweep_durations.json, as det-sweep.yml does). Each shard writes its sweep.json and leaves the
  # ratchet to the `refresh` job, which merges them (--aggregate: a missing case, a shard that died, fails it).
  # Measured on one runner: 2111-2753 s; four shards: ~1/4 of that plus ~5 min of setup.
  sweep:
    name: sweep ${{ matrix.shard }}
    needs: lane
    # not when the lane job says a push run stands down for a full run (#4743)
    if: ${{ needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            det-sweep-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # The oracle image is built once per Dockerfile and kept (docker save, under the Dockerfile's hash; det-sweep.yml's
      # cache): every shard loads it instead of building it. The fingerprint check is still the pin (#4309): a stale image
      # fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        env:
          IMAGE_CACHE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [ "$IMAGE_CACHE_HIT" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Re-sweep this shard's det ports for the coverage ledger (#4270)
        shell: bash  # -eo pipefail: the sweep's exit status, not tee's
        run: |
          cd gitgalaxy
          start=$(date +%s)
          python tests/tools/proof_sweep.py --det-only --skip-db2 --jobs 4 --shard "${{ matrix.shard }}" \
            --no-ratchet --work "$RUNNER_TEMP/sweep" | tee "$RUNNER_TEMP/sweep.txt"
          echo "seconds: $(( $(date +%s) - start ))" >> "$RUNNER_TEMP/sweep.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Det sweep, shard ${{ matrix.shard }} (#4744)"
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | grep -v 'WARNING\|INFO' | tail -60 || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-sweep-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sweep/sweep.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the proofs' logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-sweep-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/sweep/det/*/proof.log
            ${{ runner.temp }}/sweep/det/*/proof/report.json
          if-no-files-found: ignore
          retention-days: 7

  # #4744: the stale-record re-proofs, in parallel shards (evidence.py refresh --stale --shard I/N: every shard computes the
  # same stale list from the same tree and takes every N-th record of it). Each shard stages the records it wrote; the
  # `refresh` job puts them in place and re-renders the pages. A failed proof fails its shard (the records are staged anyway),
  # and so the run: no auto-merge. Measured on one runner: 2002-2579 s, sequential; six shards: ~1/6 plus ~5 min of setup.
  records:
    name: records ${{ matrix.shard }}
    needs: lane
    # not when the lane job says a push run stands down for a full run (#4743)
    if: ${{ needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          ref: ${{ needs.lane.outputs.sha }}  # the run's pinned commit of main (#4640, #4744)
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install -e "./gitgalaxy[translator]"

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: evidence-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            evidence-m2-
            det-sweep-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # The oracle image is built once per Dockerfile and kept (docker save, under the Dockerfile's hash; det-sweep.yml's
      # cache): every shard loads it instead of building it. The fingerprint check is still the pin (#4309): a stale image
      # fails it.
      - name: Cache the GnuCOBOL oracle image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gnucobol-image.tar
          key: gnucobol-image-${{ hashFiles('gitgalaxy/tests/equivalence/gnucobol.Dockerfile') }}

      - name: Load or build the oracle image, and check it against its pin (#4309)
        env:
          IMAGE_CACHE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [ "$IMAGE_CACHE_HIT" = "true" ]; then
            docker load -i "$RUNNER_TEMP/gnucobol-image.tar"
          else
            docker build -q -t gitgalaxy-gnucobol:3 -f gitgalaxy/tests/equivalence/gnucobol.Dockerfile gitgalaxy/tests/equivalence
            docker save -o "$RUNNER_TEMP/gnucobol-image.tar" gitgalaxy-gnucobol:3
          fi
          python gitgalaxy/tests/tools/equivalence_oracle.py --strict
          echo "GITGALAXY_ORACLE_PREBUILT=1" >> "$GITHUB_ENV"  # the harness need not rebuild it per proof

      - name: Re-prove this shard's stale records
        id: refresh
        continue-on-error: true
        shell: bash  # -eo pipefail: the refresh's exit status, not tee's
        env:
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          cd gitgalaxy
          start=$(date +%s)
          # the Db2 records are the db2 job's (#4733): no Db2 container here
          # shellcheck disable=SC2086 -- KEYS is a space-separated list on purpose
          python tests/tools/evidence.py refresh --stale --skip-db2 --shard "${{ matrix.shard }}" --crucible ../cics-crucible \
            --work "$RUNNER_TEMP/evidence" $KEYS | tee "$RUNNER_TEMP/refresh.txt"
          echo "seconds: $(( $(date +%s) - start ))" >> "$RUNNER_TEMP/refresh.txt"

      - name: Stage the records this shard wrote
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/records-out"
          mkdir -p "$out/records"
          cd gitgalaxy
          # only the evidence records the proofs wrote (the refresh job re-renders the pages from them)
          git ls-files -z --modified --others --exclude-standard -- 'tests/equivalence/*/evidence.json' \
              'tests/cics_crucible/ports/*/*/evidence.json' \
            | while IFS= read -r -d '' f; do mkdir -p "$out/records/$(dirname "$f")"; cp "$f" "$out/records/$f"; done
          find "$out" -type f | sort

      - name: Summary
        if: always()
        run: |
          {
            echo "## Stale records, shard ${{ matrix.shard }} (#4744)"
            echo '```'
            cat "$RUNNER_TEMP/refresh.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this shard's records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-records-${{ strategy.job-index }}
          path: ${{ runner.temp }}/records-out
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when a re-proof failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error title=Evidence refresh::a record's proof failed or could not run -- see the summary"
          exit 1

  refresh:
    needs: [lane, db2, sweep, records]
    # runs whether the Db2 job ran (nightly, dispatch), was skipped (push) or failed: the non-Db2 refresh never waits on Db2's luck.
    # Not when the lane job says a push run stands down for a full run (#4743), and not when the lane job itself failed.
    if: ${{ !cancelled() && needs.lane.result == 'success' && needs.lane.outputs.defer != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_ORACLE_STRICT: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          # always main, whatever event or branch started the run (#4640): the commit the lane job pinned, which the sweep
          # shards, the record shards and the Db2 job (#4733) all worked from (#4744), so that the ledger's fingerprints
          # and the records are those of the tree the proofs ran on
          ref: ${{ needs.lane.outputs.sha }}
          fetch-depth: 0  # a record's mutation section is judged against its commit's inputs (git history)
          persist-credentials: false

      - name: Record the commit the refresh is as of
        id: asof
        run: echo "sha=$(git -C gitgalaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          # [translator]: tree-sitter-language-pack, which the det translator parses COBOL with. Without it every det
          # proof fails to translate and the sweep proves 0/40 (#4270), as run 37661913700 did.
          pip install -e "./gitgalaxy[translator]"

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #4744: the proofs ran in the `sweep` and `records` jobs, in parallel on their own runners; this job only merges them.
      #
      # #4270: the det-sweep coverage ledger is keyed to harness / oracle fingerprints, so a harness change blanks every
      # entry (readers then treat coverage as unknown) until a sweep rewrites them. Re-sweep nightly and rewrite the ledger
      # from the sweep: `update` always takes fingerprints from the tree, never from the old entry.
      - name: Take the Db2 job's results (#4733)
        id: db2_in
        if: needs.db2.result == 'success' || needs.db2.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db2-results
          path: ${{ runner.temp }}/db2-in
        continue-on-error: true

      - name: Put the Db2 records in place (#4733)
        if: steps.db2_in.outcome == 'success'
        shell: bash
        run: |
          in="$RUNNER_TEMP/db2-in/records"
          [ -d "$in" ] || exit 0
          # only evidence records, as regular files: nothing else from an artifact reaches the tree
          bad=$(find "$in" -type f ! -name evidence.json -o -type l)
          if [ -n "$bad" ]; then echo "::error title=Db2 results::unexpected files in the Db2 artifact: $bad"; exit 1; fi
          cp -r "$in"/. gitgalaxy/

      - name: Take the record shards' results (#4744)
        id: records_in
        if: needs.records.result == 'success' || needs.records.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: refresh-records-*
          merge-multiple: true  # the shards' record sets are disjoint
          path: ${{ runner.temp }}/records-in
        continue-on-error: true

      - name: Put the re-proved records in place and re-render the pages (#4744)
        if: steps.records_in.outcome == 'success'
        shell: bash
        run: |
          in="$RUNNER_TEMP/records-in/records"
          if [ -d "$in" ]; then
            # only evidence records, as regular files: nothing else from an artifact reaches the tree
            bad=$(find "$in" -type f ! -name evidence.json -o -type l)
            if [ -n "$bad" ]; then echo "::error title=record shards::unexpected files in a shard artifact: $bad"; exit 1; fi
            cp -r "$in"/. gitgalaxy/
          fi
          # what `evidence.py refresh` did at its end on one runner: the pages are rendered from the records
          cd gitgalaxy && python tests/tools/evidence.py render

      - name: Take the det sweep shards' results (#4744)
        id: sweep_in
        if: needs.sweep.result == 'success' || needs.sweep.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: refresh-sweep-shard-*
          path: ${{ runner.temp }}/sweep-in
        continue-on-error: true  # no shard reported: the merge below names every case missing

      # The sweep applies the det_sweep_baseline ratchet, now over the MERGED shards (each shard ran --no-ratchet): a sweep
      # that proves fewer cases than the baseline expects, or lacks a case (a shard that died), exits 1, fails this job, and
      # the ledger is NOT rewritten from it. --skip-ledger-check: the ledger is rewritten from this very sweep next.
      - name: Merge the det sweep and apply its ratchet (#4270, #4744)
        id: ledger_sweep
        continue-on-error: true
        shell: bash  # -eo pipefail: the aggregate's exit status, not tee's
        run: |
          cd gitgalaxy
          shopt -s nullglob
          found=("$RUNNER_TEMP"/sweep-in/*/sweep.json)
          if [ "${#found[@]}" -eq 0 ]; then echo "no shard reported a sweep.json"; exit 1; fi
          python tests/tools/proof_sweep.py --aggregate "${found[@]}" --expect all --skip-ledger-check | tee "$RUNNER_TEMP/sweep.txt"

      - name: Rewrite the coverage ledger from the sweep (#4270)
        # Only from a sweep that passed the ratchet.
        if: steps.ledger_sweep.outcome == 'success'
        shell: bash
        env:
          DB2_SWEEP_OK: ${{ needs.db2.outputs.sweep_ok }}
        run: |
          cd gitgalaxy
          shopt -s nullglob
          sweeps=("$RUNNER_TEMP"/sweep-in/*/sweep.json)
          # #4733: the Db2 job's sweep too, when it ran and passed its ratchet; otherwise the Db2 entries stay as they were
          # (stale, not zero, once their inputs move: #4730)
          if [ "$DB2_SWEEP_OK" = "true" ] && [ -f "$RUNNER_TEMP/db2-in/sweep/sweep.json" ]; then
            sweeps+=("$RUNNER_TEMP/db2-in/sweep/sweep.json")
          fi
          python tests/tools/det_coverage_ledger.py update "${sweeps[@]}"

      - name: Rebuild the purchaser-facing evidence reports (#4601)
        if: always()
        run: |
          cd gitgalaxy
          # the records' status is recomputed now; the measured translation stays (it needs corpora this job lacks).
          # #4758: a Db2 case's det verdict comes from the coverage ledger rewritten above (an entry = the last sweep of
          # that case proved it): this run's Db2 sweep on a full run, the last nightly's on a push run (stale, not L1,
          # once its inputs move: #4730), so no sweep is passed here.
          python tests/tools/evidence_report.py --refresh --live

      - name: Summary
        if: always()
        run: |
          {
            echo "## Evidence refresh"
            echo "The proofs ran in the sweep and records jobs (their summaries have the per-case output)."
            echo '```'
            grep -v '^ *$' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | grep -E '^(det|model):|^sweep:' || echo "(no sweep output)"
            echo '```'
            echo '```'
            (cd gitgalaxy && python tests/tools/evidence.py status) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push lane - hold the PR back if a full run has started meanwhile (#4743)
        id: late_gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=$(gh api "repos/$REPO/actions/workflows/evidence-refresh.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .event != "push")] | length')
          if [ "$active" -gt 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A full refresh started while this one ran: no PR from the push lane (the full PR carries it)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the bot PR with the refreshed records
        id: cpr
        if: steps.late_gate.outputs.publish != 'false'
        uses: squid-protocol/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # forked from peter-evans/create-pull-request v8.1.1
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          path: gitgalaxy
          base: main  # never the checked-out ref of another run (#4640)
          commit-message: "evidence: refresh as of commit ${{ steps.asof.outputs.sha }}"
          title: "evidence: refresh stale records and the evidence report"
          draft: false  # auto-merge cannot be enabled on a draft
          body: |
            Refreshed as of commit ${{ steps.asof.outputs.sha }} (main at the time of the run).

            Automated re-proof of the evidence records (#4048) that a harness, oracle or generator change made stale.
            Each record's proof was run again on the committed port and case; the records and
            docs/language_status/evidence/ are rewritten from those runs. A proof that now fails is recorded as
            not proven. The evidence reports (docs/language_status/evidence_report/) are re-rendered from them (#4703).
            Approvals are never written by this job. Auto-merge (squash) is enabled when every proof succeeded.
          branch: auto/evidence-refresh${{ github.event_name != 'push' && '-full' || '' }}  # a lane's own branch (#4743)
          delete-branch: true
          add-paths: |
            tests/equivalence/det_sweep_coverage.json
            tests/equivalence/*/evidence.json
            tests/cics_crucible/ports/*/*/evidence.json
            docs/language_status/evidence/*.md
            docs/language_status/evidence_report/**

      - name: Enable squash auto-merge on the bot PR
        # Only after a clean run: a proof that failed is recorded as not proven and needs a person (#4048).
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed' && needs.records.result == 'success' && needs.sweep.result == 'success' && steps.ledger_sweep.outcome == 'success' && (needs.db2.result == 'success' || needs.db2.result == 'skipped')
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        # Right after the PR is opened its checks may not have registered yet, and GitHub then refuses auto-merge on a
        # "clean" PR ("Pull request is in clean status"). Retry until the checks exist; never merge before CI has run
        # (if it never gets there, the PR stays open for a person / the merge watcher).
        run: |
          for i in $(seq 1 20); do
            if out=$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            case "$out" in *"clean status"*) sleep 30 ;; *) exit 1 ;; esac
          done
          echo "::warning title=Evidence refresh::auto-merge could not be enabled (checks never registered); PR #$PR left open"

      - name: Fail when a re-proof failed
        if: needs.records.result != 'success' || needs.sweep.result != 'success' || steps.ledger_sweep.outcome == 'failure' || needs.db2.result == 'failure'
        run: |
          echo "::error title=Evidence refresh::a record's proof, the det sweep or the Db2 job failed or could not run -- see the summary"
          exit 1
