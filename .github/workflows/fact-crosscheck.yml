name: Fact Cross-check

# #4273: the engine (the scanner) and the det COBOL-to-Java translator each derive the same facts
# from the same COBOL -- paragraphs and extents, PERFORM / GO TO edges, CALL / LINK / XCTL, COPY
# members and the files they resolve to, data items (PIC / USAGE / OCCURS / REDEFINES / VALUE),
# record offsets, MOVEs, EXEC CICS commands. tests/tools/fact_crosscheck.py compares them program by
# program on every keyed mainframe corpus, every det-port case program and estate-crucible at its
# pin, and fails on a disagreement tests/cobol_mainframe/fact_crosscheck_ledger.json does not list
# (each listed one names the side that is wrong and its issue). A regression on EITHER side fails:
# an engine change that moves a fact the translator also reads, or a translator change that moves
# one the engine reads. It is a two-way ratchet: a ledgered disagreement that stops reproducing fails
# too, so a fix lowers the ledger (`fact_crosscheck.py update`) in the same PR. Ownership per channel:
# docs/language_status/fact_ownership.md.
#
# Unlike estate-crucible.yml this workflow does watch the translator (gitgalaxy/tools/cobol_to_java/**
# and its controller): it is half of what is compared. The translator needs the `translator` extra
# (tree-sitter-language-pack, #4430); without it the tool exits non-zero, it never skips.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
    paths:
      - "gitgalaxy/**"
      # #6278 slice 4: a standalone tool nothing here imports (test_engine_reach_workflows.py proves it from the import closure)
      - "!gitgalaxy/tools/terabyte_log_scanning/**"
      - "pyproject.toml"
      - "tests/tools/fact_crosscheck.py"
      - "tests/tools/referees/translator_adapter.py"
      - "tests/tools/referees/engine_adapter.py"
      - "tests/tools/referees/facts.py"
      - "tests/tools/referees/estate_key.py"
      - "tests/tools/cobol_answer_key.py"
      - "tests/tools/mainframe_corpus.py"
      - "tests/tools/estate_crucible.py"
      - "tests/_estate_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - "tests/cobol_mainframe/fact_crosscheck_ledger.json"
      - "tests/cobol_mainframe/corpora.json"
      - "tests/cobol_mainframe/answer_key/**"
      - "tests/equivalence/*/case.json"
      - ".github/workflows/fact-crosscheck.yml"
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
      - "!**/*.md"
  # #5131/#5136: no main push trigger. post-merge.yml dispatches this on main (at most once per cadence window, only
  # when PR runners are idle and main changed a file this workflow reads); the nightly run covers a busy day.
  schedule:
    - cron: "7 6 * * *"  # nightly (#5136)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # #4825: read-only, so a superseded main run is cancelled too (frees runners for PRs)

jobs:
  crosscheck:
    # #6670: not on a PR (it never failed on one in 7 days; pr_gates.py runs it before a push). The pull_request trigger
    # stays for its `paths`: post_merge_dispatch.py reads them as this workflow's relevance filter on main.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12  # install + 7 corpus scans + the crucible scan + ~10 s of comparison; a hang should fail fast
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
      ESTATE_CRUCIBLE_PATH: ${{ github.workspace }}/estate-crucible
      PYTHONUTF8: "1"
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone estate-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get estate)
          git init -q estate-crucible
          git -C estate-crucible remote add origin https://github.com/squid-protocol/estate-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C estate-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C estate-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C estate-crucible checkout -q --detach FETCH_HEAD
          echo "estate-crucible at $ref ($(git -C estate-crucible rev-parse HEAD))"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy with the translator extra
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/treesitter.txt
          pip install --no-build-isolation -e "./gitgalaxy[translator]"

      - name: Cache the pinned corpora
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          # Clones only; scans are keyed by engine state and pruned below.
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #5024: restore-only on pull requests. A PR's cache scope is its own ref, so a PR that saved here left
      # a copy per PR (a PR that edits corpora.json) that nothing else could read. Main saves it, once per key.
      - name: Save the pinned corpora (main)
        if: github.event_name != 'pull_request' && steps.corpora.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a miss only costs the next run a clone
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Cross-check engine and translator against the ledger
        run: |
          cd gitgalaxy
          # the runner context is not available in job-level env: the BMS cache path is set here
          REFEREES_CACHE="$RUNNER_TEMP/referees-cache" PYTHONPATH="$PWD" \
            python tests/tools/fact_crosscheck.py check --md "$RUNNER_TEMP/fact_crosscheck.md"

      - name: Publish the report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fact_crosscheck.md" ]; then cat "$RUNNER_TEMP/fact_crosscheck.md" >> "$GITHUB_STEP_SUMMARY"; fi
