name: Full Suite Gate (All OS x Python)

# Backup safety net for the full OS x Python-version matrix, now that
# smoke-test.yml only runs the full pytest suite once per push (see that
# file's comments for why). This workflow restores matrix coverage of the
# entire suite at three checkpoints instead of every push:
#   - Any label added to a pull request (an explicit "give this the full
#     validation pass" signal -- not filtered to a specific label name, so
#     applying ANY label triggers it).
#   - Any release tag push (`v*`), matching publish.yml's own release
#     trigger, as a pre-release confidence check across every supported
#     environment.
#   - A manual `workflow_dispatch` (#3209). The label trigger fires once, on
#     the SHA that carried the label, so a commit pushed afterwards never runs
#     the matrix -- #3207's Windows fix merged that way. Re-run it on a PR's
#     current head with:
#       gh workflow run "Full Suite Gate (All OS x Python)" --ref <branch>
#     Add `-f full_matrix=true` for the untrimmed grid. Keeping this
#     manual preserves the queue saving the label-only rule bought; triggering
#     on `synchronize` would hand it back.
#
# The matrix is sized per checkpoint (see the `matrix` job below). Measured
# 2026-09-09: the 12-way matrix's jobs RAN for 10-18 min but QUEUED for
# 23-65 min, because four label events on one PR put 48 jobs (16 of them
# macOS, the scarcest pool) into the queue for a single SHA. Deduplication
# is handled by `concurrency` below; this trims what one run costs.
#
# On a PR label: all three Python versions still run, on ubuntu; windows and
# macOS cover the version floor and ceiling only. That keeps the thing the
# matrix exists to catch -- a version-specific syntax/stdlib break that the
# every-push ubuntu/3.12 full-suite cannot see -- while cutting macOS from
# three jobs to two.
# On a `v*` tag, a push to main or the nightly run: the untrimmed matrix.
# On a manual run: the trimmed grid, or the untrimmed one with
# `-f full_matrix=true`.
on:
  # #4518: no longer a pull_request trigger. `gh pr create --label` fired the
  # 7-leg matrix on EVERY PR (labels are always attached), which on a 2-3
  # runner pool starved the whole PR queue. PRs keep the lean smoke set and the
  # ubuntu full-suite in smoke-test.yml; this grid runs nightly, on release
  # tags and on demand.
  # #4825: no main push trigger any more. Post-merge runs of this grid are dispatched by post-merge.yml
  # when no PR job is queued. Release tags still run it here.
  push:
    tags:
      - "v*"
  schedule:
    - cron: "43 4 * * *"  # nightly
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the untrimmed grid instead of the trimmed PR grid"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). A PR that gets four
  # labels in one `gh pr create` fired four IDENTICAL matrix runs on the same
  # SHA; the group now lets only one of them run at a time.
  #
  # cancel-in-progress is deliberately false, even for pull_request (#3343).
  # Every other PR workflow cancels superseded runs, but here the "superseded"
  # run is not stale: a label burst is several identical runs on one SHA, and
  # cancelling the in-flight one after its jobs were created left its
  # `full-suite-matrix` check permanently red on the PR (#3334), even though the
  # replacement passed. With it off, the in-flight run finishes and GitHub keeps
  # at most ONE pending run behind it, replacing any older pending run before its
  # jobs start. A burst of N labels costs at most two matrix runs, and nothing is
  # killed mid-flight.
  # A `workflow_dispatch` groups by its ref, so a manual re-run never waits on
  # the label run of a PR that happens to be on that branch, and vice versa.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # #5919, #5156: the legs (parts, `even`, timeout, step_timeout) come from the measured durations
  # (suite_shard_plan.py --gate over the committed .test_durations), not from YAML: the suite grows every day. Every
  # trigger runs the same grid (since 3.10 was dropped, #3322, the trimmed and untrimmed grids were equal), so
  # `full_matrix=true` only keeps the ubuntu / 3.12 leg on a main dispatch. The queue depth is read on a pull request or manual run only (empty = calm).
  # A plan that fails (no durations) fails this job, so no leg starts.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the queued PR jobs (ci_layout.py --print-waiting)
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Check out the planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/tools/suite_shard_plan.py
            tests/tools/ci_shard_plan.py
            tests/tools/ci_layout.py
            tests/tools/post_merge_dispatch.py
            .test_durations
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan the legs for this trigger
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
        run: |
          waiting=""
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "schedule" ]; then waiting=$(python3 tests/tools/ci_layout.py --print-waiting || true); fi
          python3 tests/tools/suite_shard_plan.py --gate ${waiting:+--waiting "$waiting"} | tee plan.out
          include=$(sed -n 's/^matrix=//p' plan.out)
          # #5953: smoke-test.yml runs the same suite on ubuntu / 3.12 nightly and on every main push (the gate leg only adds
          # test_evidence_components, run by mainframe-ground-truth.yml): the nightly and post-merge (main) dispatch drop that leg
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$FULL_MATRIX" != "true" ]; }; then
            include=$(echo "$include" | jq -c 'map(select(.os != "ubuntu-latest" or .["python-version"] != "3.12"))')
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  full-suite-matrix:
    needs: matrix
    runs-on: ${{ matrix.os }}
    # #5919: the leg count and its timeout come from the plan job (measured durations x a per-OS slowdown), not from YAML.
    # The `|| 30` is only the fallback for a leg that carries no timeout.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    env:
      PYTHONUTF8: "1"
      GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
      OMP_NUM_THREADS: "1"
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
      # #4703: advisory for PRs / manual runs; a release tag keeps the current-report test blocking
      EVIDENCE_REPORT_ADVISORY: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      - name: Install macOS dependencies (OpenMP for XGBoost)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: tests/tools/ci_retry.sh 3 10 -- brew install libomp

      - name: Install dependencies
        shell: bash
        timeout-minutes: 10
        run: |
          tests/tools/ci_retry.sh 4 10 -- python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          tests/tools/ci_retry.sh 4 10 -- pip install --require-hashes -r ci/requirements/test.txt
          # the COBOL translator's parser: without it every det-translator test importorskips and the
          # suite passes without running them (a stale emitter expectation reached main that way)
          tests/tools/ci_retry.sh 4 10 -- pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --no-build-isolation -e .

      - name: Cache tree-sitter language pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tree-sitter-language-pack
            ~/Library/Caches/tree-sitter-language-pack
            ~\AppData\Local\tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('ci/requirements/treesitter.txt') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      # Sharding (pytest-split over the committed .test_durations, like smoke-test.yml's full-suite parts, #4836): a leg
      # with a part and a splits count runs one duration-balanced group. The plan job sizes each leg (#5919). The Python 3.10 legs are gone (#3322).
      - name: Full Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
        shell: bash
        # #5764: a stall outside any test (--timeout never fires) failed as a job-level "cancelled" with its log lost; a step
        # timeout ends the step by name, log kept, before the job cap (step_timeout = leg timeout - 3; expressions have no arithmetic)
        timeout-minutes: ${{ matrix.step_timeout }}
        env:
          PART: ${{ matrix.part }}
          SPLITS: ${{ matrix.splits }}
          EVEN: ${{ matrix.even }}
          GITGALAXY_TEST_TIMES: ${{ runner.temp }}/times-gate-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.part }}.json  # #5257: tests/conftest.py writes each test's seconds
        run: |
          split=()
          if [ -n "$PART" ]; then split=(--splits "$SPLITS" --group "$PART"); fi
          # "even": ignore the committed .test_durations (measured on Linux; on windows they put the slow tests in one
          # part: 9 min vs a 30-min timeout, #4906). With no durations every test weighs the same and least_duration
          # deals them out round-robin, so the slow ones spread evenly across the parts.
          if [ -n "$EVEN" ]; then split+=(--splitting-algorithm least_duration --durations-path /nonexistent-durations.json); fi
          # --timeout: a hung test fails by name after 10 min (the slowest real test is ~60 s) instead of eating the
          # job's time limit as a "cancelled" leg (#4840: the macOS box-tools hang, #4862)
          pytest tests/ -n auto -q -ra --durations=25 --timeout=600 "${split[@]}"

      # #5257 (sibling of #5166): the per-test time gate, on the Linux legs only. The baseline's seconds are Linux CI times, so
      # Windows and macOS (slower, different) cannot be held to them.
      - name: Per-test time ratchet (#5257)
        if: runner.os == 'Linux'
        run: python tests/tools/time_ratchet.py check --times "$RUNNER_TEMP/times-gate-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.part }}.json"

      # the name stays out of smoke-test's test-times-part-* glob, which the nightly suite budget merges
      - name: Upload this leg's test times (#5257)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-gate-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.part }}
          path: ${{ runner.temp }}/times-gate-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.part }}.json
          retention-days: 7
