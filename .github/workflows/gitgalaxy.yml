name: GitGalaxy Zero-Trust Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
  # The post-gate (SARIF / SBOM / LLM brief) used to run on every push to main.
  # With the docs-auto-update bots merging ~40x/day (see the LLM-brief loop
  # below), that meant ~40 full-precision galaxyscope runs/day here AND ~40
  # runs/day on the mirrored azure-pipelines.yml / bitbucket-pipelines.yml,
  # which instantly exhausts their free hosted-CI minute grants. The brief is
  # an orientation doc and the SARIF feed is a dashboard -- neither needs to be
  # fresher than daily. So the post-gate now runs on a schedule instead.
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  # Manual re-fire for the post-gate without waiting for the schedule -- also
  # the recovery lever from 2026-08-06, when push-to-main events silently
  # stopped creating runs for ~4.5h (suspected Actions run-creation throttling
  # from this repo's push volume, the same volume this schedule change cuts).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # PRE-GATE — runs on every PR, blocks the merge on failure.
  # Fast; no heavy ML/graph dependencies installed.
  # ============================================================
  # #5132: the three pre-gates were three runners (0.6-2.4 min each, mostly setup); one job runs them in order. Each
  # step fails the job on its own (no continue-on-error), and `if: !cancelled()` makes a later step run after an earlier
  # failure so one push reports every failing gate. None is a required check.
  pre-gate:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'pull_request') }}  # #5104: draft PRs skip heavy CI
    name: Pre-gate (Vault Sentinel, X-Ray, Supply Chain)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #6278: no workflow-level `paths-ignore: docs/**` (it also skipped the tests that read docs); this step skips the
      # three gates when the PR changes only docs / agent config that hold no code or manifest (tests/tools/audit_skip_plan.py).
      # The job still starts and reports; the planner fails open (mode=full).
      - name: Plan the gates
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' || echo "shepherd:full")
          mapfile -t files < <(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' || true)
          count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files || echo 0)
          args=(--profile gate --event pull_request --labels "$labels" --github-output "$GITHUB_OUTPUT" --files)
          if [ "${#files[@]}" -ge "$count" ]; then args+=("${files[@]}"); fi
          python3 tests/tools/audit_skip_plan.py "${args[@]}" || echo "mode=full" >> "$GITHUB_OUTPUT"

      - name: Vault Sentinel
        if: ${{ steps.plan.outputs.mode != 'none' }}
        uses: ./
        with:
          tool: vault-sentinel
          target: .
          version: local

      - name: X-Ray Inspector
        if: ${{ !cancelled() && steps.plan.outputs.mode != 'none' }}
        uses: ./
        with:
          tool: xray-inspector
          target: .
          version: local

      - name: Supply Chain Firewall
        if: ${{ !cancelled() && steps.plan.outputs.mode != 'none' }}
        uses: ./
        with:
          tool: supply-chain-firewall
          target: .
          version: local

  # ============================================================
  # POST-GATE — one galaxyscope pass produces all 6 outputs; we route 3 of
  # them (SARIF -> Security tab, SBOM + self-scan DB -> artifacts, LLM brief
  # -> the generated branch) and let the rest live only in the ephemeral runner.
  # --fail-on-malware stays on here too, as a safety net in case branch
  # protection is ever bypassed.
  #
  # Runs on a daily schedule (or manual dispatch), NOT per-push: the LLM brief
  # embeds a Timestamp/Scan Duration/Git Commit (llm_recorder.py) so it always
  # produced a diff, whose PR auto-merged, and that merge was itself a push --
  # a per-push trigger made this a treadmill (~21 brief commits/day; a
  # confirmed 13-commits-in-13-minutes runaway on 2026-07-25) that also
  # exhausted the mirrored Azure/Bitbucket free CI minutes. A daily brief is
  # plenty for an orientation doc, and a daily SARIF refresh is plenty for a
  # dashboard. The real per-PR malware gate is the PRE-GATE jobs above.
  # ============================================================
  full-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full Report (SARIF, SBOM, LLM Brief)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # push to the `generated` branch only
      security-events: write
    steps:
      - name: Checkout Repository          # unchanged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python                 # unchanged
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      - name: Install GitGalaxy & Full Precision Engines
        run: |
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r templates/requirements/full.txt

      - name: Run GalaxyScope (single pass — all 6 outputs)   # unchanged
        env:
          GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
        run: |
          galaxyscope . --config .galaxyscope.yaml --fail-on-malware --output gitgalaxy-results.json

      # #935: GitHub's tool-status page shows per-language scan coverage only
      # for integrated tools like CodeQL, and SARIF has no field to fill it.
      # Put the equivalent (per-language table, top files, security status) on
      # the run page instead, from the audit JSON the scan above already wrote.
      # Stdlib-only script, so it runs beside the PyPI-installed gitgalaxy.
      - name: Write Job Summary
        if: always() && hashFiles('gitgalaxy-results_audit.json') != ''
        run: python tests/tools/ci_job_summary.py gitgalaxy-results_audit.json --sbom gitgalaxy-results_sbom.json

      - name: Upload SARIF to GitHub Security Tab   # unchanged
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: gitgalaxy-results_sarif.json

      - name: Upload SBOM as Build Artifact   # unchanged
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitgalaxy-sbom
          path: gitgalaxy-results_sbom.json

      # The self-scan DB (tests/tools/self_scan.py) is gitignored on purpose --
      # it's a cheap-to-regenerate (~6-8s), disposable structural index, same
      # spirit as .crucible_venvs/ -- so unlike the LLM brief below, it's never
      # committed to git history. Publishing it as a build artifact instead
      # gives anyone (a fresh worktree, a coding-agent session without a local
      # `pip install -e .`) a guaranteed-fresh copy without a repo-history cost.
      - name: Regenerate Self-Scan DB
        run: python tests/tools/self_scan.py

      - name: Upload Self-Scan DB as Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitgalaxy-self-scan-db
          path: docs/self_scan/gitgalaxy_master.db

      # --- everything below here REPLACES the old "Commit LLM Brief to Docs" step ---
      - name: Prepare LLM Brief
        run: |
          mkdir -p docs
          mv *_galaxy_llm.md docs/gitgalaxy_architecture_brief.md

      # #4963: published to the `generated` branch (tests/tools/generated_branch.py), not committed to main through an
      # auto-merged PR. The brief carries no per-scan field, so a scan of an unchanged architecture commits nothing.
      # Agents read it with `python tests/tools/generated_branch.py show docs/gitgalaxy_architecture_brief.md`.
      - name: Publish the LLM Brief to the generated branch
        if: github.ref == 'refs/heads/main'
        run: |
          python tests/tools/generated_branch.py publish --stamp architecture-brief \
            --message "architecture brief as of main $GITHUB_SHA" \
            docs/gitgalaxy_architecture_brief.md
