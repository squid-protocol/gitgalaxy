name: Golden Crucible Resilience Test

on:
  pull_request:
    branches:
      - main
      - v6-dev
    paths-ignore: ["docs/**"]

jobs:
  crucible-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [full-precision, zero-dependency]

    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GitGalaxy Environment
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip setuptools wheel
          # PyYAML is installed in BOTH legs -- since #1104 it's an optional
          # `gitgalaxy[yaml]` extra, not a core dependency, so `pip install -e .`
          # no longer pulls it in for either leg. "Zero-Dependency Mode" here has
          # only ever meant networkx/tiktoken/pandas/xgboost are absent; the
          # golden-master zero-dep fixture (tests/golden_master_zero_dep_audit.json)
          # expects PyYAML present even on this leg.
          if [ "${{ matrix.mode }}" = "full-precision" ]; then
            echo "Installing heavy engines for Full-Precision Mode..."
            pip install PyYAML networkx tiktoken pandas xgboost
          else
            echo "Deliberately skipping networkx/tiktoken/pandas/xgboost -- Zero-Dependency Mode leg."
            pip install PyYAML
          fi
          pip install -e .
          pip install pytest

      - name: Fetch Golden Test Repo (Language Crucible)
        run: |
          echo "Cloning Language Crucible repository (pinned to v1.0)..."
          git clone --branch v1.0 --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Run Golden Crucible Test (${{ matrix.mode }})
        run: |
          cd gitgalaxy
          # tests/test_golden_crucible.py detects zero-dependency mode itself
          # from whichever engines this leg installed above, and picks the
          # matching golden master fixture automatically.
          pytest -m golden_crucible tests/test_golden_crucible.py -v

      - name: Debug File System (Tree)
        if: always()  # This ensures the tree prints even if the previous step fails
        run: tree -L 2
