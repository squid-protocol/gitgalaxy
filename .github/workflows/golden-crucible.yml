name: Golden Crucible Resilience Test

on:
  pull_request:
    branches:
      - main
      - v6-dev
    paths-ignore: ["docs/**"]

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crucible-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [full-precision, zero-dependency]

    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GitGalaxy Environment
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip setuptools wheel
          # PyYAML is installed in BOTH legs -- since #1104 it's an optional
          # `gitgalaxy[yaml]` extra, not a core dependency, so `pip install -e .`
          # no longer pulls it in for either leg. "Zero-Dependency Mode" here has
          # only ever meant tiktoken/pandas/xgboost are absent (networkx is not used
          # at all since #3041); the
          # golden-master zero-dep fixture (tests/golden_master_zero_dep_audit/)
          # expects PyYAML present even on this leg.
          if [ "${{ matrix.mode }}" = "full-precision" ]; then
            echo "Installing heavy engines for Full-Precision Mode..."
            pip install PyYAML tiktoken "pandas>=2.0.0" xgboost
          else
            echo "Deliberately skipping tiktoken/pandas/xgboost -- Zero-Dependency Mode leg."
            pip install PyYAML
          fi
          pip install -e .
          pip install pytest

      - name: Fetch Golden Test Repo (Language Crucible)
        run: |
          echo "Cloning Language Crucible repository (pinned in tests/crucible_pins.toml)..."
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          git clone --branch "$ref" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Check the LANGUAGE_CRUCIBLE_REF repository variable against the manifest
        # No workflow reads the variable any more (tests/crucible_pins.toml is the only source); this
        # only warns when a leftover variable disagrees. Add --strict to make a mismatch fail.
        run: python3 gitgalaxy/tests/tools/crucible_pins.py check-var "${{ vars.LANGUAGE_CRUCIBLE_REF }}"

      - name: Run Golden Crucible Test (${{ matrix.mode }})
        run: |
          cd gitgalaxy
          # tests/test_golden_crucible.py detects zero-dependency mode itself
          # from whichever engines this leg installed above, and picks the
          # matching golden master fixture automatically.
          pytest -m golden_crucible tests/test_golden_crucible.py -v

      - name: Debug File System (Tree)
        if: always()  # This ensures the tree prints even if the previous step fails
        run: tree -L 2
