name: Graph Accuracy Audit

# The dependency and call graphs' own accuracy, gated per PR against committed
# baselines. Each step appends its table to the job summary, so every PR that
# touches parsing or resolution shows the numbers:
#   - import graph: the engine's file->file import edges vs each language's own
#     import statements (python `ast`, tree-sitter elsewhere), on the pinned real
#     repos in tests/import_graph_corpus.json (tests/tools/import_graph_accuracy.py);
#   - call resolution, Level 2: confident caller->callee links vs pyan3 on
#     language-crucible's Python repos, and vs the TypeScript compiler's own
#     type checker on the pinned typescript repo(s) of import_graph_corpus.json
#     (tests/tools/call_graph_resolution.py + ts_callgraph.js);
#   - span anchoring: functions whose start_line opens on other code before the
#     declaration, lower is better (#3543, tests/tools/span_anchor_audit.py).
# Level 1 (callee names vs tree-sitter) stays in call-graph-accuracy-audit.yml.
# Every step runs even when an earlier one fails, so a red PR still reports all
# of them. Same corpus pin and fork fallback as call-graph-accuracy-audit.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/core/network_risk_sensor.py"
      - "gitgalaxy/core/call_resolver.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/import_graph_accuracy.py"
      - "tests/tools/call_graph_resolution.py"
      - "tests/tools/ts_callgraph.js"
      - "tests/tools/span_anchor_audit.py"
      - "tests/import_graph_corpus.json"
      - "tests/import_graph_accuracy_baseline.json"
      - "tests/call_graph_resolution_baseline.json"
      - "tests/call_graph_resolution_typescript_baseline.json"
      - "tests/span_anchor_baseline.json"
      - ".github/workflows/graph-accuracy-audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph-accuracy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy + tree-sitter-language-pack + pyan3
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip
          pip install -e .
          pip install tree-sitter-language-pack "pyan3==2.8.1"

      # The runner's preinstalled node is enough; the version is pinned so the
      # typescript baseline stays comparable (call_graph_resolution.TYPESCRIPT_VERSION).
      - name: Install the TypeScript checker (call-resolution reference)
        run: npm install --global "typescript@6.0.2"

      - name: Fetch Language Crucible corpus (pinned via LANGUAGE_CRUCIBLE_REF)
        run: |
          ref="${{ vars.LANGUAGE_CRUCIBLE_REF }}"
          if [ -z "$ref" ]; then
            ref=$(sed -n 's/^PINNED_TAG = "\(.*\)"/\1/p' gitgalaxy/tests/_crucible_pin.py)
          fi
          if [ -z "$ref" ]; then
            echo "::error title=Corpus pin unavailable::No LANGUAGE_CRUCIBLE_REF and no PINNED_TAG in tests/_crucible_pin.py."
            exit 1
          fi
          git clone --branch "$ref" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Fetch the pinned import-graph repos
        env:
          IMPORT_GRAPH_CORPUS_PATH: ${{ github.workspace }}/import-graph-corpus
        run: |
          cd gitgalaxy
          python tests/tools/import_graph_accuracy.py --fetch-only

      - name: Gate import-graph precision/recall against the baseline
        if: ${{ !cancelled() }}
        env:
          IMPORT_GRAPH_CORPUS_PATH: ${{ github.workspace }}/import-graph-corpus
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/import_graph_accuracy.py --ci --samples 5 --summary "$GITHUB_STEP_SUMMARY"

      - name: Gate call-resolution (Level 2, vs pyan3) against the baseline
        if: ${{ !cancelled() }}
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/call_graph_resolution.py python --ci --samples 5 --summary "$GITHUB_STEP_SUMMARY"

      - name: Gate call-resolution (Level 2, vs the TypeScript checker) against the baseline
        if: ${{ !cancelled() }}
        env:
          IMPORT_GRAPH_CORPUS_PATH: ${{ github.workspace }}/import-graph-corpus
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/call_graph_resolution.py typescript --ci --samples 5 --summary "$GITHUB_STEP_SUMMARY"

      - name: Gate span anchoring against the baseline
        if: ${{ !cancelled() }}
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/span_anchor_audit.py --ci --samples 3 --summary "$GITHUB_STEP_SUMMARY"
