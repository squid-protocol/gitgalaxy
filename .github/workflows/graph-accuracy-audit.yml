name: Graph Accuracy Audit

# The dependency and call graphs' own accuracy, gated per PR against committed
# baselines. Each step appends its table to the job summary, so every PR that
# touches parsing or resolution shows the numbers:
#   - import graph: the engine's file->file import edges vs each language's own
#     import statements (python `ast`, tree-sitter elsewhere), on the pinned real
#     repos in tests/import_graph_corpus.json (tests/tools/import_graph_accuracy.py);
#   - call resolution, Level 2: confident caller->callee links vs pyan3 on
#     language-crucible's Python repos, and vs the TypeScript compiler's own
#     type checker on the pinned typescript repo(s) of import_graph_corpus.json
#     (tests/tools/call_graph_resolution.py + ts_callgraph.js), on express's JavaScript
#     through the same checker with allowJs (#3781), and vs scip-java
#     (javac-resolved, through the shared SCIP adapter tests/tools/scip_callgraph.py,
#     #3783) on the pinned java repo, vs libclang (tests/tools/clang_callgraph.py, #3784)
#     on the pinned c repos (the pip `libclang` wheel comes with callgraph.txt) and the pinned
#     c++ repo (same adapter, `cpp` mode; the host g++ supplies the C++ system headers), and vs
#     rust-analyzer 1.90.0 (SCIP, same adapter, #3785) on the pinned serde-rs/json, and vs
#     golang.org/x/tools 0.37.0's VTA call graph (tests/tools/go_callgraph, Go 1.24+, #3782) on the
#     pinned spf13/cobra;
#   - span anchoring: functions whose start_line opens on other code before the
#     declaration, lower is better (#3543, tests/tools/span_anchor_audit.py).
# Level 1 (callee names vs tree-sitter) stays in call-graph-accuracy-audit.yml.
# #5501: ONE job (the old check name, `graph-accuracy-audit`) installs everything once and runs
# the gates in four parallel lanes (span anchoring as two shards, #6355) on that runner. The split into five
# jobs (#5562) cut the serial
# 9.3 min to ~3 min of execution but measured 6.5 / 8.8 / 13.3 min wall: five runner requests plus an
# aggregate job each waited in the queue (up to 8 min), while setup was only ~30 s per job. One runner
# request has one queue wait. Same baselines, same --samples. Same corpus pin and fork fallback as
# call-graph-accuracy-audit.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/core/network_risk_sensor.py"
      - "gitgalaxy/core/call_resolver.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/import_graph_accuracy.py"
      - "tests/tools/call_graph_resolution.py"
      - "tests/tools/callgraph_refs.py"
      - "tests/tools/ts_callgraph.js"
      - "tests/tools/scip_callgraph.py"
      - "tests/tools/clang_callgraph.py"
      - "tests/tools/go_callgraph/**"
      - "tests/tools/span_anchor_audit.py"
      - "tests/import_graph_corpus.json"
      - "tests/import_graph_accuracy_baseline.json"
      - "tests/call_graph_resolution_baseline.json"
      - "tests/call_graph_resolution_typescript_baseline.json"
      - "tests/call_graph_resolution_javascript_baseline.json"
      - "tests/call_graph_resolution_java_baseline.json"
      - "tests/call_graph_resolution_rust_baseline.json"
      - "tests/call_graph_resolution_go_baseline.json"
      - "tests/call_graph_resolution_c_baseline.json"
      - "tests/call_graph_resolution_cpp_baseline.json"
      - "tests/span_anchor_baseline.json"
      - ".github/workflows/graph-accuracy-audit.yml"
      - "tests/crucible_pins.toml"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph-accuracy-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      IMPORT_GRAPH_CORPUS_PATH: ${{ github.workspace }}/import-graph-corpus
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy + tree-sitter-language-pack + pyan3 + libclang
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --require-hashes -r ci/requirements/callgraph.txt

      # The runner's preinstalled node is enough; the version is pinned so the
      # typescript baseline stays comparable (call_graph_resolution.TYPESCRIPT_VERSION).
      # #5048: bounded retry, INFRASTRUCTURE marker (the comment sits above the command: a trailing one is read as packages)
      - name: Install the TypeScript checker (call-resolution reference)
        run: gitgalaxy/tests/tools/ci_retry.sh 4 10 -- npm install --global "typescript@6.0.2"

      # scip-java (the java reference) runs javac with its semanticdb plugin; gson's build
      # wants JDK 17-25. The scip-java jars and the corpus's Maven dependencies are
      # cached: Maven Central rate-limits bursts (scip_callgraph.MAVEN_FLAGS retries 429s).
      - name: Setup JDK 21 (scip-java reference)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache scip-java and Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/gitgalaxy/scip-java-*
            ~/.m2/repository
          key: scip-java-${{ hashFiles('gitgalaxy/tests/tools/scip_callgraph.py', 'gitgalaxy/tests/import_graph_corpus.json') }}
          restore-keys: scip-java-

      # rust-analyzer (the rust reference) comes with the pinned toolchain; its version is the
      # baseline's (scip_callgraph.RUST_ANALYZER_VERSION). Dependencies are fetched by cargo metadata.
      - name: Install the Rust toolchain 1.90.0 with rust-analyzer (call-resolution reference)
        run: |
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- rustup toolchain install 1.90.0 --profile minimal --component rust-analyzer
          rustup default 1.90.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('gitgalaxy/tests/import_graph_corpus.json') }}
          restore-keys: cargo-registry-

      # golang.org/x/tools (the go reference) is built by `go run -C tests/tools/go_callgraph`, which
      # wants Go 1.24+ (its go.mod); the module cache is keyed by the helper's go.sum.
      - name: Setup Go 1.24 (call-resolution reference)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: gitgalaxy/tests/tools/go_callgraph/go.sum

      # The two corpora are fetched in parallel, once for every gate that reads them.
      - name: Fetch the pinned import-graph repos and the Language Crucible corpus
        run: |
          # The crucible pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          (cd gitgalaxy && python tests/tools/import_graph_accuracy.py --fetch-only) &
          import_pid=$!
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"
          wait "$import_pid"

      # Four lanes balance the measured gate times (#5501): span anchoring is the longest gate, so it runs as
      # two --shard scans whose merge is the one baseline gate (a shard is a partial measurement and refuses
      # --ci). Each gate keeps its own baseline, --samples and exit code; its table goes to a per-gate file
      # and is appended to the job summary afterwards so concurrent writers cannot interleave.
      - name: Gate every graph-accuracy baseline (four parallel lanes)
        run: |
          cd gitgalaxy
          mkdir -p "$RUNNER_TEMP/gaa"
          run_gate() {  # run_gate <name> <command...>: log per gate, one "FAIL name" line on failure
            name=$1; shift
            start=$SECONDS
            ( echo "::group::$name"; PYTHONPATH="$PWD" "$@"; rc=$?; echo "::endgroup::"; exit $rc ) \
              > "$RUNNER_TEMP/gaa/$name.log" 2>&1 \
              || echo "FAIL $name" >> "$RUNNER_TEMP/gaa/failed"
            echo "$name: $((SECONDS - start)) s" >> "$RUNNER_TEMP/gaa/times"
          }
          gate() {  # gate <name> <command...>: run_gate with the baseline gate and summary file
            name=$1; shift
            run_gate "$name" "$@" --ci --summary "$RUNNER_TEMP/gaa/$name.md"
          }
          ( run_gate span-shard-0 python tests/tools/span_anchor_audit.py --shard 0/2 --json "$RUNNER_TEMP/gaa/span0.json" --samples 3 ) &
          ( run_gate span-shard-1 python tests/tools/span_anchor_audit.py --shard 1/2 --json "$RUNNER_TEMP/gaa/span1.json" --samples 3 ) &
          ( gate import-graph python tests/tools/import_graph_accuracy.py --samples 5
            gate call-typescript python tests/tools/call_graph_resolution.py typescript --samples 5
            gate call-javascript python tests/tools/call_graph_resolution.py javascript --samples 5
            gate call-c python tests/tools/call_graph_resolution.py c --samples 5 ) &
          ( gate call-java python tests/tools/call_graph_resolution.py java --samples 5
            gate call-python python tests/tools/call_graph_resolution.py python --samples 5
            gate call-cpp python tests/tools/call_graph_resolution.py cpp --samples 5
            gate call-rust python tests/tools/call_graph_resolution.py rust --samples 5
            gate call-go python tests/tools/call_graph_resolution.py go --samples 5 ) &
          wait
          # the one span-anchoring baseline gate, over the summed shards (skipped if a shard failed)
          if [ -s "$RUNNER_TEMP/gaa/span0.json" ] && [ -s "$RUNNER_TEMP/gaa/span1.json" ]; then
            gate span-anchoring python tests/tools/span_anchor_audit.py --merge "$RUNNER_TEMP/gaa/span0.json" "$RUNNER_TEMP/gaa/span1.json" --samples 3
          fi
          cat "$RUNNER_TEMP/gaa/times"
          for n in span-shard-0 span-shard-1 import-graph call-typescript call-javascript call-c call-java call-python call-cpp call-rust call-go span-anchoring; do
            cat "$RUNNER_TEMP/gaa/$n.log" 2>/dev/null || true
          done
          for n in import-graph call-typescript call-javascript call-c call-java call-python call-cpp call-rust call-go span-anchoring; do
            cat "$RUNNER_TEMP/gaa/$n.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          done
          if [ -s "$RUNNER_TEMP/gaa/failed" ]; then
            cat "$RUNNER_TEMP/gaa/failed"
            exit 1
          fi
