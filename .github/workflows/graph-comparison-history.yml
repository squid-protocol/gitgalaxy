name: Graph Comparison History

# Push-to-main companion to call-graph-accuracy-audit.yml's PR-time gate -- the same split
# tri-comparison-audit.yml / tri-comparison-history.yml use for the structural ledger (#3641,
# docs/self_scan/graph_comparison_README.md). The PR gate keeps judging the RAW numbers against
# tests/call_graph_accuracy_baseline.json; this workflow never touches that baseline.
#
# What it DOES do, once a change that can move a call lands on main: re-run
# `call_graph_accuracy.py --ledger`, which refreshes docs/self_scan/graph_comparison_ledger.json --
# last_seen_count / last_seen_examples / still_reproduces on existing shapes, and a new
# `unvalidated` entry for any newly-observed shape. A validated entry's status / verdict /
# credit_tools are never touched (tri_comparison_ledger.py's ENTRY LIFECYCLE). So PRs only ever
# add verdicts; this bot commits the count churn. "No diff" is the adaptivity: a push that moved
# nothing opens no PR.

# #4847: the output is published to the `generated` branch (tests/tools/generated_branch.py), not committed to main through
# an auto-merged PR; the PR-then-merge and loop-guard paragraphs above describe the old mechanism.

on:
  push:
    branches: [main]
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/core/network_risk_sensor.py"
      - "gitgalaxy/galaxyscope.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/call_graph_accuracy.py"
      - "tests/tools/import_graph_accuracy.py"
      - "tests/tools/graph_ledger.py"
      - "tests/tools/tri_comparison_ledger.py"
      - "tests/call_graph_accuracy_baseline.json"
      - "tests/import_graph_accuracy_baseline.json"
      - "tests/import_graph_corpus.json"
      - "tests/call_graph_resolution*_baseline.json"
      - "tests/tools/graph_coverage_chart.py"
  workflow_dispatch:  # also how the first publish seeds `generated`

permissions:
  contents: read

concurrency:
  # Scoped like its siblings: never cancel a push run mid-write.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: can the diff since the last successful run move this? (accuracy_audit_plan.py; an unknown base runs it)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # gh run list: the last successful run's commit
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the last planned commit
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-comparison-history.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          python3 tests/tools/accuracy_audit_plan.py --audit graph-comparison-history --event "$GITHUB_EVENT_NAME" --base "${base:-HEAD}" \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-history plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  graph-comparison-history:
    needs: [plan]
    if: ${{ always() }}  # a failed plan runs it
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout GitGalaxy
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          fetch-depth: 0
          # #4847: the publish step pushes to `generated` with this checkout's token. The job runs main's code on a
          # push to main / dispatch only, never PR code (the same reasoning as evidence-pages.yml).
          persist-credentials: true

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      # The same install as call-graph-accuracy-audit.yml, so the ledger records exactly the
      # numbers the PR gate measures.
      - name: Install GitGalaxy + tree-sitter-language-pack
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Refresh the graph comparison ledger (calls)
        if: needs.plan.outputs.run != 'false'
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
        run: |
          cd gitgalaxy
          PYTHONPATH="$PWD" python tests/tools/call_graph_accuracy.py --ledger

      # Same pinned repos as graph-accuracy-audit.yml. Each tool refreshes only its own
      # symbol type's shapes (graph_ledger.merge), so the two steps never stale each other.
      - name: Refresh the graph comparison ledger (imports)
        if: needs.plan.outputs.run != 'false'
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
          IMPORT_GRAPH_CORPUS_PATH: ${{ github.workspace }}/import-graph-corpus
        run: |
          cd gitgalaxy
          python tests/tools/import_graph_accuracy.py --fetch --ledger

      # The coverage chart is a pure function of the baselines and the ledger just refreshed
      # (#3796); the history only gains a snapshot when a number or n moved.
      # The series is appended to, so it starts from what `generated` last published (the copy committed on main is
      # only the seed and the fallback when the branch has none yet).
      - name: Restore the published series from the generated branch
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/generated_branch.py fetch \
            docs/self_scan/graph_coverage_history.csv

      - name: Regenerate the graph coverage chart and history
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/graph_coverage_chart.py --write --history docs/self_scan/graph_coverage_history.csv \
            --summary "$GITHUB_STEP_SUMMARY"

      # #4847: output goes to the `generated` branch, never to main (no PR, no auto-merge: main no longer takes a bot
      # commit per run). Only main may write it; a dispatch from another ref publishes nothing.
      - name: Publish to the generated branch
        if: needs.plan.outputs.run != 'false' && github.ref == 'refs/heads/main'
        run: |
          cd gitgalaxy
          python tests/tools/generated_branch.py publish --stamp graph-comparison-history \
            --message "graph-comparison-history as of main $GITHUB_SHA" \
            docs/self_scan/graph_comparison_ledger.json \
            docs/self_scan/graph_coverage_chart.svg \
            docs/self_scan/graph_coverage_history.csv
