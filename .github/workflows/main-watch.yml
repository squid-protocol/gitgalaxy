name: Main Watch

# #4825: a check that fails on main -- the nightly full det sweep, the push-time suites, the security scans -- used
# to fail silently: the CI shepherd only watches pull requests. This makes it visible. When a watched workflow's run on
# main (push or schedule) FAILS, open one issue per workflow labelled `ci-red-main` (or comment on the open one);
# when the same workflow next SUCCEEDS on main, comment and close it.
#
# The nightly det sweep is the honesty check for the PR shortcuts (#4814: a translator PR proves only the ports it
# changes): a case a PR carried forward but actually broke fails here the same night.
#
# #4859: a run created with the repo GITHUB_TOKEN (post-merge.yml's dispatch of the Full Suite Gate) raises no
# `workflow_run` event, so that matrix's failures were never seen. post-merge.yml now dispatches with the PAT, and the
# `reconcile` job (hourly, or by hand) is the safety net for any event GitHub drops: for each open `ci-red-main` issue
# it reads the latest completed non-cancelled run of that workflow on main and comments or closes (tests/tools/main_watch.py).
#
# `workflow_run` runs this file as it is on main, never a PR's copy. It checks out main only (the decision logic is
# tests/tools/main_watch.py), reads no artifacts and never runs pull-request code.

on:
  workflow_run:
    workflows:
      - "CICS Crucible"
      - "CodeQL Security Scan"
      - "Det Sweep"
      - "Estate Crucible"
      - "Evidence Pages"
      - "Evidence Refresh"
      - "Fact Cross-check"
      - "Full Suite Gate (All OS x Python)"
      - "Generated Java Compiles"
      - "GitGalaxy Smoke Tests"
      - "Mainframe Ground Truth"
      - "Muninn Security Scan"
      - "Ports Compile"
      - "Tree-sitter Accuracy Audit"
      - "unicode-gauntlet"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    # only runs on main itself (not a PR's merge ref), and only a real verdict (not cancelled / skipped)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: main-watch-${{ github.event.workflow_run.name }}  # one writer per watched workflow
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WF: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Checkout the base repository's main (never a pull request's head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Open, update or close the main-is-red issue
        run: python3 tests/tools/main_watch.py event

  reconcile:
    # the safety net: events that never arrived (a GITHUB_TOKEN-created run raises no workflow_run, #4859)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: main-watch-reconcile
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout the base repository's main (never a pull request's head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Comment on or close each open main-is-red issue from the latest verdict on main
        run: python3 tests/tools/main_watch.py reconcile
