name: Muninn Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  muninn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Muninn
        # zizmor: ignore[github_action_from_unverified_creator_used]
        uses: skaldlab/muninn@46fc8f39905c160070071a4e2312c3e7c139b62b # v0.3.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: info
          format: sarif,comment

      - name: Upload SARIF
        if: always() && hashFiles('muninn.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: muninn.sarif
