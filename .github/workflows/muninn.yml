name: Muninn Security Scan

on:
  # #4520: PRs to main with code changes only; main is covered by the weekly scan.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
    # #5132: on a PR only when engine code, a dependency pin or a workflow changes; the schedule below is the backstop
    # for everything else (tests, docs, site, corpora).
    paths:
      - "gitgalaxy/**"
      - ".github/**"
      - "pyproject.toml"
      - "ci/requirements/**"
      - "templates/requirements/**"
      - "requirements*.txt"
      - "action.yml"
      - ".claude/**"  # agent instructions and skills are what Muninn reads most closely
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  muninn:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      # #5499: checkov (84% of the step) walks every file in the checkout and the action has no changed-files mode. On a
      # PR check out only the paths this workflow's own filter triggers on, at their real paths so SARIF locations and
      # `muninn.yml` suppressions still match. Schedule and dispatch take the full tree below: the backstop.
      # Keep the list in step with `on.pull_request.paths`; the three root config files are read by the scanners.
      - name: Checkout (PR, filtered paths only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /gitgalaxy/
            /.github/
            /.claude/
            /ci/
            /templates/
            /pyproject.toml
            /requirements*.txt
            /action.yml
            /muninn.yml
            /zizmor.yml

      - name: Checkout (full tree)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Muninn
        # zizmor: ignore[github_action_from_unverified_creator_used]
        uses: skaldlab/muninn@269494d4517141eda9467d5cf94e35e2ec49b9b7 # v0.3.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: info
          format: sarif,comment

      - name: Upload SARIF
        if: always() && hashFiles('muninn.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: muninn.sarif
