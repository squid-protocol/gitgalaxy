name: Mypy Audit

on:
  pull_request:
    branches:
      - main
    paths-ignore: ["docs/**"]

permissions:
  contents: read

jobs:
  mypy-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install mypy and GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install mypy PyYAML
          pip install -e .

      - name: Run baseline-gated regression check (#430)
        run: python tests/mypy_audit.py --ci
