name: Mypy Audit

on:
  pull_request:
    branches:
      - main
    paths-ignore: ["docs/**"]

permissions:
  contents: read

jobs:
  mypy-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install mypy and GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install mypy PyYAML
          pip install -e .

      - name: Run baseline-gated regression check (#430)
        run: python tests/mypy_audit.py --ci
