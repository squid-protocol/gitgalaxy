name: Ports Compile

# #4423: every committed port must compile against the generator at HEAD. A generator change that renames a DTO or
# changes a generated method (#4390, #4342) used to leave committed ports that no longer compiled, and nothing said
# so by name: it surfaced as ratcheted java-ported cells of the CICS crucible (Docker, GnuCOBOL, per scenario) or as
# stale evidence records. tests/tools/ports_compile_check.py generates each crucible case's project and each
# equivalence corpus's project with this checkout, lays the committed ports over it (tests/cics_crucible/ports/*,
# tests/equivalence/*/port) and compiles -- no Docker, no COBOL run -- and fails naming each port that does not
# compile (`crucible:<case>/<PROGRAM>`, `equivalence:<case>`).
#
# The crucible is cloned at PINNED_REF, read out of tests/crucible_pins.toml exactly as cics-crucible.yml does.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
    paths:
      - "gitgalaxy/**"
      # #6278 slice 4: a standalone tool nothing here imports (test_engine_reach_workflows.py proves it from the import closure)
      - "!gitgalaxy/tools/terabyte_log_scanning/**"
      - "pyproject.toml"
      - "tests/cics_crucible/ports/**"
      - "tests/equivalence/*/port/**"
      - "tests/equivalence/*/case.json"
      - "tests/cobol_mainframe/corpora.json"
      - "tests/_cics_crucible_pin.py"
      - "tests/crucible_pins.toml"
      - "tests/tools/ports_compile_check.py"
      - "tests/tools/port_surface.py"
      - "tests/tools/cics_crucible.py"
      - "tests/tools/equivalence_java.py"
      - "tests/tools/equivalence_cache.py"
      - "tests/tools/java_target_matrix.py"
      - "tests/tools/mainframe_corpus.py"
      - "scripts/check_assess_install.py"  # #4726: the clean-install check step below
      - "tests/tools/assess_install_plan.py"  # #6672: plans that step on a PR
      - ".github/workflows/ports-compile.yml"
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)
  # #5131/#5136: no main push trigger. post-merge.yml dispatches this on main (at most once per cadence window, only
  # when PR runners are idle and main changed a file this workflow reads); the nightly run covers a busy day.
  schedule:
    - cron: "29 6 * * *"  # nightly (#5136)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # #4825: read-only, so a superseded main run is cancelled too (frees runners for PRs)

jobs:
  ports-compile:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    name: committed ports compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read  # #6672: the PR's changed files (with their status) plan the clean-install step
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get cics)
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e ./gitgalaxy

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        id: maven_dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ports-compile-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            ports-compile-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      # #5024: restore-only on pull requests. A PR's cache scope is its own ref, so a PR that saved here left
      # a copy per PR (a PR that edits corpora.json) that nothing else could read. Main saves it, once per key.
      - name: Save the pinned corpora (main)
        if: github.event_name != 'pull_request' && steps.corpora.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a miss only costs the next run a clone
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Compile every committed port
        run: |
          cd gitgalaxy
          python tests/tools/ports_compile_check.py --crucible ../cics-crucible --keep "$RUNNER_TEMP/ports_compile" \
            | tee "$RUNNER_TEMP/ports_compile.txt"
          exit "${PIPESTATUS[0]}"
        shell: bash

      # #4530: the committed equivalence ports keep the facades the generator writes now (a generator change that moves
      # one is resurfaced with `port_surface.py equivalence --work DIR`, then re-proven). Same corpora, no Maven.
      - name: Equivalence ports carry the generator's facades
        run: |
          cd gitgalaxy
          python tests/tools/port_surface.py equivalence --work "$RUNNER_TEMP/port_surface" --check
        shell: bash

      # #4726: `gitgalaxy assess` installs and runs on a clean machine, from wheels, on every burned estate. Rides this job
      # because it already has the checkout and the pinned corpora; no new trigger or matrix. The script builds the wheel
      # from the checkout and installs it into a fresh venv with --no-index; the wheelhouse (the translator extra's wheels)
      # is built here, with network, so the translate-only dry run is on.
      # #6672: on a PR it runs only when a changed file can break the install (tests/tools/assess_install_plan.py:
      # packaging, the assess command, a file added / removed / renamed under gitgalaxy/, a shipped data file). Main
      # dispatch and the nightly always run it; an unreadable or short file list, or a failed plan, runs it too.
      - name: Plan the clean-install check
        id: assess_plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          cd gitgalaxy
          args=(--event "$EVENT" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT" = "pull_request" ]; then
            # the PR's files from the API, whole or not at all (as equivalence-e2e.yml's plan): a short list runs the check
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | "\(.status)\t\(.filename)"' > "$RUNNER_TEMP/pr_files.tsv" || : > "$RUNNER_TEMP/pr_files.tsv"
            count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files || echo 0)
            if [ "$count" -gt 0 ] && [ "$(wc -l < "$RUNNER_TEMP/pr_files.tsv")" -ge "$count" ]; then
              args+=(--files-tsv "$RUNNER_TEMP/pr_files.tsv")
            fi
          fi
          python3 tests/tools/assess_install_plan.py "${args[@]}" > "$RUNNER_TEMP/assess_plan.json" || echo "run=true" >> "$GITHUB_OUTPUT"
          { echo "## Clean-install check plan"; echo '```json'; cat "$RUNNER_TEMP/assess_plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Assess clean-install check (burned estates, translator from a wheelhouse)
        if: steps.assess_plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          pip wheel "./[translator]" -w "$RUNNER_TEMP/wheelhouse"
          python scripts/check_assess_install.py --wheelhouse "$RUNNER_TEMP/wheelhouse" --estates "$GITGALAXY_MAINFRAME_CORPORA"
        shell: bash

      - name: Summary
        if: always()
        run: |
          {
            echo "## Committed ports vs the generator at HEAD"
            echo '```'
            grep -E '^(ok|FAIL|all |[0-9]+ of|  - )' "$RUNNER_TEMP/ports_compile.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the Maven dependencies to the cache
        if: success() && github.event_name != 'pull_request' && steps.maven_dependencies.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ports-compile-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
