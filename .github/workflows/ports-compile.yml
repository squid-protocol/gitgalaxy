name: Ports Compile

# #4423: every committed port must compile against the generator at HEAD. A generator change that renames a DTO or
# changes a generated method (#4390, #4342) used to leave committed ports that no longer compiled, and nothing said
# so by name: it surfaced as ratcheted java-ported cells of the CICS crucible (Docker, GnuCOBOL, per scenario) or as
# stale evidence records. tests/tools/ports_compile_check.py generates each crucible case's project and each
# equivalence corpus's project with this checkout, lays the committed ports over it (tests/cics_crucible/ports/*,
# tests/equivalence/*/port) and compiles -- no Docker, no COBOL run -- and fails naming each port that does not
# compile (`crucible:<case>/<PROGRAM>`, `equivalence:<case>`).
#
# The crucible is cloned at PINNED_REF, read out of tests/_cics_crucible_pin.py exactly as cics-crucible.yml does.

on:
  pull_request:
    branches: [main]
    paths:
      - "gitgalaxy/**"
      - "pyproject.toml"
      - "tests/cics_crucible/ports/**"
      - "tests/equivalence/*/port/**"
      - "tests/equivalence/*/case.json"
      - "tests/cobol_mainframe/corpora.json"
      - "tests/_cics_crucible_pin.py"
      - "tests/tools/ports_compile_check.py"
      - "tests/tools/port_surface.py"
      - "tests/tools/cics_crucible.py"
      - "tests/tools/equivalence_java.py"
      - "tests/tools/equivalence_cache.py"
      - "tests/tools/java_target_matrix.py"
      - "tests/tools/mainframe_corpus.py"
      - ".github/workflows/ports-compile.yml"
  push:
    branches: [main]
    paths:
      - "gitgalaxy/**"
      - "tests/cics_crucible/ports/**"
      - "tests/equivalence/*/port/**"
      - "tests/equivalence/*/case.json"
      - "tests/tools/ports_compile_check.py"
      - "tests/tools/port_surface.py"
      - ".github/workflows/ports-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ports-compile:
    name: committed ports compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
      PYTHONUTF8: "1"
      GITGALAXY_MAINFRAME_CORPORA: ${{ github.workspace }}/.mainframe_corpora
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Clone cics-crucible at the pin
        run: |
          # One line, one literal form in the pin file: see tests/_cics_crucible_pin.py.
          ref=$(sed -n 's/^PINNED_REF = "\(.*\)"/\1/p' gitgalaxy/tests/_cics_crucible_pin.py)
          if [ -z "$ref" ]; then
            echo "::error title=CICS crucible pin unavailable::No PINNED_REF in gitgalaxy/tests/_cics_crucible_pin.py."
            exit 1
          fi
          git init -q cics-crucible
          git -C cics-crucible remote add origin https://github.com/squid-protocol/cics-crucible.git
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            git -C cics-crucible fetch -q --depth 1 origin "$ref"
          else
            git -C cics-crucible fetch -q --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"
          fi
          git -C cics-crucible checkout -q --detach FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy
        run: |
          python -m pip install --upgrade pip
          pip install -e ./gitgalaxy

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ports-compile-m2-${{ hashFiles('gitgalaxy/gitgalaxy/tools/cobol_to_java/cobol_to_java_build_forge.py') }}
          restore-keys: |
            ports-compile-m2-
            cics-crucible-m2-
            java-compile-m2-

      - name: Cache the pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mainframe_corpora
          key: mainframe-corpora-${{ hashFiles('gitgalaxy/tests/cobol_mainframe/corpora.json') }}

      - name: Fetch the pinned corpora
        run: |
          cd gitgalaxy
          rm -rf "$GITGALAXY_MAINFRAME_CORPORA/_scans"
          PYTHONPATH="$PWD" python tests/tools/mainframe_corpus.py fetch

      - name: Compile every committed port
        run: |
          cd gitgalaxy
          python tests/tools/ports_compile_check.py --crucible ../cics-crucible --keep "$RUNNER_TEMP/ports_compile" \
            | tee "$RUNNER_TEMP/ports_compile.txt"
          exit "${PIPESTATUS[0]}"
        shell: bash

      # #4530: the committed equivalence ports keep the facades the generator writes now (a generator change that moves
      # one is resurfaced with `port_surface.py equivalence --work DIR`, then re-proven). Same corpora, no Maven.
      - name: Equivalence ports carry the generator's facades
        run: |
          cd gitgalaxy
          python tests/tools/port_surface.py equivalence --work "$RUNNER_TEMP/port_surface" --check
        shell: bash

      - name: Summary
        if: always()
        run: |
          {
            echo "## Committed ports vs the generator at HEAD"
            echo '```'
            grep -E '^(ok|FAIL|all |[0-9]+ of|  - )' "$RUNNER_TEMP/ports_compile.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
