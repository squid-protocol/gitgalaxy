name: post-merge

# #4825: heavy read-only checks on main run only when no PR job is waiting for a runner. On every push to main (a
# merge) and every 20 minutes (the fallback: GitHub's schedules are best-effort and sometimes never fire), this reads
# main's head SHA and, when no PR job is queued, dispatches each target workflow on main
# (tests/tools/post_merge_dispatch.py has the rule, and tests in test_post_merge_dispatch.py).
#
# #5136: idle at dispatch is not idle afterwards -- a Full Suite Gate dispatched once per main SHA held ~10 runners for
# ~24 min each time and took 15.6% of all CI minutes. So each target runs at most once per CADENCE_HOURS, on the newest
# SHA, and only when main changed a file it reads since its last run; its nightly schedule (and, for the two OS
# grids, release tags) still run it whatever the cadence. #5130/#5131 moved the OS smoke grid and the read-only
# crucibles here from their own `push` triggers. A SHA is dispatched at most once. Nothing here writes to the repo.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write   # gh workflow run
  contents: read

concurrency:
  # Only the newest main is worth considering: a push cancels a dispatcher still running for an older SHA (the
  # dispatch is seconds long; the newer run reads main's head itself). Safe to cancel: a dispatch that already
  # happened is recorded in the run list for its SHA, which the newer run checks.
  group: post-merge
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the dispatcher and the workflow filters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/tools/post_merge_dispatch.py
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # promoter-bot#64 (2026-10-24): the squid-shepherd App has its own API quota; AUTOMATION_PAT shares the
      # account's 5,000/h with the agent fleet, and the shepherd stopped merging when it ran out. The PAT stays
      # the fallback (a failed mint leaves the output empty).
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      - name: Dispatch post-merge checks when PR runners are idle (cadence-capped)
        env:
          GH_TOKEN: ${{ github.token }}
          # #4859: a run created with the repo GITHUB_TOKEN raises no `workflow_run` when it completes, so main-watch
          # never saw the dispatched Full Suite Gate fail. The dispatch uses the PAT (a real actor); everything else
          # here stays on the read-only token. Falls back to GITHUB_TOKEN if the secret is missing (main-watch's
          # scheduled reconcile still catches the result).
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          # #5136: at most one run per target per this many hours (on the newest main SHA)
          CADENCE_HOURS: "3"
          # Defer while more PR jobs than this are waiting (queued) for a runner.
          WAITING_MAX: "0"
        run: python3 tests/tools/post_merge_dispatch.py
