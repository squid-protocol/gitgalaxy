name: Archive Release Output to Language Crucible

# Runs once per official GitGalaxy release (never on a bare tag push --
# the `release` webhook only fires for actual GitHub Releases): scans the
# same pinned language-crucible/data corpus the crucible-audit CI gate
# uses, so results stay comparable release-over-release.
#
# Storage split deliberately, to avoid unbounded git-history growth:
#   - data_galaxy_audit.json (small, git-diffable) is committed into
#     language-crucible/raw_output/<tag>/ via a PR, so it's browsable
#     and diffable directly in that repo.
#   - Everything heavier (SQLite DB, graph, SARIF, SBOM, GPU payload,
#     LLM brief) is this run's workflow artifact (90 days), never part of
#     any repo's history. It used to attach to the release as assets, but
#     this repo's releases are immutable: GitHub refuses an asset once a
#     release is published ("HTTP 422: Cannot upload assets to an
#     immutable release"), which failed every release from v2.8.0 to
#     v2.11.0 before the baseline PR below was ever opened.
#
# workflow_dispatch lets this be dry-run against a past release tag
# without needing to cut a new one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to archive (e.g. v2.4.5) -- for manual testing"
        required: true

permissions:
  contents: write

jobs:
  archive-crucible-output:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout GitGalaxy at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy (full-precision)
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/engines.txt
          pip install --no-build-isolation -e .

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml, same as CI)
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          echo "CRUCIBLE_REF=$ref" >> "$GITHUB_ENV"
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Run GalaxyScope against the crucible corpus
        env:
          GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
        run: |
          mkdir -p telemetry_out
          # 180s was enough once; the pinned corpus (3,600+ files) took ~3 min for v2.11.0 and was killed
          # (exit 124) while writing its last export. The job's own timeout still bounds a hang.
          timeout 900s galaxyscope ./language-crucible/data --output ./telemetry_out/

      - name: Keep the heavy artifacts with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crucible-output-${{ env.RELEASE_TAG }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            telemetry_out/data_galaxy_master.db
            telemetry_out/data_galaxy_graph.sqlite
            telemetry_out/data_galaxy_sarif.json
            telemetry_out/data_galaxy_sbom.json
            telemetry_out/data_galaxy_gpu.json
            telemetry_out/data_galaxy_llm.md

      # promoter-bot#64 (2026-10-24): the squid-shepherd App has its own API quota; AUTOMATION_PAT shares the
      # account's 5,000/h with the agent fleet, and the shepherd stopped merging when it ran out. The PAT stays
      # the fallback (a failed mint leaves the output empty).
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}
          owner: squid-protocol
          repositories: gitgalaxy,language-crucible

      - name: Checkout Language Crucible
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: squid-protocol/language-crucible
          path: language-crucible-write
          token: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          persist-credentials: true

      - name: Stage the archived baseline
        run: |
          mkdir -p "language-crucible-write/raw_output/${RELEASE_TAG}"
          cp telemetry_out/data_galaxy_audit.json "language-crucible-write/raw_output/${RELEASE_TAG}/data_galaxy_audit.json"

      - name: Open PR with the archived baseline
        uses: squid-protocol/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # forked from peter-evans/create-pull-request v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: language-crucible-write
          repository: squid-protocol/language-crucible
          commit-message: "chore: archive ${{ env.RELEASE_TAG }} crucible baseline"
          title: "chore: archive ${{ env.RELEASE_TAG }} crucible baseline"
          body: |
            Automated archive of GitGalaxy `${{ env.RELEASE_TAG }}`'s output against the pinned
            `data/` corpus (`${{ env.CRUCIBLE_REF }}` tag), for release-over-release comparison.

            The remaining artifacts (SQLite DB, graph, SARIF, SBOM, GPU payload, LLM brief) are kept
            with the run that made them (90 days) rather than committed here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto/crucible-archive-${{ env.RELEASE_TAG }}
          delete-branch: true
          add-paths: raw_output/${{ env.RELEASE_TAG }}/data_galaxy_audit.json
