name: Ruff Audit

on:
  pull_request:  # #4825: a required check -- runs on every PR (a docs-only PR is a quick pass)
    branches:
      - main

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #6278: skip the install and the audit when the PR changes only docs this audit cannot read
      # (tests/tools/audit_skip_plan.py). The check still starts and reports; it fails open (mode=full).
      - name: Plan the audit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' || echo "shepherd:full")
          mapfile -t files < <(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' || true)
          count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files || echo 0)
          args=(--profile lint --event pull_request --labels "$labels" --github-output "$GITHUB_OUTPUT" --files)
          if [ "${#files[@]}" -ge "$count" ]; then args+=("${files[@]}"); fi
          python3 tests/tools/audit_skip_plan.py "${args[@]}" || echo "mode=full" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.plan.outputs.mode != 'none' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      # Pinned (unlike mypy-audit.yml's unpinned `pip install mypy`): ruff ships
      # new lint rules and rule-set changes far more frequently than mypy does,
      # so an unpinned version could silently add new baseline findings on a PR
      # that touched no lint-relevant code. Bump deliberately, alongside a
      # baseline regeneration, not as a side effect of a routine CI run.
      - name: Install ruff and GitGalaxy
        if: ${{ steps.plan.outputs.mode != 'none' }}
        run: |
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/lint.txt
          pip install --no-build-isolation -e .

      - name: Run baseline-gated lint regression check + zero-tolerance format check (#469)
        if: ${{ steps.plan.outputs.mode != 'none' }}
        run: python tests/ruff_audit.py --ci
