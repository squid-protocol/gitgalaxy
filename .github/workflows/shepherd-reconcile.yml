name: CI shepherd (reconcile)

# #4847 item 3: the passes that need no label event -- a required check finished on a labelled PR (rerun infra/flake failures,
# post the one digest per head, enable auto-merge once the matrix is green), a cron for
# the reruns' 15-minute gap, and a manual run (`ensure_labels: true` creates or refreshes the label set first).
# Logic: tests/tools/shepherd_gh.py. Like shepherd-event.yml, it checks out main only and never runs PR code.

on:
  # #4935: only the workflows behind main's required checks (shepherd_gh.REQUIRED_CHECKS, ruleset "main: required
  # checks") plus the matrix that shepherd:matrix waits on. Every other check is picked up by the next of these runs
  # on the same head, or by the cron: 25 triggers made 204 runs a day, 63% cancelled or skipped.
  workflow_run:
    workflows:
      - "Det Sweep"
      - "GitGalaxy Smoke Tests"
      - "Mainframe Ground Truth"
      - "Mypy Audit"
      - "Ruff Audit"
      - "Full Suite Gate (All OS x Python)"
    branches-ignore: [main]  # a run on main changes no PR's merge state: no run at all, not a skipped one
    types: [completed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      ensure_labels:
        description: "Create or refresh the shepherd:* labels first (idempotent)"
        type: boolean
        default: false

permissions: {}

concurrency:
  # One reconcile pass at a time. GitHub keeps one PENDING run per group and cancels older pending ones; that is
  # harmless here because every pass reconciles ALL labelled PRs (#4935), so a burst of completions coalesces into
  # one pass instead of dropping the PRs whose run was cancelled. shepherd-event.yml has no group (#4854).
  group: shepherd
  cancel-in-progress: false

jobs:
  reconcile:
    name: shepherd (reconcile)
    # a run of a push changes no PR's merge state; PR CI and the matrix (dispatched on a PR branch) do
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout the base repository's main (never a pull request's head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # #5398: the learned-flake list (flake_history.py's 14-day cache), refreshed and saved only by flake-history.yml
      # (2026-10-20: this pass cannot save it, a workflow_run's cache token is read-only). Never an exact hit: restore-keys
      # takes the newest saved one.
      - name: Restore the flake-history cache
        id: flake
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flake-cache
          key: flake-history-${{ github.run_id }}
          restore-keys: |
            flake-history-

      # promoter-bot#64 (2026-10-24): the squid-shepherd App has its own API quota; AUTOMATION_PAT shares the
      # account's 5,000/h with the agent fleet, and the shepherd stopped merging when it ran out. The PAT stays
      # the fallback (a failed mint leaves the output empty).
      - name: Mint the squid-shepherd App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SHEPHERD_APP_ID }}
          private-key: ${{ secrets.SHEPHERD_APP_KEY }}

      - name: Create or refresh the shepherd:* labels
        if: github.event.inputs.ensure_labels == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          SHEPHERD_TRUSTED_BOTS: "squid-shepherd[bot],squid-protocol"
        run: python3 tests/tools/shepherd_gh.py ensure-labels

      - name: Reconcile every labelled open pull request
        # #4935: every pass covers all of them (not only the run's head), so a cancelled pending pass loses nothing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_PAT }}
          SHEPHERD_TRUSTED_BOTS: "squid-shepherd[bot],squid-protocol"
        run: python3 tests/tools/shepherd_gh.py reconcile --flake-cache flake-cache/flake_history.json
