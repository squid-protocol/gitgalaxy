name: GitGalaxy Smoke Tests

on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**"]
  # #4518: the full 3 OS x 3 Python smoke grid runs here; PRs get a lean set.
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  schedule:
    - cron: "23 4 * * *"  # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # TRUE smoke test: cheap, OS/Python-version-sensitive checks only (package
  # installs, CLI entry points, syntax floor) across the full matrix. Does
  # NOT run the full pytest suite -- see full-suite (single env, below) for
  # every-push regression coverage, and full-suite-gate.yml for the full
  # matrix x full-suite backup run (fires on main, nightly, release tags and manual runs).
  # This split exists because most of tests/ (extraction/core_engine regex
  # rules) has zero OS-dependency: running it 12x per push added CI cost
  # that scaled with every language added to the extraction-hardening epic
  # (#813) without adding real signal over running it once.
  smoke-test:
    # #4520: PRs get ubuntu/3.12 via the full-suite job below (which also runs
    # the --help entry-point checks); this grid runs on main, nightly and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
    strategy:
      fail-fast: false
      # #4518/#4520: full 9-way grid; this job is skipped on PRs.
      matrix:
        include: ${{ fromJSON('[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"}]') }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install macOS dependencies (OpenMP for XGBoost)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install PyYAML networkx tiktoken "pandas>=2.0.0" xgboost pytest
          pip install --no-build-isolation -e .

      - name: Smoke Test - Core Engine
        run: python -m gitgalaxy.galaxyscope --help

      - name: Smoke Test - Legacy Refractor Controller
        run: python -m gitgalaxy.cobol_refractor_controller --help

      - name: Smoke Test - Java Spring Forge Controller
        run: python -m gitgalaxy.cobol_to_java_controller --help

      - name: Smoke Test - Supply Chain Firewall
        run: python -m gitgalaxy.tools.supply_chain_security.supply_chain_firewall --help

      - name: Smoke Test - API Network Map
        run: python -m gitgalaxy.tools.network_auditing.full_api_network_map --help

  # Full pytest suite, ONE representative environment (ubuntu/3.12), on
  # every push. This is the fast-feedback regression net that used to run
  # 12x inside the smoke-test matrix above; running it once here keeps that
  # signal on every push without the 12x cost. The full OS x Python-version
  # matrix still gets exercised, just not on every push -- see
  # full-suite-gate.yml.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install PyYAML networkx tiktoken "pandas>=2.0.0" xgboost pytest pytest-xdist
          # the COBOL translator's parser: without it every det-translator test importorskips and the
          # suite passes without running them (a stale emitter expectation reached main that way)
          pip install "tree-sitter-language-pack==1.20.0"
          pip install --no-build-isolation -e .

      - name: Entry point --help - Core Engine
        run: python -m gitgalaxy.galaxyscope --help

      - name: Entry point --help - Legacy Refractor Controller
        run: python -m gitgalaxy.cobol_refractor_controller --help

      - name: Entry point --help - Java Spring Forge Controller
        run: python -m gitgalaxy.cobol_to_java_controller --help

      - name: Entry point --help - Supply Chain Firewall
        run: python -m gitgalaxy.tools.supply_chain_security.supply_chain_firewall --help

      - name: Entry point --help - API Network Map
        run: python -m gitgalaxy.tools.network_auditing.full_api_network_map --help

      - name: Golden Record Integration Test (Pytest)
        run: pytest tests/ -n auto -q -ra --durations=25
