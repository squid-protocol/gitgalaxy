name: GitGalaxy Smoke Tests

on:
  pull_request:  # #4825: full-suite is a required check -- it runs on every PR
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main]
  # the full suite on main; the OS grid runs in os-smoke-grid.yml (#5130)
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  schedule:
    - cron: "23 4 * * *"  # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # #4825: on for every event; these runs commit nothing, so a superseded run is safe to cancel.
  # #5133: the nightly has its own group and is never cancelled. It shared main's group, so the next push cancelled it ~5 min in
  # (all 8 nightlies of 2026-10-15..22) and `full-suite-durations` never stored the calibrated durations.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  # #6514: only a PR (or a dispatch) cancels a superseded run. A main push used to cancel the previous push's run, and under
  # a stream of merges no run ever finished (8 in a row cancelled 2026-10-24), so main had no green verdict and ci-red-main
  # could not close. Now one run goes on and the newest push waits behind it (GitHub drops older pending ones).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  # #5130: the 3 OS x 3 Python smoke grid (package installs, CLI entry points) moved to os-smoke-grid.yml, dispatched
  # on main by post-merge.yml (cadence-capped) plus nightly and on release tags. This workflow keeps the full suite on
  # ONE environment (ubuntu/3.12), every PR and every main push; full-suite-gate.yml runs it across the OS x Python matrix.
  # The required check (#4825 ruleset): one name, whatever the number of parts.
  full-suite:
    needs: [tested-tree, suite-plan, full-suite-part]
    # #5104: draft PRs skip heavy CI. A main push superseded by the next push (cancel-in-progress) skips this summary
    # instead of failing it (40 false-red `full-suite` jobs on main 2026-10-20); on a PR a cancel still fails it, so a
    # cancelled head can never pass the required check by being skipped.
    if: ${{ always() && !(github.event_name != 'pull_request' && cancelled()) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the suite passed
        env:
          PARTS: ${{ needs.full-suite-part.result }}
          SKIP: ${{ needs.tested-tree.outputs.skip }}
          PLAN: ${{ needs.suite-plan.outputs.mode }}
        run: |
          echo "full-suite parts: $PARTS (tested-tree skip: $SKIP, suite plan: $PLAN)"
          # #4935: "skipped" is a pass only when the gate proved this tree green on the PR; otherwise it is a failure.
          # #6278: or when the suite plan proved the PR changes only prose no test or engine code opens (mode skip).
          test "$PARTS" = "success" || { test "$PARTS" = "skipped" && { test "$SKIP" = "true" || test "$PLAN" = "skip"; }; }

  # #6278 item 3: how much of the suite a PR runs (tests/tools/suite_select_plan.py, the classifier's area()): `skip` runs no
  # part (full-suite below reports success), `select` runs only the readers of the changed docs / agent config, `full` (and
  # every doubt, push, schedule, dispatch: the steps do not run, the output is empty) runs everything. It fails open: a step
  # that cannot plan leaves mode=full. The job carries the draft condition (#5104); only its steps are PR-only.
  suite-plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      paths: ${{ steps.plan.outputs.paths }}
    steps:
      - name: Check out repository code
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # #6278 item 5: the newest nightly's coverage map (engine-coverage-map.yml); a miss plans without it (engine edits run full)
      - name: Restore the newest coverage map
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine-map-cache
          key: engine-test-map-${{ github.run_id }}  # never an exact hit: restore-keys takes the newest saved one
          restore-keys: |
            engine-test-map-

      - name: Plan the suite
        id: plan
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # the PR's files from the API (whole or not at all, as for the ReDoS sweep plan, #5882): a short list is full
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' || echo "shepherd:full")
          mapfile -t files < <(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' || true)
          count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files || echo 0)
          args=(--event pull_request --labels "$labels" --github-output "$GITHUB_OUTPUT" --coverage-map engine-map-cache/engine_test_map.json --files)
          if [ "${#files[@]}" -ge "$count" ]; then args+=("${files[@]}"); fi
          python3 tests/tools/suite_select_plan.py "${args[@]}" > suite-plan.json || { echo "mode=full" >> "$GITHUB_OUTPUT"; echo '{"mode": "full", "reason": "the planner failed"}' > suite-plan.json; }
          {
            echo "## Suite plan"
            echo '```json'
            cat suite-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # #4935: a push to main whose tree already passed THIS workflow on its PR head (a squash of an up-to-date PR) is not
  # run again; any doubt runs it (tests/tools/skip_tested_tree.py has the rule, and tests). Always concludes success.
  # #5129: only a main push run can be skipped, so the gate runs on push only: a PR run (and a schedule / dispatch run,
  # which never skips) starts its heavy jobs without waiting on it. A skipped gate leaves `skip` empty: they run.
  tested-tree:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/tools/skip_tested_tree.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/tools/skip_tested_tree.py smoke-test.yml

  # #5114: the newest measured durations, chosen ONCE for all the parts. A part that restored `test-durations-` itself
  # could land on a different cache than its neighbours (the nightly saves one between their starts) and pytest-split
  # then cuts different slices. lookup-only downloads nothing; the parts restore this exact key. An empty key (no
  # cache yet, or this job failed) means every part uses the committed .test_durations: the same file, so still one split.
  durations:
    name: durations key
    needs: [tested-tree, suite-plan]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.tested-tree.outputs.skip != 'true' && needs.suite-plan.outputs.mode != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.durations.outputs.cache-matched-key }}
    steps:
      - name: Find the newest measured durations (#4847)
        id: durations
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: test-durations-${{ github.run_id }}  # never an exact hit: restore-keys takes the newest saved one
          restore-keys: |
            test-durations-
          lookup-only: true

  # Full pytest suite, ONE representative environment (ubuntu/3.12), on
  # every push. This is the fast-feedback regression net that used to run
  # 12x inside the old smoke-test matrix (now os-smoke-grid.yml); running it once here keeps that
  # signal on every push without the 12x cost. The full OS x Python-version
  # matrix still gets exercised, just not on every push -- see
  # full-suite-gate.yml.
  # #4825: the suite (~16.6k tests, up to ~20 min on one runner even with -n auto) runs in parts (#5919: as many as
  # shard-plan says), each on its own runner and each still -n auto (pytest-split --splits N --group N, balanced by .test_durations: per-test seconds,
  # refreshed now and then with `pytest tests/ -n 8 --store-durations` (pytest-split installed); a test it does not
  # list counts at the average). `full-suite` below -- the required check -- passes only when every part passed.
  # #4847: every run restores the newest nightly's durations (the cache saved by `full-suite-durations`), falling
  # back to the committed .test_durations on a miss; the nightly parts store their seconds and that job merges them.
  # #5919: the part count and the part jobs' timeout come from the measured durations (suite_shard_plan.py --smoke), not
  # from YAML: the suite grows every day. It plans from the exact durations the parts will balance by (the key the
  # `durations` job chose, else the committed .test_durations). The queue depth is read on a pull request only (empty =
  # calm). A plan that fails (no durations) skips the parts, so the required `full-suite` check fails.
  shard-plan:
    name: plan the suite parts
    needs: [tested-tree, suite-plan, durations]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.tested-tree.outputs.skip != 'true' && needs.suite-plan.outputs.mode != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the queued PR jobs (ci_layout.py --print-waiting)
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      splits: ${{ steps.plan.outputs.splits }}
      timeout: ${{ steps.plan.outputs.timeout }}
    steps:
      - name: Check out the planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/tools/suite_shard_plan.py
            tests/tools/ci_shard_plan.py
            tests/tools/ci_layout.py
            tests/tools/post_merge_dispatch.py
            .test_durations
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Restore the durations the plan chose (#4847, #5114)
        id: durations
        if: needs.durations.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: ${{ needs.durations.outputs.key }}

      - name: Balance by the restored durations (else the committed .test_durations)
        if: steps.durations.outputs.cache-matched-key != ''
        run: cp durations-cache/test_durations.json .test_durations

      - name: Plan the parts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          waiting=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then waiting=$(python3 tests/tools/ci_layout.py --print-waiting || true); fi
          python3 tests/tools/suite_shard_plan.py --smoke ${waiting:+--waiting "$waiting"} | tee -a "$GITHUB_OUTPUT"

  full-suite-part:
    name: full-suite part ${{ matrix.group }}/${{ needs.shard-plan.outputs.splits }}
    needs: [tested-tree, suite-plan, durations, shard-plan]
    # #6278: suite plan mode `skip` starts no part (full-suite reports success); empty (push, schedule, a failed plan) is full
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.tested-tree.outputs.skip != 'true' && needs.suite-plan.outputs.mode != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.shard-plan.outputs.timeout) }}  # #5919: planned from the durations
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-plan.outputs.matrix) }}
    env:
      PYTHONUTF8: "1"
      GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #5882: one commit. The sweep plan reads the PR's file list from the API, not a git diff. (The old
          # `event == 'pull_request' && 0 || 1` was always 1, as 0 is falsy: the plan could not diff and ran the sweeps.)
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/test.txt
          # the COBOL translator's parser: without it every det-translator test importorskips and the
          # suite passes without running them (a stale emitter expectation reached main that way)
          pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --no-build-isolation -e .

      - name: Cache tree-sitter language pack
        id: tree_sitter_language_pack
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('ci/requirements/treesitter.txt') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      # #5114: the exact key the `durations` job resolved ONCE; a part never picks "the newest" on its own (a nightly
      # save between two parts' starts gave them different slices: a test dropped or run twice).
      - name: Restore the durations the plan chose (#4847, #5114)
        id: durations
        if: needs.durations.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: ${{ needs.durations.outputs.key }}

      - name: Balance by the restored durations (else the committed .test_durations)
        if: steps.durations.outputs.cache-matched-key != ''
        # #5162: the weights this part balanced by, kept beside its times (test-times-part-N) to compare actual/weight per part
        run: |
          cp durations-cache/test_durations.json .test_durations
          cp durations-cache/test_durations.json "$RUNNER_TEMP/restored-durations-part-${{ matrix.group }}.json"

      - name: Entry point --help - Core Engine
        if: matrix.group == 1
        run: python -m gitgalaxy.galaxyscope --help

      - name: Entry point --help - Legacy Refractor Controller
        if: matrix.group == 1
        run: python -m gitgalaxy.cobol_refractor_controller --help

      - name: Entry point --help - Java Spring Forge Controller
        if: matrix.group == 1
        run: python -m gitgalaxy.cobol_to_java_controller --help

      - name: Entry point --help - Supply Chain Firewall
        if: matrix.group == 1
        run: python -m gitgalaxy.tools.supply_chain_security.supply_chain_firewall --help

      - name: Entry point --help - API Network Map
        if: matrix.group == 1
        run: python -m gitgalaxy.tools.network_auditing.full_api_network_map --help

      # #5166 part A: a PR that changes no sweep input (tests/tools/sweep_plan.py) deselects the extraction ReDoS sweeps
      # (marker `redos_sweep`, ~18 min of the suite); push, nightly, manual, `shepherd:full`, an unreadable diff: all of them.
      - name: Plan the ReDoS sweeps (#5166)
        id: sweeps
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PLAN: ${{ needs.suite-plan.outputs.mode }}
        run: |
          labels="" count=""
          files="$RUNNER_TEMP/pr-files.jsonl"
          : > "$files"
          if [ -n "$PR" ]; then
            labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' || true)
            # #5882: the PR's changed files, whole or not at all (sweep_plan.py checks the count): no git history needed
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, previous_filename}' > "$files" || : > "$files"
            count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files || true)
          fi
          python3 tests/tools/sweep_plan.py --event "$GITHUB_EVENT_NAME" --pr-files "$files" --pr-file-count "$count" \
            --labels "$labels" --github-output "$GITHUB_OUTPUT" | tee sweep-plan.json
          {
            echo "## ReDoS sweep plan"
            echo '```json'
            cat sweep-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # #5166: on a PR, mainframe-ground-truth.yml runs all of tests/cobol_mainframe/ whenever a ground-truth input
          # changed, and nothing it reads changed otherwise; nightly and manual runs keep them here (the nightly stores
          # their durations). #5953: a main push skips them too: ground truth runs the whole directory on every push
          # (plus the corpus-backed tests), so Smoke running it again was ~2,000-2,500 test-s twice. Through
          # PYTEST_ADDOPTS so the pytest command line below stays as it is.
          # #6278: not for a `select` run, whose paths may be tests/cobol_mainframe itself (a register doc's reader)
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; } && [ "$PLAN" != "select" ]; then echo "PYTEST_ADDOPTS=--ignore=tests/cobol_mainframe" >> "$GITHUB_ENV"; fi

      # #6278: a `select` run is a few test files: part 1 runs them (no pytest-split), the other parts only report
      - name: Golden Record Integration Test (Pytest), part ${{ matrix.group }}/${{ needs.shard-plan.outputs.splits }}
        if: ${{ needs.suite-plan.outputs.mode != 'select' || matrix.group == 1 }}
        env:
          PLAN: ${{ needs.suite-plan.outputs.mode }}
          SELECTED: ${{ needs.suite-plan.outputs.paths }}
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ needs.shard-plan.outputs.splits }}
          EVENT: ${{ github.event_name }}
          SWEEPS: ${{ steps.sweeps.outputs.mode }}
          GITGALAXY_TEST_TIMES: ${{ runner.temp }}/times-part-${{ matrix.group }}.json  # #5166: tests/conftest.py writes each test's seconds
        run: |
          # the nightly stores this part's seconds (--clean-durations: only the tests it ran) for full-suite-durations
          store=()
          if [ "$EVENT" = "schedule" ]; then store=(--store-durations --clean-durations); fi
          # --timeout: a hung test fails by name, not as a job timeout (see full-suite-gate.yml, #4840)
          # #5162: test_evidence_components.py (~226 s) is run by mainframe-ground-truth.yml (all of tests/cobol_mainframe/)
          # a bare -m replaces addopts' `not golden_crucible`, so it is repeated; no plan output (a failed step) = the full sweep
          marks=()
          if [ "$SWEEPS" = "none" ]; then marks=(-m "not golden_crucible and not redos_sweep"); fi
          # #5133: least_duration, not pytest-split's default duration_based_chunks (contiguous slices: all of tests/cobol_mainframe
          # landed in part 1, 11.9 min against 4.8 and 3.5)
          # #5133: this part's pytest wall seconds, for the nightly's wall-calibrated durations (a failed pytest fails the step first)
          started=$SECONDS
          target=(tests/ --splits "$SPLITS" --splitting-algorithm least_duration --group "$GROUP")
          if [ "$PLAN" = "select" ]; then read -ra target <<< "$SELECTED"; fi
          pytest "${target[@]}" -n auto -q -ra --durations=25 --timeout=600 --ignore=tests/cobol_mainframe/test_evidence_components.py "${store[@]}" "${marks[@]}"
          echo $((SECONDS - started)) > "$RUNNER_TEMP/pytest-wall-part-$GROUP.txt"

      # #5166 part B: the per-test time gate (a test over 10 s needs a slow marker or a baseline entry; a baselined one
      # fails over 2x). Part of this required job, so it always reports; the suite total is the suite-time job's.
      - name: Per-test time ratchet (#5166)
        if: ${{ needs.suite-plan.outputs.mode != 'select' || matrix.group == 1 }}
        run: python tests/tools/time_ratchet.py check --times "$RUNNER_TEMP/times-part-${{ matrix.group }}.json"

      - name: Upload this part's test times (#5166)
        # hashFiles() only sees the workspace, and runner.temp is outside it: it was always '' and the upload never ran (#5178)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-part-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/times-part-${{ matrix.group }}.json
            ${{ runner.temp }}/restored-durations-part-${{ matrix.group }}.json
          retention-days: 7
          if-no-files-found: ignore

      # #5133: the seconds pytest-split records are per-test times under `-n auto` contention, and the contention differs by
      # part; scaled so the part's seconds sum to its measured pytest wall, the next run's least_duration balances wall time.
      - name: Keep this part's durations, wall-calibrated (nightly, #4847, #5133)
        if: github.event_name == 'schedule' && success()
        run: |
          python3 tests/tools/calibrate_test_durations.py .test_durations "$RUNNER_TEMP/durations-part-${{ matrix.group }}.json" \
            --wall "$(cat "$RUNNER_TEMP/pytest-wall-part-${{ matrix.group }}.txt")"

      - name: Upload this part's durations (nightly, #4847)
        if: github.event_name == 'schedule' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-part-${{ matrix.group }}
          path: ${{ runner.temp }}/durations-part-${{ matrix.group }}.json
          retention-days: 7

      # #6675: main only (a PR's save is scoped to its ref, which nothing else reads); only on a miss
      - name: Save the tree-sitter language pack to the cache
        if: success() && github.event_name != 'pull_request' && steps.tree_sitter_language_pack.outputs.cache-hit != 'true'
        continue-on-error: true  # best effort: a lost save race must not fail the job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('ci/requirements/treesitter.txt') }}

  # #5133: the evidence level deltas (advisory, #4703) used to be the last step of part 3, which made it the slowest part
  # (it waits for the report on top of its share of the suite). Its own job: it starts with the parts, is never in
  # `full-suite`'s needs (so it cannot hold the required check back), and continue-on-error keeps a failure from
  # turning the run red. The output is the job summary.
  evidence-deltas:
    name: evidence report level deltas (advisory)
    needs: tested-tree
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.tested-tree.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
      GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --require-hashes -r ci/requirements/test.txt
          pip install --require-hashes -r ci/requirements/treesitter.txt
          pip install --no-build-isolation -e .

      - name: Evidence report level deltas (advisory, #4703)
        run: python tests/tools/evidence_report.py --deltas --live >> "$GITHUB_STEP_SUMMARY"

  # #4847: the nightly's parts' durations, merged (pytest-split's {nodeid: seconds} files, disjoint) and saved
  # under `test-durations-<run id>`; the next run of every part restores the newest one. Not a required check.
  full-suite-durations:
    name: store the suite's durations
    needs: [shard-plan, full-suite-part]
    # #5133 slice 8: not a bare success(): that is false when ANY ancestor in the needs chain was skipped, and the push-only
    # `tested-tree` (an ancestor through full-suite-part) is skipped on a schedule run, so the green nightly of 2026-10-25
    # (run 40179743618) skipped this job and stored no cache.
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.full-suite-part.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the parts' durations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-durations-part-*
          path: parts

      - name: Merge the parts into one durations file
        env:
          SPLITS: ${{ needs.shard-plan.outputs.splits }}
        run: |
          parts=$(find parts -name 'durations-part-*.json' | sort)
          test "$(printf '%s\n' "$parts" | grep -c .)" = "$SPLITS" || { echo "expected $SPLITS parts' durations:"; echo "$parts"; exit 1; }
          mkdir -p durations-cache
          python3 tests/tools/merge_test_durations.py durations-cache/test_durations.json $parts

      - name: Cache the merged durations
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations-cache
          key: test-durations-${{ github.run_id }}

  # #5166 part B: the suite's total serial test seconds against tests/test_time_baseline.json's budget. A PR (and main
  # push) prints the total and the delta in the job summary and never fails; the nightly fails over +10% and files or
  # refreshes ONE issue (it also lists the tests over 10 s there). Not a required check, not in `full-suite`'s needs.
  # The total is the sum of the parts' own measured seconds, not the contended durations cache (#5162).
  suite-time:
    name: suite time budget (#5166)
    needs: [suite-plan, shard-plan, full-suite-part]
    # #6278: a `select` run has only part 1's times, and a `skip` run none: no budget to total
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.full-suite-part.result == 'success' && (needs.suite-plan.outputs.mode == '' || needs.suite-plan.outputs.mode == 'full')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the parts' test times
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-times-part-*
          path: times

      - name: Total against the budget
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SPLITS: ${{ needs.shard-plan.outputs.splits }}
        run: |
          parts=$(find times -name 'times-part-*.json' | sort)
          test "$(printf '%s\n' "$parts" | grep -c .)" = "$SPLITS" || { echo "expected $SPLITS parts' test times:"; echo "$parts"; exit 1; }
          enforce=()
          if [ "$EVENT" = "schedule" ]; then enforce=(--enforce); fi
          status=0
          python3 tests/tools/time_ratchet.py budget --times $parts "${enforce[@]}" | tee report.txt || status=$?
          { echo "### Suite time budget"; echo; cat report.txt; } >> "$GITHUB_STEP_SUMMARY"
          # #5166: the nightly also lists every test over 10 s with no slow marker or baseline entry, in the same one issue
          over=0
          if [ "$EVENT" = "schedule" ]; then
            python3 tests/tools/time_ratchet.py over --times $parts --enforce | tee over.txt || over=1
            { echo "### Tests over 10 s"; echo; echo '```'; cat over.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if { [ "$status" = 1 ] || [ "$over" = 1 ]; } && [ "$EVENT" = "schedule" ]; then
            body="The nightly full suite is over its time budget or has tests over 10 s (tests/test_time_baseline.json): $(tail -n 2 report.txt | head -n 1)"$'\n\n'"$(cat over.txt)"$'\n\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Suite time over budget"' --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "Suite time over budget (nightly)" --body "$body"; fi
          fi
          exit $status
