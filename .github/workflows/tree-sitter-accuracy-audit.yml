name: Tree-sitter Accuracy Audit

# Baseline-gated regression check (same shape as ruff/mypy/dead-key-audit.yml and
# ast-accuracy-audit.yml) for tests/tools/tree_sitter_accuracy_audit.py -- catches a
# structural-signature regex change that quietly drops recall/precision against the
# tree-sitter ground truth, across every language with a committed baseline.
#
# Scoped to paths that can actually move these numbers, unlike ast-accuracy-audit.yml's
# repo-wide trigger -- this check cost ~1 minute locally across all 23 languages (one
# language-crucible clone + one galaxyscope scan per language), cheap enough to run on
# every relevant PR, but there's no reason to pay even that on a PR that only touches
# e.g. gitgalaxy/recorders/.

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/tree_sitter_accuracy_audit.py"
      - "tests/tree_sitter_accuracy_baseline_*.json"
      - ".github/workflows/tree-sitter-accuracy-audit.yml"

permissions:
  contents: read

jobs:
  tree-sitter-accuracy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitGalaxy PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install GitGalaxy + tree-sitter-language-pack
        run: |
          cd gitgalaxy
          python -m pip install --upgrade pip
          pip install -e .
          pip install tree-sitter-language-pack

      # Same pin golden-crucible.yml uses -- this tool reuses that corpus rather than
      # a fresh clone (see tests/tools/tree_sitter_accuracy_audit.py's own CORPUS section).
      - name: Fetch Language Crucible corpus (pinned via LANGUAGE_CRUCIBLE_REF)
        run: |
          # GitHub withholds repository variables (like secrets) from pull_request runs
          # raised from a fork, so `vars.LANGUAGE_CRUCIBLE_REF` is empty there. That used to
          # fail this job before any code ran. But the corpus repo is PUBLIC and clones with
          # no credentials -- the only thing a fork run actually lacks is the ref *string*,
          # and that string is already committed in-repo as PINNED_TAG. So fall back to it
          # and give fork contributors real signal. Same escape-hatch shape as
          # rosetta-audit.yml's unpinned checkout of keyword-rosetta main, but pinned exactly
          # rather than floating on main. See tests/_crucible_pin.py's docstring for why the
          # pin lives in two places, and remember to bump BOTH when moving it.
          ref="${{ vars.LANGUAGE_CRUCIBLE_REF }}"
          if [ -z "$ref" ]; then
            ref=$(sed -n 's/^PINNED_TAG = "\(.*\)"/\1/p' gitgalaxy/tests/_crucible_pin.py)
            echo "::notice title=Corpus pin read from the repo::LANGUAGE_CRUCIBLE_REF was empty -- expected on a pull_request run raised from a fork -- so this audit pinned its corpus to '$ref', read from tests/_crucible_pin.py."
          fi
          if [ -z "$ref" ]; then
            echo "::error title=Corpus pin unavailable::Could not resolve a corpus pin from either the LANGUAGE_CRUCIBLE_REF repository variable or PINNED_TAG in gitgalaxy/tests/_crucible_pin.py. If PINNED_TAG was renamed or its formatting changed, update the sed fallback in this workflow to match. See CONTRIBUTING.md, 'Corpus-backed checks'."
            exit 1
          fi
          git clone --branch "$ref" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible

      - name: Run baseline-gated regression check across every baselined language
        run: |
          cd gitgalaxy
          python tests/tools/tree_sitter_accuracy_audit.py --all --ci

      - name: Verify the summary table matches the committed baselines
        run: |
          cd gitgalaxy
          python tests/tools/tree_sitter_accuracy_audit.py --summary-table
          if ! git diff --exit-code -- gitgalaxy/standards/language_standards/__init__.py; then
            echo "::error::gitgalaxy/standards/language_standards/__init__.py's summary table is stale."
            echo "Run 'python tests/tools/tree_sitter_accuracy_audit.py --summary-table' and commit the result."
            exit 1
          fi
