name: Tree-sitter Accuracy History

# Push-to-main companion to tree-sitter-accuracy-audit.yml's PR-time gate. That gate only
# proves the *baselines* (tests/tree_sitter_accuracy_baseline_<lang>.json -- the numbers
# regressions are measured against) didn't get worse; those stay human-reviewed and only
# change via `tree_sitter_accuracy_audit.py --regenerate`, same discipline as the golden
# master fixtures. This workflow never touches them.
#
# What it DOES do, once a relevant change actually lands on main: live-measure every
# baselined language again and append one row each to
# docs/self_scan/tree_sitter_accuracy_history.csv (an accumulating time series, unlike the
# gitignored self-scan DB -- this is meant to be graphed later), regenerate the Markdown
# summary table embedded in language_standards/__init__.py's docstring so it can't drift from the
# committed baselines between now and the next manual --summary-table run, and re-render
# docs/self_scan/tree_sitter_accuracy_chart.svg (a small-multiples bar chart of the most
# recent history batch -- always the one this same job just appended). Opens an auto-merged
# PR for all three, same mechanism gitgalaxy.yml uses for the LLM architecture brief -- see
# that workflow's own comments for why a PR-then-merge instead of a direct push (branch
# protection), and why the loop guard below is load-bearing.
#
# Adaptive by design, not just by trigger path: the trigger below fires on any push touching
# detector.py/prism.py/language_standards/, but not every such push actually moves a
# language's measured accuracy. --history itself detects that (see
# tree_sitter_accuracy_audit.py's `_batch_matches_measured`) and skips appending a row when the
# fresh measurement is identical to the last recorded batch -- which means --chart re-renders
# byte-identical output (same source batch) and --summary-table stays a no-op too, so the
# create-pull-request step below finds nothing to diff and opens no PR. A "relevant path
# touched" push and a "numbers actually changed" push are different things; this job only ever
# produces visible output for the latter.

# #6501: a read-only `plan` job (tests/tools/accuracy_audit_plan.py --audit tree-sitter-history, on the push's diff) skips the
# install, the scan and the publish when no pushed file can move a language (a comment or `_meta` edit, say). That is what
# `--history` already concludes after the scan (an unchanged batch appends nothing); the plan just does not pay for it.
# A manual dispatch, an unreadable diff or a failed plan runs everything.

# #4847: the output is published to the `generated` branch (tests/tools/generated_branch.py), not committed to main through
# an auto-merged PR; the PR-then-merge and loop-guard paragraphs above describe the old mechanism.

on:
  push:
    branches: [main]
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/tree_sitter_accuracy_audit.py"
      - "tests/tree_sitter_accuracy_baseline_*.json"
  workflow_dispatch:  # also how the first publish seeds `generated`

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: can the pushed diff move a language's numbers? (read-only: the job below keeps the write token to itself)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # gh run list: the last successful run's commit
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the last planned commit
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not github.event.before: a queued run is replaced by a newer one, so its diff would miss the replaced push. The
          # base is the last successful run's commit (a planned skip is a success too), so the diffs chain with no gap. No
          # earlier run, or a commit gone from history, plans an empty or unreadable diff: it runs.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tree-sitter-accuracy-history.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          python3 tests/tools/accuracy_audit_plan.py --audit tree-sitter-history --event "$GITHUB_EVENT_NAME" --base "${base:-HEAD}" \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-history plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tree-sitter-accuracy-history:
    needs: [plan]
    if: ${{ always() }}  # a failed plan runs it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout GitGalaxy
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          fetch-depth: 0
          # #4847: the publish step pushes to `generated` with this checkout's token. The job runs main's code on a
          # push to main / dispatch only, never PR code (the same reasoning as evidence-pages.yml).
          persist-credentials: true

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy + tree-sitter-language-pack
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      # The series is appended to, so it starts from what `generated` last published (the copy committed on main is
      # only the seed and the fallback when the branch has none yet).
      - name: Restore the published series from the generated branch
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/generated_branch.py fetch \
            docs/self_scan/tree_sitter_accuracy_history.csv

      - name: Append accuracy history + chart
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/tree_sitter_accuracy_audit.py --history
          python tests/tools/tree_sitter_accuracy_audit.py --chart

      # What moved against the previous batch, for whoever reads the run (it used to be the PR body).
      - name: Improvement/regression blurbs
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/tree_sitter_accuracy_audit.py --blurbs >> "$GITHUB_STEP_SUMMARY"

      # #4847: output goes to the `generated` branch, never to main (no PR, no auto-merge: main no longer takes a bot
      # commit per run). Only main may write it; a dispatch from another ref publishes nothing.
      - name: Publish to the generated branch
        if: needs.plan.outputs.run != 'false' && github.ref == 'refs/heads/main'
        run: |
          cd gitgalaxy
          python tests/tools/generated_branch.py publish --stamp tree-sitter-accuracy-history \
            --message "tree-sitter-accuracy-history as of main $GITHUB_SHA" \
            docs/self_scan/tree_sitter_accuracy_history.csv \
            docs/self_scan/tree_sitter_accuracy_chart.svg
