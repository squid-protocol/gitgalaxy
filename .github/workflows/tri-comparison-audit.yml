name: Tri-Comparison Audit

# Baseline-gated regression check on GitGalaxy's own VALIDATED precision (GitGalaxy vs.
# tree-sitter vs. ctags), same shape as tree-sitter-accuracy-audit.yml's 2-tool equivalent --
# see tests/tools/tri_comparison_chart.py's own "--ci / --regenerate" section for why this
# gates precision only, never recall (recall's shared cross-tool denominator is exactly what
# that module's PANELS docstring section already explains is untrustworthy to rank on).
#
# Scoped to the same core-engine paths tree-sitter-accuracy-audit.yml already uses -- both
# audits exist to catch the same class of change, kept in sync deliberately.
#
# This job only ever MEASURES, never writes. It never requires a contributor to regenerate and
# commit docs/self_scan/tri_comparison_chart.svg / tri_comparison_ledger.json /
# tri_comparison_points_of_interest.md themselves -- that's the separate push-to-main companion,
# tri-comparison-history.yml, same split tree-sitter-accuracy-audit.yml/-history.yml already use
# and for the same reason: requiring every PR author to run a full language-crucible corpus scan
# + a real `ctags` binary locally just to unblock their own merge would reintroduce exactly the
# fragility PR #2111 (2026-08-22) already burned this repo on.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches:
      - main
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/tri_comparison_chart.py"
      - "tests/tools/tri_comparison_gatherer.py"
      - "tests/tools/tri_comparison_reconcile.py"
      - "tests/tools/tri_comparison_ledger.py"
      - "tests/tri_comparison_baseline_*.json"
      - "tests/tools/accuracy_audit_plan.py"  # #6501: the plan job's own code
      - "tests/tools/graph_accuracy_plan.py"  # #6501: imported by the planner
      - "tests/tools/change_classifier.py"  # #6501: imported by the planner
      - ".github/workflows/tri-comparison-audit.yml"
      - "tests/crucible_pins.toml"  # #4825: read by this workflow (workflow_inputs.py)
      - "tests/tools/crucible_pins.py"  # #4825: read by this workflow (workflow_inputs.py)

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: which languages does the diff move? (accuracy_audit_plan.py: `langs` is `all` or a comma list, empty = none.)
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}  # #5104: draft PRs skip heavy CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      langs: ${{ steps.plan.outputs.langs }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the merge base
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the audit
        id: plan
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          python3 tests/tools/accuracy_audit_plan.py --audit tri-comparison --event "$GITHUB_EVENT_NAME" --base origin/main \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-audit plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tri-comparison-audit:
    needs: [plan]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}  # #5104: draft PRs skip heavy CI; always(): a failed plan runs the audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitGalaxy PR
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy + tree-sitter-language-pack
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt

      # Hard preflight, not optional: PR #2111 (2026-08-22, see
      # docs/self_scan/tri_comparison_README.md) is a real incident where Ubuntu's
      # arduino-ctags package shadowed the `ctags` binary name and silently degraded every
      # language to a 2-tool comparison with no error anywhere in that run. A CI gate that
      # could suffer the same silent degradation would be worse than no gate at all, since it
      # would report false confidence instead of an honest failure.
      - name: Install universal-ctags and verify it's the real thing
        if: needs.plan.outputs.run != 'false'
        run: |
          # #5048: a mirror hiccup is infrastructure, not a code defect: bounded retry, then an INFRASTRUCTURE marker.
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y universal-ctags'
          if ! ctags --version | grep -q "Universal Ctags"; then
            echo "::error::ctags on PATH is not Universal Ctags -- refusing to run a silently-degraded audit."
            ctags --version || true
            exit 1
          fi

      # Same pin golden-crucible.yml / tree-sitter-accuracy-audit.yml use -- this tool reuses
      # that corpus rather than a fresh clone.
      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Run baseline-gated precision regression check across every baselined language
        if: needs.plan.outputs.run != 'false'
        env:
          LANGS: ${{ needs.plan.outputs.langs }}  # via env, never spliced into the script: it comes from changed file names
        run: |
          cd gitgalaxy
          if [ -z "$LANGS" ] || [ "$LANGS" = all ]; then  # empty: the plan job failed
            python tests/tools/tri_comparison_chart.py --all --ci
          else
            python tests/tools/tri_comparison_chart.py --languages "$LANGS" --ci
          fi
