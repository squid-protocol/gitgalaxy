name: Tri-Comparison History

# Push-to-main companion to tri-comparison-audit.yml's PR-time gate, same split
# tree-sitter-accuracy-audit.yml/-history.yml already use for the sibling 2-tool system. That
# gate only proves GitGalaxy's own validated precision (tests/tri_comparison_baseline_<lang>.json)
# didn't get worse; those baselines stay human-reviewed and only change via
# `tri_comparison_chart.py --regenerate`, same discipline as the golden master fixtures and the
# tree-sitter baselines. This workflow never touches them.
#
# What it DOES do, once a relevant change actually lands on main: regenerate
# docs/self_scan/tri_comparison_chart.svg, docs/self_scan/tri_comparison_ledger.json (which also
# refreshes last_seen_count/last_seen_examples on every existing ledger entry, and recomputes
# still_reproduces -- see tri_comparison_ledger.py's ENTRY LIFECYCLE docstring; a validated
# entry's status/verdict are never touched by this), and
# docs/self_scan/tri_comparison_points_of_interest.md, then opens an auto-merged PR with
# whatever actually changed -- same mechanism gitgalaxy.yml uses for the LLM architecture brief.
#
# Adaptive by design, not just by trigger path: the trigger below fires on any push touching
# detector.py/prism.py/language_standards/, but not every such push moves a language's measured
# numbers or an existing ledger entry's counts. Unlike the tree-sitter history CSV (an
# append-only file that needs its own _batch_matches_measured dedup check to stay a no-op), the
# three files here are overwritten in place -- "no diff" already IS the adaptivity, so
# create-pull-request finds nothing to diff and opens no PR on a push that didn't actually move
# anything, no separate skip-detection needed.

# #4847: the output is published to the `generated` branch (tests/tools/generated_branch.py), not committed to main through
# an auto-merged PR; the PR-then-merge and loop-guard paragraphs above describe the old mechanism.

on:
  push:
    branches: [main]
    paths:
      - "gitgalaxy/core/detector.py"
      - "gitgalaxy/core/prism.py"
      - "gitgalaxy/standards/language_standards/**"
      - "tests/tools/tri_comparison_chart.py"
      - "tests/tools/tri_comparison_gatherer.py"
      - "tests/tools/tri_comparison_reconcile.py"
      - "tests/tools/tri_comparison_ledger.py"
      - "tests/tri_comparison_baseline_*.json"
  workflow_dispatch:  # also how the first publish seeds `generated`

permissions:
  contents: read

concurrency:
  # One run per workflow per PR (or per ref outside a PR). Without this, a PR
  # that picks up several labels in one `gh pr create` starts a separate,
  # IDENTICAL run per label event on the same SHA (measured 2026-09-09: four
  # Full Suite Gate runs and five rosetta-audit runs for one commit), and a
  # re-push leaves the superseded run occupying the queue. cancel-in-progress
  # is scoped to pull_request on purpose -- the push/schedule/tag runs are the
  # ones that commit (docs, history charts, releases), and cancelling one
  # mid-write is how you get a half-written commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #6501: can the diff since the last successful run move this? (accuracy_audit_plan.py; an unknown base runs it)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # gh run list: the last successful run's commit
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff needs the last planned commit
          filter: blob:none  # #5882: history without file contents
          persist-credentials: false

      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tri-comparison-history.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          python3 tests/tools/accuracy_audit_plan.py --audit tri-comparison-history --event "$GITHUB_EVENT_NAME" --base "${base:-HEAD}" \
            --github-output "$GITHUB_OUTPUT" | tee plan.json
          {
            echo "## Accuracy-history plan"
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tri-comparison-history:
    needs: [plan]
    if: ${{ always() }}  # a failed plan runs it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout GitGalaxy
        if: needs.plan.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          fetch-depth: 0
          # #4847: the publish step pushes to `generated` with this checkout's token. The job runs main's code on a
          # push to main / dispatch only, never PR code (the same reasoning as evidence-pages.yml).
          persist-credentials: true

      - name: Setup Python
        if: needs.plan.outputs.run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy + tree-sitter-language-pack
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python -m pip install --require-hashes -r ci/requirements/bootstrap.txt
          pip install --no-build-isolation -e .
          pip install --require-hashes -r ci/requirements/treesitter.txt

      # Same hard preflight as tri-comparison-audit.yml, for the same PR #2111 reason -- this
      # job WRITES the chart/ledger, so a silently-degraded ctags here would commit bad data to
      # main instead of just failing a single PR check.
      - name: Install universal-ctags and verify it's the real thing
        if: needs.plan.outputs.run != 'false'
        run: |
          # #5048: a mirror hiccup is infrastructure, not a code defect: bounded retry, then an INFRASTRUCTURE marker.
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y universal-ctags'
          if ! ctags --version | grep -q "Universal Ctags"; then
            echo "::error::ctags on PATH is not Universal Ctags -- refusing to write a silently-degraded chart/ledger."
            ctags --version || true
            exit 1
          fi

      - name: Fetch Language Crucible corpus (pinned in tests/crucible_pins.toml)
        if: needs.plan.outputs.run != 'false'
        run: |
          # The pin is tests/crucible_pins.toml (one source; a fork PR reads it too).
          ref=$(python3 gitgalaxy/tests/tools/crucible_pins.py get language)
          gitgalaxy/tests/tools/ci_retry.sh 4 10 -- bash -c 'rm -rf language-crucible && git clone --branch "$1" --depth 1 https://github.com/squid-protocol/language-crucible.git language-crucible' _ "$ref"

      - name: Regenerate chart + ledger + points-of-interest report
        if: needs.plan.outputs.run != 'false'
        run: |
          cd gitgalaxy
          python tests/tools/tri_comparison_chart.py --all --write
          python tests/tools/tri_comparison_report.py --write

      # #4847: output goes to the `generated` branch, never to main (no PR, no auto-merge: main no longer takes a bot
      # commit per run). Only main may write it; a dispatch from another ref publishes nothing.
      - name: Publish to the generated branch
        if: needs.plan.outputs.run != 'false' && github.ref == 'refs/heads/main'
        run: |
          cd gitgalaxy
          python tests/tools/generated_branch.py publish --stamp tri-comparison-history \
            --message "tri-comparison-history as of main $GITHUB_SHA" \
            docs/self_scan/tri_comparison_chart.svg \
            docs/self_scan/tri_comparison_ledger.json \
            docs/self_scan/tri_comparison_points_of_interest.md
