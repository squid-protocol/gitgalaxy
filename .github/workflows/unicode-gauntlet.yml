name: unicode-gauntlet

# #3812 (epic #3811): every read GitGalaxy makes is assumed wrong until the Unicode Gauntlet proves
# it. Each trusted seed (keyword-rosetta's 51 languages, plus the mainframe channel seed in
# tests/unicode_gauntlet/mainframe) is rewritten -- names in another script where the language
# allows it, files re-encoded (UTF-8 BOM, UTF-16, cp1252, Shift-JIS, GB18030, CRLF) -- and each
# variant's scanned facts must equal its ASCII twin's with the same renaming. The baseline is a
# ratchet: a cell failing that tests/unicode_gauntlet/baseline.txt does not list fails the run; a
# fix lowers the baseline. The rosetta corpus is checked out at the commit the baseline recorded, so
# a corpus change cannot move the cells under a PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # #5104: a draft starts only the cheap audits
    branches: [main, v6-dev]
    paths:
      - "gitgalaxy/**"
      # #6278 slice 4: this job only scans. The scan never imports the COBOL-to-Java translator or its controllers (the same
      # exclusions as the ground-truth scan key, test_engine_reach_workflows.py pins them); det/copy stays, a scan reads it.
      - "!gitgalaxy/tools/cobol_to_java/*"
      - "!gitgalaxy/tools/cobol_to_java/det/*"
      - "!gitgalaxy/tools/cobol_to_java/det/cobolrt/**"
      - "!gitgalaxy/cobol_to_java_controller.py"
      - "!gitgalaxy/cobol_refractor_controller.py"
      - "pyproject.toml"
      - "tests/tools/unicode_gauntlet.py"
      - "tests/unicode_gauntlet/**"
      - ".github/workflows/unicode-gauntlet.yml"
  # #5131/#5136: no main push trigger. post-merge.yml dispatches this on main (at most once per cadence window, only
  # when PR runners are idle and main changed a file this workflow reads); the nightly run covers a busy day.
  schedule:
    - cron: "37 6 * * *"  # nightly (#5136)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # #4825: read-only, so a superseded main run is cancelled too (frees runners for PRs)

jobs:
  gauntlet:
    # #6670: not on a PR (it never failed on one in 7 days; pr_gates.py runs it before a push). The pull_request trigger
    # stays for its `paths`: post_merge_dispatch.py reads them as this workflow's relevance filter on main.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitGalaxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitgalaxy
          persist-credentials: false

      - name: Read the pinned rosetta commit
        id: pin
        run: |
          ref=$(tr -d '[:space:]' < gitgalaxy/tests/unicode_gauntlet/rosetta_ref)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout keyword-rosetta (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: squid-protocol/keyword-rosetta
          ref: ${{ steps.pin.outputs.ref }}
          path: keyword-rosetta
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gitgalaxy/pyproject.toml
            gitgalaxy/ci/requirements/*.txt

      - name: Install GitGalaxy
        run: |
          python -m pip install --require-hashes -r gitgalaxy/ci/requirements/bootstrap.txt
          pip install --require-hashes -r gitgalaxy/ci/requirements/engines.txt
          pip install --no-build-isolation -e ./gitgalaxy

      - name: Run the gauntlet against its baseline
        env:
          GITGALAXY_LICENSE_KEY: COMMUNITY_FREE_TIER
        run: |
          cd gitgalaxy
          python tests/tools/unicode_gauntlet.py --corpus ../keyword-rosetta --ci --out "$RUNNER_TEMP/gauntlet"

      - name: Publish the matrix
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gauntlet/report.md" ]; then cat "$RUNNER_TEMP/gauntlet/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
