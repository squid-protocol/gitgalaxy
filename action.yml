name: 'GitGalaxy Scanner'
description: 'Repo intelligence for humans and AI, without compilation: architecture mapping, risk scoring, SBOM/SARIF output, CI/CD.'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  tool:
    description: >
      The GitGalaxy command to execute. 
      Options: galaxyscope, blast, vault-sentinel, supply-chain-firewall, xray-inspector, pii-leak-hunter, terabyte-log-scanner, api-network-map. (Note: SARIF and SBOM generation are now native to galaxyscope).
    required: true
    default: 'galaxyscope'
  target:
    description: 'The directory or file path to scan.'
    required: true
    default: '.'
  args:
    description: 'Additional CLI arguments to pass to the tool (e.g., --sarif-only, --sbom-only, --fail-on-secrets, --fail-on-malware, --max-systemic-threat 150.0).'
    required: false
    default: ''
  version:
    description: 'The version of GitGalaxy to install from PyPI. Defaults to latest.'
    required: false
    default: 'latest'
  full_precision:
    description: 'Opt-in to install the optional engines (tiktoken, xgboost/pandas/numpy) for token mass and ML Threat Inference. Graph metrics such as Blast Radius need none.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #
      with:
        python-version: '3.10'

    # Inputs reach the scripts only through env vars (GitHub script-injection
    # hardening): the runner never splices caller-controlled text into the
    # shell source, and every variable below is expanded inside double quotes.
    - name: Install GitGalaxy
      shell: bash
      env:
        GALAXY_ACT_VERSION: ${{ inputs.version }}
        GALAXY_ACT_FULL_PRECISION: ${{ inputs.full_precision }}
      run: |
        if [ "$GALAXY_ACT_VERSION" = "local" ]; then
          echo "Dogfooding local GitGalaxy source..."
          pip install -e ".[yaml]"
        elif [ "$GALAXY_ACT_VERSION" = "latest" ]; then
          echo "Installing latest GitGalaxy from PyPI..."
          pip install "gitgalaxy[yaml]"
        else
          echo "Installing GitGalaxy version ${GALAXY_ACT_VERSION}..."
          pip install "gitgalaxy[yaml]==${GALAXY_ACT_VERSION}"
        fi

        if [ "$GALAXY_ACT_FULL_PRECISION" = "true" ]; then
          echo "Unlocking Full Precision Mode..."
          pip install tiktoken xgboost pandas numpy
        else
          echo "Running in ultra-fast Zero-Dependency Mode."
        fi

    - name: Execute GitGalaxy Tool
      shell: bash
      env:
        GITGALAXY_LICENSE_KEY: "COMMUNITY_FREE_TIER"
        GALAXY_ACT_TOOL: ${{ inputs.tool }}
        GALAXY_ACT_TARGET: ${{ inputs.target }}
        GALAXY_ACT_ARGS: ${{ inputs.args }}
      run: |
        # Split GALAXY_ACT_ARGS on whitespace into an array. `read -a` does word
        # splitting only: no eval, no command/variable substitution, no globbing.
        read -r -a galaxy_act_args <<< "$GALAXY_ACT_ARGS"
        echo "Running: $GALAXY_ACT_TOOL $GALAXY_ACT_TARGET ${galaxy_act_args[*]}"
        "$GALAXY_ACT_TOOL" "$GALAXY_ACT_TARGET" "${galaxy_act_args[@]}"
