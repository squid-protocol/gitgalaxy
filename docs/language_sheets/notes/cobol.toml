context = "legacy/mainframe"

[ceiling]
parsers = "A tree-sitter COBOL grammar exists in tree-sitter-language-pack, but the tree-sitter accuracy audit has no node map for it yet, so functions are not compared against tree-sitter. GnuCOBOL is the runtime oracle for the equivalence work."
corpus = "Nine pinned open estates keyed by hand: CardDemo, CBSA, GenApp, zECS, DSF, DBB MortgageApplication, example-health-apis, zopeneditor-sample and the cicsdev async credit-card example (168 programs)."
reference_analyser = "None independent of this repo's own answer-key reader."
best_method = "A hand-built answer key from a separately written reader, re-read by blind LLM reviewers (cross_verified). No mainframe engineer has signed any field (human_signed)."
why = "Proprietary mainframe dialects (IBM Enterprise COBOL, CICS, Db2), few public parsers, and estates that are hard to obtain."
status = "unconfirmed"

[stat_notes]
functions = "Paragraphs and sections (the `units` field) against the answer key, summed over 9 corpora. The reviewers are LLMs, not people. The answer key shares no code with the engine."
calls = "PERFORM and GO TO edges inside a program (`intra-program edges`). Recall is 92.6% because 184 of the 192 missed edges are a defect recorded in the ground-truth ledger: GO TO ... DEPENDING records only its first target (the ledger cites #4244). 8 are by design: a GO TO back to the paragraph it is in is not recorded (#3362). Some corpora's edges are still at the draft tier, so the row's weakest tier is draft. CALL targets alone are 202 of 202, cross_verified."
imports = "COPY members resolved to a file (`copybook paths`). The 10 extra paths are by design: IBM-supplied system copybooks are resolved to a shipped stand-in (#8120)."
