<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 326" width="812" height="326" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<style>
  .surface { fill: #fcfcfb; }
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .subtitle { font-size: 11px; fill: #52514e; }
  .scope-note { font-size: 10px; fill: #706f6a; }
  .panel-title { font-size: 10.5px; font-weight: 600; fill: #0b0b0b; text-anchor: middle; }
  .summary-title { font-size: 10.5px; font-weight: 600; fill: #0b0b0b; text-anchor: start; }
  .lang-label { font-size: 13px; font-weight: 700; fill: #0b0b0b; }
  .bar-value-label { font-size: 8px; fill: #ffffff; text-anchor: middle; font-weight: 600; }
  .legend-label { font-size: 10px; fill: #0b0b0b; }
  .stripe { fill: #f0efec; }
  .awaiting { font-size: 9.5px; fill: #9a9a95; font-style: italic; }
  .bar-track { fill: #eeede9; }
  .badge-label { font-size: 8.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
</style>
<rect class="surface" x="0" y="0" width="812" height="326"/>
<text class="title" x="16" y="20">GitGalaxy Structural Extraction: Tri-Comparison vs. Tree-sitter and ctags</text>
<text class="subtitle" x="16" y="36">2026-08-22 &#183; source: tests/tools/tri_comparison_chart.py &#183; ledger: docs/self_scan/tri_comparison_ledger.json</text>
<text class="scope-note" x="16" y="52">No tool is ground truth. Found-count panels are unranked raw counts (no badge) -- a shared "how many are real" denominator turned out as corruptible as any one tool's own noise. Precision is each tool's own claims vs. what another tool corroborated.</text>
<text class="scope-note" x="16" y="64">Bar groups vary 1-3 by language's tool coverage -- order is always GitGalaxy, tree-sitter, ctags. css/html class panels are out of scope by design (selectors, not OOP classes).</text>
<text class="scope-note" x="16" y="76">`*` marks EVERY tool's label in a cell with any unvalidated disagreement, not just GitGalaxy's -- not a verdict either way. Badge = the tool that scored strictly highest on a RANKED, UN-disputed panel (blank on a tie, a disputed cell, or a found-count panel).</text>
<text class="scope-note" x="16" y="88">See docs/self_scan/how_to_investigate_a_discrepancy.md for what `*` is asking for.</text>
<rect x="16" y="100" width="14" height="8" rx="2" fill="#2a78d6"/>
<text class="legend-label" x="34" y="108">GitGalaxy</text>
<rect x="135" y="100" width="14" height="8" rx="2" fill="#eb6834"/>
<text class="legend-label" x="153" y="108">tree-sitter</text>
<rect x="272" y="100" width="14" height="8" rx="2" fill="#1baf7a"/>
<text class="legend-label" x="290" y="108">ctags</text>
<text class="legend-label" x="355" y="108">* = unvalidated disagreement here</text>
<text class="legend-label" x="16" y="122">** = validated by human/LLM inspection in lieu of another function-finding tool</text>
<text class="legend-label" x="16" y="136">Args Found markers -- † = program-level signature, not per-function &#183; ‡ = no parameter-list concept exists for this language &#183; § = derived from a non-parenthetical proxy, not a parameter list</text>
