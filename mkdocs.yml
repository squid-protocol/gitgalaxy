site_name: "GitGalaxy"
site_description: "The deterministic structural architecture of massive software repositories."
site_author: "Joseph Michael Esquibel"
site_url: "https://squid-protocol.github.io/gitgalaxy/"
site_dir: "docs_build"

repo_name: "squid-protocol/gitgalaxy"
repo_url: "https://github.com/squid-protocol/gitgalaxy"

copyright: "Copyright &copy; 2026 Joseph Michael Esquibel"

theme:
  name: "material"
  palette:
    scheme: "slate"
    primary: "deep purple"
    accent: "cyan"
  features:
    - "navigation.tabs"
    - "navigation.sections"
    - "navigation.top"
    - "navigation.indexes"
    - "search.suggest"
    - "search.highlight"
    - "content.code.copy"
    - "toc.integrate"

extra:
  social:
    - icon: "fontawesome/solid/globe"
      link: "https://gitgalaxy.io/"
      name: "GitGalaxy Visualizer"
    - icon: "fontawesome/brands/github"
      link: "https://github.com/squid-protocol/gitgalaxy"
      name: "GitHub Source Code"

docs_dir: "docs/wiki"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

extra_javascript:
  - "javascripts/mathjax.js"
  - "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"

