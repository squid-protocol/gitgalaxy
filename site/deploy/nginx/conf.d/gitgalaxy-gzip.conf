# /etc/nginx/conf.d/gitgalaxy-gzip.conf   (http context; nginx only compresses text/html by default,
# which left the JS, CSS and the 150 MB of galaxy JSON uncompressed)
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json
           application/javascript text/javascript application/ld+json image/svg+xml text/markdown;
