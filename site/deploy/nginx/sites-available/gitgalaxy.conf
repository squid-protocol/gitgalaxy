server {
    server_name gitgalaxy.io www.gitgalaxy.io;
    root /var/www/gitgalaxy/site;
    index index.html;

    # Security headers (CSP is report-only for now); see site/deploy/nginx in the repo.
    include snippets/gitgalaxy-security-headers.conf;

    # Not meant to be public: dotfiles, server code, deploy files, repo docs, blog drafts.
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.py$ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /blog/posts/ { return 404; }
    location = /DEPLOY.md { return 404; }
    # Dev-only page that still loads a CDN; the enforced CSP would break it, so it is not public.
    location = /tools/style_guide.html { return 404; }

    # Vendored third-party files (three.js, tween.js, fonts). ^~ keeps the .js regex rule below from matching them.
    location ^~ /vendor/ {
        include snippets/gitgalaxy-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /index.html {
        include snippets/gitgalaxy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(?:js|css)$ {
        include snippets/gitgalaxy-security-headers.conf;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }


    # ==========================================
    # ---> PASTE THESE TWO NEW BLOCKS HERE <---
    # ==========================================
    location /data/ {
            alias /var/www/gitgalaxy_data/;
            include snippets/gitgalaxy-security-headers.conf;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400" always;
            gzip_static on;
    }

    location /museum/ {
            alias /var/www/gitgalaxy_data/;
            include snippets/gitgalaxy-security-headers.conf;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400" always;
            gzip_static on;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gitgalaxy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gitgalaxy.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.gitgalaxy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gitgalaxy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name gitgalaxy.io www.gitgalaxy.io;
    return 404; # managed by Certbot




}
