# /etc/nginx/snippets/gitgalaxy-security-headers.conf
# nginx does NOT inherit add_header into a location that sets its own add_header, so this file is
# included at server level AND inside every location that adds headers (/data/, /museum/).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# REPORT-ONLY first: violations show in the browser console but nothing is blocked. After a week of
# clean visits on desktop and phone, rename this header to Content-Security-Policy to enforce it.
# 'unsafe-inline' is needed because the viewer page is a single file with inline scripts and styles.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
