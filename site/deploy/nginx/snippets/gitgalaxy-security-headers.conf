# /etc/nginx/snippets/gitgalaxy-security-headers.conf
# nginx does NOT inherit add_header into a location that sets its own add_header, so this file is
# included at server level AND inside every location that adds headers (/data/, /museum/).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# ENFORCED content-security-policy. Everything the pages load is served from this origin (three.js, tween.js and the
# fonts are vendored in site/vendor), so no third-party host is allowed anywhere.
# 'unsafe-inline' stays for scripts and styles because the viewer page is one file with inline scripts and styles;
# moving them out (or hashing them) is a separate piece of work. blob: is for the poster download and image decoding.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
