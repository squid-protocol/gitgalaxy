# GitGalaxy Enterprise Security Scanner
# Integration: Azure DevOps Pipelines

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

variables:
  PIP_CACHE_DIR: '$(Pipeline.Workspace)/.pip-cache'
  GITGALAXY_LICENSE_KEY: 'COMMUNITY_FREE_TIER'

stages:
- stage: SecurityScan
  displayName: 'GitGalaxy Zero-Trust Audit'
  jobs:

  - job: VaultSentinel
    displayName: 'Vault Sentinel'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
        python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
        echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
        pip install --require-hashes -r /tmp/gg-requirements.txt
      displayName: 'Install GitGalaxy'
    - checkout: self
      fetchDepth: 0
    - script: vault-sentinel .
      displayName: 'Run Vault Sentinel'

  - job: XrayInspector
    displayName: 'X-Ray Inspector'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
        python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
        echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
        pip install --require-hashes -r /tmp/gg-requirements.txt
      displayName: 'Install GitGalaxy'
    - checkout: self
      fetchDepth: 0
    - script: xray-inspector .
      displayName: 'Run X-Ray Inspector'

  - job: SupplyChainFirewall
    displayName: 'Supply Chain Firewall'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
        python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
        echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
        pip install --require-hashes -r /tmp/gg-requirements.txt
      displayName: 'Install GitGalaxy'
    - checkout: self
      fetchDepth: 0
    - script: supply-chain-firewall .
      displayName: 'Run Supply Chain Firewall'

  - job: GalaxyScopeReport
    displayName: 'GalaxyScope Reporting (SARIF + ML Malware Gate)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - task: Cache@2
      inputs:
        key: 'pip | "$(Agent.OS)"'
        path: $(PIP_CACHE_DIR)
        cacheHitVar: PIP_CACHE_RESTORED
      displayName: 'Configure Dependency Caching'
    - script: |
        GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=afe6988fe90e47659a963be73e1c30a28128f0beb4d46977ec7185b4a8e80c7d # gg-pin:full
        python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/full.txt" /tmp/gg-requirements.txt
        echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
        pip install --require-hashes -r /tmp/gg-requirements.txt
      displayName: 'Install GitGalaxy & Heavy Physics Engines'
    - checkout: self
      fetchDepth: 0
    - script: |
        # --config is fatal on a missing file: pass it only when the repository has one
        CONFIG_ARG=""; if [ -f .galaxyscope.yaml ]; then CONFIG_ARG="--config .galaxyscope.yaml"; fi
        galaxyscope . $CONFIG_ARG --fail-on-malware --sarif-only --output $(Build.ArtifactStagingDirectory)/gitgalaxy-results.json
      displayName: 'Execute Zero-Trust Spectral Audit'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/gitgalaxy-results_sarif.json'
        artifact: 'GitGalaxySecurityLogs'
        publishLocation: 'pipeline'
      displayName: 'Upload SARIF Security Metrics'
      condition: always()
