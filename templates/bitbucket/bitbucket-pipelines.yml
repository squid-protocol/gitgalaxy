# GitGalaxy Enterprise Security Scanner
# Integration: Bitbucket Pipelines
#
# Requires bitbucket_insights.py in the same directory as this file —
# it publishes GitGalaxy's SARIF findings as native Bitbucket Code Insights
# PR annotations. Copy both files together; this pipeline will still run
# without it, but PR annotations will not be published.

image: python:3.12-slim

clone:
  depth: full

pipelines:
  default:
    - parallel:
        - step:
            name: 'Vault Sentinel'
            caches:
              - pip
            script:
              - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"
              - |
                GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
                python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
                echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
                pip install --require-hashes -r /tmp/gg-requirements.txt
              - vault-sentinel .

        - step:
            name: 'X-Ray Inspector'
            caches:
              - pip
            script:
              - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"
              - |
                GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
                python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
                echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
                pip install --require-hashes -r /tmp/gg-requirements.txt
              - xray-inspector .

        - step:
            name: 'Supply Chain Firewall'
            caches:
              - pip
            script:
              - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"
              - |
                GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=f3a1ca03e1602dcd7fc05b5d2004712a99d3423c5f7454fa5ecb7e2201bd8a0f # gg-pin:core
                python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/core.txt" /tmp/gg-requirements.txt
                echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
                pip install --require-hashes -r /tmp/gg-requirements.txt
              - supply-chain-firewall .

        - step:
            name: 'GalaxyScope Reporting (SARIF + ML Malware Gate)'
            caches:
              - pip
            script:
              - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"
              - |
                GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=afe6988fe90e47659a963be73e1c30a28128f0beb4d46977ec7185b4a8e80c7d # gg-pin:full
                python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/full.txt" /tmp/gg-requirements.txt
                echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
                pip install --require-hashes -r /tmp/gg-requirements.txt
              - |
                galaxyscope . --config .galaxyscope.yaml --fail-on-malware --sarif-only --output gitgalaxy-results.json
              # Publishes SARIF results as native Bitbucket Code Insights PR
              # annotations. Requires bitbucket_insights.py (see header note).
              - python bitbucket_insights.py gitgalaxy-results_sarif.json
            artifacts:
              - gitgalaxy-results_sarif.json
