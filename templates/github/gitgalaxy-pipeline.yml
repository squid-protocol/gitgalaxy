name: GitGalaxy Zero-Trust Pipeline

on:
  push:
    branches:
      - main

# NOTE (#4918): the three `uses: squid-protocol/gitgalaxy@<sha> # v2.4.0` steps below still run the v2.4.0 action,
# which installs unpinned. Bump them to the first release that ships templates/requirements/ (the
# hash-pinned lockfiles the action reads); until that tag exists the bump would point at an action
# with no lockfiles. An explicit `version:` input of a release older than the `full` extra drops the
# ML engines (pip warns "does not provide the extra 'full'" and the scan runs in Zero-Dependency Mode).
jobs:
  vault-sentinel:
    name: Vault Sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: squid-protocol/gitgalaxy@8cfa3b24c9b2f199858980084154d88a6a318317 # v2.4.0
        with:
          tool: 'vault-sentinel'
          target: '.'

  xray-inspector:
    name: X-Ray Inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: squid-protocol/gitgalaxy@8cfa3b24c9b2f199858980084154d88a6a318317 # v2.4.0
        with:
          tool: 'xray-inspector'
          target: '.'

  supply-chain-firewall:
    name: Supply Chain Firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: squid-protocol/gitgalaxy@8cfa3b24c9b2f199858980084154d88a6a318317 # v2.4.0
        with:
          tool: 'supply-chain-firewall'
          target: '.'

  galaxyscope-report:
    name: GalaxyScope Reporting (SARIF + ML Malware Gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to the Security tab
    env:
      GITGALAXY_LICENSE_KEY: 'COMMUNITY_FREE_TIER'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install GitGalaxy & Full Precision Engines
        run: |
          GG_REF=04c85c32f8c9eb9bc5c830de3e8d08b4efde0e5a GG_SHA256=afe6988fe90e47659a963be73e1c30a28128f0beb4d46977ec7185b4a8e80c7d # gg-pin:full
          python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/full.txt" /tmp/gg-requirements.txt
          echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
          pip install --require-hashes -r /tmp/gg-requirements.txt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Execute Zero-Trust Spectral Audit
        run: |
          galaxyscope . --config .galaxyscope.yaml --fail-on-malware --sarif-only --output gitgalaxy-results.json

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: gitgalaxy-results_sarif.json
