# GitGalaxy Enterprise Security Scanner
# Integration: GitLab CI/CD Component
#
# This is a generic, single-tool component — call it once per tool to build
# the 4-check Golden Path (vault-sentinel, xray-inspector,
# supply-chain-firewall, galaxyscope). See github-action-readme.md for the
# full tool directory. Only 'galaxyscope' accepts the args in the example
# below (--config, --fail-on-malware, --sarif-only, --output); the three
# sentinel tools take no flags beyond the target path.

spec:
  inputs:
    tool:
      description: "The GitGalaxy command to execute (galaxyscope, vault-sentinel, xray-inspector, or supply-chain-firewall)."
      default: "galaxyscope"
    target:
      description: "The directory or file path to scan."
      default: "."
    args:
      description: "Additional CLI arguments. Only meaningful for 'galaxyscope' — the sentinel tools accept no flags."
      default: ""
    version:
      description: "GitGalaxy version to install. 'latest' (default) means the hash-pinned release (fetched from an immutable ref, sha256-verified); an explicit version is exact-pinned but not hash-verified."
      default: "latest"
    full_precision:
      description: "Opt-in to install heavy physics engines for Blast Radius and ML Threat Inference. Only relevant when tool: galaxyscope."
      default: "false"

---

gitgalaxy_scan:
  stage: test
  image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    GIT_DEPTH: "0"
  cache:
    paths:
      - .cache/pip
  script:
    - echo "Initializing GitGalaxy Component Environment..."
    - export GG_TOOL="$[[ inputs.tool ]]"
    - export GG_TARGET="$[[ inputs.target ]]"
    - export GG_ARGS="$[[ inputs.args ]]"
    - export GG_VERSION="$[[ inputs.version ]]"
    - export GG_FULL_PRECISION="$[[ inputs.full_precision ]]"
    - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"

    - |
      # Hash-pinned by default: the requirements file is fetched from an immutable commit of the
      # GitGalaxy repo and its sha256 is verified before pip --require-hashes uses it. An
      # explicit `version` is an opt-out of hash checking and is pinned to that exact release.
      if [ "$GG_FULL_PRECISION" = "true" ]; then GG_REQS=full; else GG_REQS=yaml; fi
      if [ "$GG_VERSION" = "local" ]; then
        echo "Dogfooding local GitGalaxy source..."
        pip install --require-hashes -r ci/requirements/bootstrap.txt
        pip install --no-build-isolation -e ".[yaml]"
      elif [ "$GG_VERSION" = "latest" ]; then
        echo "Installing the hash-pinned GitGalaxy release..."
        # Marker lines are stamped by tests/tools/stamp_template_pins.py (one per set).
        if [ "$GG_REQS" = full ]; then
          GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=afe6988fe90e47659a963be73e1c30a28128f0beb4d46977ec7185b4a8e80c7d # gg-pin:full
        else
          GG_REF=f674bfffe73180187bc5a3f18b5fd3f2652b1557 GG_SHA256=78f86737b10dcc4af220970181f15024aee1bc9d9201eaf86d1b8eb419c41040 # gg-pin:yaml
        fi
        python -c "import sys,urllib.request as u; u.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/squid-protocol/gitgalaxy/${GG_REF}/templates/requirements/${GG_REQS}.txt" /tmp/gg-requirements.txt
        echo "${GG_SHA256}  /tmp/gg-requirements.txt" | sha256sum -c -
        pip install --require-hashes -r /tmp/gg-requirements.txt
      else
        echo "Installing GitGalaxy version ${GG_VERSION} (NOT hash-verified)..."
        pip install "gitgalaxy[${GG_REQS}]==${GG_VERSION}"
      fi
    - 'echo "Running: ${GG_TOOL} ${GG_TARGET} ${GG_ARGS}"'
    - ${GG_TOOL} ${GG_TARGET} ${GG_ARGS}
  artifacts:
    when: always
    reports:
      # Only populated when tool: galaxyscope --sarif-only is used.
      # Harmless no-op (GitLab just won't find the file) for the sentinel tools.
      sast: gitgalaxy-results_sarif.json
  allow_failure: false
