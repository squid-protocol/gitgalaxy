# GitGalaxy Enterprise Security Scanner
# Integration: GitLab CI/CD Component

spec:
  inputs:
    tool:
      description: "The GitGalaxy command to execute."
      default: "galaxyscope"
    target:
      description: "The directory or file path to scan."
      default: "."
    args:
      description: "Additional CLI arguments to pass to the tool."
      default: "--config .galaxyscope.yaml --max-risk-exposure 120 --fail-on-malware --sarif-only --output gitgalaxy-results.json"
    version:
      description: "GitGalaxy version to install. 'latest' (default) means the hash-pinned release in templates/requirements/; an explicit version is exact-pinned but not hash-verified."
      default: "latest"
    full_precision:
      description: "Opt-in to install heavy physics engines for Blast Radius and ML Threat Inference."
      default: "true"

---

gitgalaxy_scan:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    GIT_DEPTH: "0"  # Forces full chronological fetch to prevent Temporal Collapse
  cache:
    paths:
      - .cache/pip
  script:
    - echo "Initializing GitGalaxy Component Environment..."
    - export GG_TOOL="$[[ inputs.tool ]]"
    - export GG_TARGET="$[[ inputs.target ]]"
    - export GG_ARGS="$[[ inputs.args ]]"
    - export GG_VERSION="$[[ inputs.version ]]"
    - export GG_FULL_PRECISION="$[[ inputs.full_precision ]]"
    - export GITGALAXY_LICENSE_KEY="COMMUNITY_FREE_TIER"
    
    - |
      # Hash-pinned by default: versions and artifact hashes come from the requirements files
      # (templates/requirements/, copy that directory next to this file's repo checkout). An
      # explicit `version` is an opt-out of hash checking and is pinned to that exact release.
      if [ "$GG_FULL_PRECISION" = "true" ]; then GG_REQS=full; else GG_REQS=yaml; fi
      if [ "$GG_VERSION" = "local" ]; then
        echo "Dogfooding local GitGalaxy source..."
        pip install -e ".[yaml]"
      elif [ "$GG_VERSION" = "latest" ]; then
        echo "Installing the hash-pinned GitGalaxy release..."
        pip install --require-hashes -r "templates/requirements/${GG_REQS}.txt"
      else
        echo "Installing GitGalaxy version ${GG_VERSION} (NOT hash-verified)..."
        pip install "gitgalaxy[${GG_REQS}]==${GG_VERSION}"
      fi
    - 'echo "Running: ${GG_TOOL} ${GG_TARGET} ${GG_ARGS}"'
    - ${GG_TOOL} ${GG_TARGET} ${GG_ARGS}
  artifacts:
    when: always
    reports:
      # Automatically maps the SARIF output directly into GitLab's native Security Dashboard
      sast: gitgalaxy-results_sarif.json
  allow_failure: false
